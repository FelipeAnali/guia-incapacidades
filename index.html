<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<!--
  ============================================================================
  ENVÍO DE INCAPACIDADES — Supertiendas Cañaveral S.A.S.
  ----------------------------------------------------------------------------
  Página donde el COLABORADOR envía su incapacidad o licencia completa desde
  el celular. Es la "hermana" de la app de Documentos de ingreso: mismo estilo,
  misma forma de guardar y de enviar.
  La página:
    1. Pide si el dispositivo es propio y la autorización de datos de salud.
    2. Pide nombre, cédula, celular y sede.
    3. Pide el tipo (018 enfermedad general, 019 accidente de trabajo,
       020 licencia de maternidad, 021 licencia de paternidad), las fechas,
       los días, el código del diagnóstico (CIE-10) y si es prórroga.
    4. Pide SOLO los documentos de ese tipo. Cada documento se sube en PDF o
       con fotos (una por página). La app:
         - revisa que las fotos no estén borrosas, oscuras ni muy pequeñas,
         - comprime las fotos y las une en un solo PDF por documento,
         - comprime los PDF que pesan más del máximo (2 MB),
         - muestra cómo quedó y pregunta "¿Se lee bien?" antes de guardarlo.
    5. Arma un ZIP (un PDF por documento + datos_incapacidad.json) y lleva al
       colaborador a subirlo a la carpeta "Incapacidades" de OneDrive.

  PRIVACIDAD (la historia clínica y el diagnóstico son DATOS SENSIBLES):
    - Esta página NO tiene servidor. Los archivos nunca se envían a GitHub
      ni a ningún otro lado: viven en el navegador del colaborador.
    - Si el colaborador dice que el dispositivo es suyo, el avance se guarda
      en SU navegador (IndexedDB) por unos días y luego se borra solo.
    - Si el dispositivo es prestado, no se guarda nada y la página se limpia
      sola tras unos minutos sin uso.

  ¿QUÉ SE PUEDE EDITAR SIN SABER PROGRAMAR?
    Solo el bloque "CONFIGURACIÓN" (link de subida, sedes, tipos, documentos,
    pesos, textos, carta de paternidad). El resto es el código de la app.

  MODO PRUEBA:
    Abre la página con ?prueba=1 al final de la dirección para ver un
    selector abajo que llena la app con datos de prueba (no guarda nada).

  MAPA DEL CÓDIGO (en este orden dentro del archivo):
    ESTILO            Colores de la marca, estilo iPhone y modo oscuro.
    CONFIGURACIÓN     Lo que se edita: link, sedes, tipos, documentos, pesos, textos.
    LOGO              Logo de Cañaveral incrustado (imagen en texto base64).
    1. GUARDADO LOCAL Guardar/leer/borrar el avance en el navegador (IndexedDB).
    2. FUNCIONES      Fechas, diagnóstico, revisión y compresión de fotos y PDF,
                      carta de paternidad y armado del ZIP.
    3. PRUEBA         Datos de prueba del modo ?prueba=1.
    4. INACTIVIDAD    Limpieza automática en dispositivos prestados.
    5. PANTALLAS      Inicio → Datos → Incapacidad → Documentos → Envío → Final,
                      vista previa "¿Se lee bien?" y tutoriales.
    6. APP PRINCIPAL  Decide qué pantalla mostrar y guarda cada cambio.
  ============================================================================
-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<!-- Color de la barra del navegador en el celular (uno para modo claro y otro para oscuro) -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F6EF" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#08200F" />
<meta name="color-scheme" content="light dark" />
<!-- Si la guardan en la pantalla de inicio del iPhone, se abre como app -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>Envío de incapacidades · Cañaveral</title>

<!-- Nunito (tipografía corporativa del Manual de Marca) para los títulos; el resto usa la letra del iPhone -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet" />


<style>
  /* ==========================================================================
     ESTILO IPHONE (iOS)
     Colores de sistema de Apple + el verde de Cañaveral como color de acento.
     Todo se define aquí una vez; el modo oscuro solo cambia estos valores.
     ========================================================================== */
  :root {
    --tinte: #1D5A2B;                       /* acento: verde del logo Cañaveral */
    --texto-sobre-tinte: #FFFFFF;
    --tinte-suave: rgba(29, 90, 43, 0.12);  /* fondo de botones "tintados" */
    --lima: #7DD105;                        /* verde lima Cañaveral (avance, interruptor) */
    --tinta: #08200F;                       /* verde casi negro de la marca (portada) */
    --fondo: #F3F6EF;                       /* verde muy claro de la marca */
    --celda: #FFFFFF;                       /* fondo de las listas */
    --celda-presionada: #E6ECE1;
    --texto: #08200F;
    --texto-2: rgba(8, 32, 15, 0.6);        /* texto secundario */
    --separador: rgba(8, 32, 15, 0.16);
    --relleno: rgba(29, 90, 43, 0.09);      /* fondos verdes muy suaves */
    --rojo: #D93025;
    --alerta-fondo: #FFF4E5;
    --alerta-texto: #8A5300;
    --barra: rgba(243, 246, 239, 0.86);     /* barras translúcidas */
    --portada: #08200F;                     /* fondo de la portada de bienvenida */
    --sombra-flotante: 0 10px 30px rgba(8, 32, 15, 0.2);
    --radio: 12px;
    --ancho-contenido: 600px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --tinte: #7DD105;
      --texto-sobre-tinte: #08200F;
      --tinte-suave: rgba(125, 209, 5, 0.16);
      --fondo: #08200F;                     /* el verde oscuro de la marca */
      --celda: #10301A;
      --celda-presionada: #18402A;
      --texto: #FFFFFF;
      --texto-2: rgba(235, 245, 230, 0.62);
      --separador: rgba(125, 209, 5, 0.18);
      --relleno: rgba(255, 255, 255, 0.10);
      --rojo: #FF6B5E;
      --alerta-fondo: #2E2A10;
      --alerta-texto: #FFC24D;
      --barra: rgba(8, 32, 15, 0.86);
      --portada: #10301A;
    }
  }

  /* ==========================================================================
     AJUSTES PARA QUE SE SIENTA COMO APP EN EL CELULAR
     ========================================================================== */
  html {
    -webkit-tap-highlight-color: transparent; /* sin destello gris al tocar */
    -webkit-text-size-adjust: 100%;           /* sin texto agrandado al girar */
    overscroll-behavior: none;                /* sin "jalar para recargar" */
  }
  * { box-sizing: border-box; }
  /* Le avisa al navegador que la página maneja modo claro y oscuro, para que
     los controles nativos (desplegables, barras de scroll) usen el color correcto. */
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    /* -apple-system = San Francisco, la letra del iPhone */
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
    font-size: 17px;            /* tamaño de texto normal en iOS */
    line-height: 1.35;
    letter-spacing: -0.2px;
    background: var(--fondo);
    color: var(--texto);
    -webkit-font-smoothing: antialiased;
  }
  /* 16px o más en campos: evita que el iPhone haga zoom al escribir */
  input, select, textarea, button { font: inherit; font-size: 17px; color: inherit; letter-spacing: inherit; }
  /* Controles: respuesta inmediata al toque y sin seleccionar su texto */
  button, a, .fila-tocable {
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  a { color: var(--tinte); text-decoration: none; }
  :focus-visible { outline: 3px solid var(--lima); outline-offset: 2px; }
  .oculto { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  /* ==========================================================================
     ESTRUCTURA
     ========================================================================== */
  .app { min-height: 100dvh; display: flex; flex-direction: column; }
  .contenido {
    width: 100%;
    max-width: var(--ancho-contenido);
    margin: 0 auto;
    padding: 12px 16px 28px;
    flex: 1;
  }

  /* --- Barra de navegación translúcida (como las apps de Apple) --- */
  .barra-nav {
    position: sticky; top: 0; z-index: 10;
    background: var(--barra);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid var(--separador);
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
  }
  .barra-nav-interna { max-width: var(--ancho-contenido); margin: 0 auto; }
  .nav-fila { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  /* Logo de Cañaveral (verde). En modo oscuro se vuelve blanco con un filtro. */
  .logo { display: block; width: auto; }
  .logo-nav { height: 30px; }
  .logo-blanco { filter: brightness(0) invert(1); }
  @media (prefers-color-scheme: dark) { .logo-nav { filter: brightness(0) invert(1); } }

  /* Portada de bienvenida: verde oscuro de la marca con la curva lima de las piezas de Cañaveral */
  .portada {
    position: relative; overflow: hidden;
    background: var(--portada); color: #FFFFFF;
    border-radius: 20px; padding: 24px 20px 22px; margin: 4px 0 28px;
  }
  .portada::after {               /* curva lima decorativa (como en los banners de la marca) */
    content: ''; position: absolute; right: -160px; top: -70px;
    width: 220px; height: 300px; border-radius: 50%;
    border: 22px solid var(--lima);
  }
  .portada > * { position: relative; z-index: 1; max-width: 76%; }
  .portada .logo { height: 44px; margin-bottom: 18px; max-width: 100%; }
  .portada h1 { color: #FFFFFF; margin: 0 0 6px; }
  .portada p { color: rgba(255, 255, 255, 0.78); font-size: 16px; }
  .nav-paso { font-size: 15px; color: var(--texto-2); margin: 0; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* --- La "caña": barra de avance hecha de nudos, uno por documento --- */
  .cana { display: flex; gap: 4px; margin-top: 10px; }
  .nudo {
    flex: 1; height: 6px; border-radius: 3px;
    background: var(--relleno);
    transition: background 250ms ease-out;
  }
  .nudo.lleno { background: var(--lima); }
  .cana-texto {
    display: flex; justify-content: space-between; gap: 12px;
    font-size: 13px; color: var(--texto-2); margin-top: 5px;
    font-variant-numeric: tabular-nums;
  }

  /* --- Títulos (título grande de iOS) --- */
  h1 { font-family: 'Nunito', -apple-system, sans-serif; font-size: 33px; line-height: 1.12; font-weight: 900; letter-spacing: 0; margin: 8px 0 6px; }
  .bajada { color: var(--texto-2); font-size: 17px; margin: 0 0 24px; }
  p { margin: 0; }

  /* ==========================================================================
     LISTAS AGRUPADAS (el estilo de la app Ajustes del iPhone)
     ========================================================================== */
  .grupo { margin-bottom: 28px; }
  .grupo-titulo { font-size: 13px; color: var(--texto-2); margin: 0 16px 7px; }
  .grupo-pie { font-size: 13px; color: var(--texto-2); margin: 7px 16px 0; }
  .grupo-pie.error { color: var(--rojo); }
  .lista { background: var(--celda); border-radius: var(--radio); overflow: hidden; }

  .fila {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    min-height: 44px; padding: 11px 16px;
  }
  /* Línea separadora fina entre filas, con sangría como en iOS */
  .fila + .fila::before {
    content: ''; position: absolute; top: 0; right: 0;
    left: var(--sangria, 16px);
    height: 0.5px; background: var(--separador);
  }
  .fila-con-icono { --sangria: 58px; align-items: flex-start; }
  .fila-tocable { cursor: pointer; }
  .fila-tocable:active { background: var(--celda-presionada); }
  .fila-cuerpo { flex: 1; min-width: 0; }
  .fila-titulo { font-size: 17px; font-weight: 400; }
  .fila-titulo.fuerte { font-weight: 600; }
  .fila-sub { font-size: 15px; color: var(--texto-2); margin-top: 2px; }
  .fila-nombre { overflow-wrap: anywhere; }
  .marca-check { color: var(--tinte); flex-shrink: 0; display: flex; }

  /* --- Campos de texto dentro de la lista --- */
  .fila-campo { display: block; padding: 9px 16px 10px; }
  .sugerencia { --sangria: 16px; }
  /* Las sugerencias van dentro de su propio contenedor: se les pone la línea separadora a mano */
  #lista-cargos > .fila::before, #lista-cargos + .fila::before {
    content: ''; position: absolute; top: 0; right: 0; left: 16px;
    height: 0.5px; background: var(--separador);
  }
  .sugerencia .fila-titulo { font-size: 16px; }
  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }
  .fila-campo .etiqueta { display: block; font-size: 13px; color: var(--texto-2); margin-bottom: 2px; }
  .fila-campo input, .fila-campo select {
    width: 100%; border: 0; outline: 0; padding: 2px 0;
    background: transparent; min-height: 28px;
    -webkit-appearance: none; appearance: none;
  }
  .fila-campo input::placeholder { color: var(--texto-2); opacity: 0.7; }
  /* Opciones del desplegable de cargos: colores explícitos para que en modo oscuro
     no queden en letra blanca sobre fondo blanco (pasaba en Chrome de Windows). */
  .fila-campo select option { background: var(--celda); color: var(--texto); }
  .fila-campo.con-error .etiqueta { color: var(--rojo); }
  .selector-con-flecha { position: relative; }
  .selector-con-flecha::after {
    content: ''; position: absolute; right: 2px; top: 50%;
    width: 8px; height: 8px; margin-top: -6px;
    border-right: 2px solid var(--texto-2); border-bottom: 2px solid var(--texto-2);
    transform: rotate(45deg); pointer-events: none;
  }
  .selector-con-flecha select { padding-right: 24px; }

  /* --- Interruptor tipo iOS (para la autorización) --- */
  .interruptor {
    -webkit-appearance: none; appearance: none;
    width: 51px; height: 31px; border-radius: 31px; margin: 0;
    background: var(--relleno); position: relative; flex-shrink: 0; cursor: pointer;
    transition: background 200ms ease-out;
  }
  .interruptor::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 27px; height: 27px; border-radius: 50%; background: #fff;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 1px rgba(0, 0, 0, 0.16);
    transition: transform 200ms ease-out;
  }
  .interruptor:checked { background: var(--lima); }
  .interruptor:checked::after { transform: translateX(20px); }

  /* --- Círculo de estado (número o palomita) --- */
  .circulo {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: grid; place-items: center;
    font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;
    background: var(--relleno); color: var(--texto-2);
    margin-top: 1px;
  }
  .circulo.hecho { background: var(--lima); color: #05200b; }
  .circulo.activo { background: var(--tinte); color: var(--texto-sobre-tinte); }

  /* --- Archivos subidos dentro de un documento --- */
  .archivo {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--relleno); border-radius: 10px;
    padding: 7px 12px; margin-top: 8px; font-size: 15px;
  }
  .archivo-nombre { flex: 1 1 150px; min-width: 0; overflow-wrap: anywhere; }
  .archivo-peso { color: var(--texto-2); }
  .archivo-acciones { display: flex; gap: 16px; flex-shrink: 0; }
  .archivo-acciones .boton-texto { font-size: 15px; min-height: 32px; }
  .doc-error { color: var(--rojo); font-size: 15px; margin-top: 8px; }
  .doc-acciones { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 10px; }

  /* ==========================================================================
     BOTONES (estilo iOS: relleno, tintado y de texto)
     ========================================================================== */
  .boton {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 50px; padding: 0 20px; border: 0; border-radius: 14px;
    font-size: 17px; font-weight: 600; cursor: pointer; text-decoration: none;
    transition: opacity 120ms ease-out;
  }
  .boton:active:not(:disabled) { opacity: 0.6; }      /* iOS atenúa al tocar */
  .boton:disabled, .boton[aria-disabled="true"] { opacity: 0.35; cursor: not-allowed; }
  .boton-principal { width: 100%; background: var(--tinte); color: var(--texto-sobre-tinte); }
  .boton-tintado { background: var(--tinte-suave); color: var(--tinte); }
  .boton-chico { min-height: 34px; padding: 0 14px; border-radius: 999px; font-size: 15px; }
  .boton-texto {
    background: none; border: 0; padding: 0; cursor: pointer;
    color: var(--tinte); font-size: 17px; min-height: 44px;
  }
  .boton-texto:active { opacity: 0.5; }
  .boton-texto.peligro { color: var(--rojo); }
  .boton-texto:disabled { opacity: 0.35; }
  @media (hover: hover) and (pointer: fine) {
    .boton:hover:not(:disabled) { opacity: 0.85; }
    .fila-tocable:hover { background: var(--celda-presionada); }
  }
  .boton-centrado { display: flex; justify-content: center; margin-top: 4px; }

  /* --- Barra de acción inferior translúcida (respeta la barra de inicio del iPhone) --- */
  .barra-accion {
    position: sticky; bottom: 0; z-index: 10;
    background: var(--barra);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-top: 0.5px solid var(--separador);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .barra-accion-interna { max-width: var(--ancho-contenido); margin: 0 auto; }
  .barra-accion .nota { text-align: center; font-size: 13px; margin: 7px 0 0; color: var(--texto-2); }

  /* --- Avisos --- */
  .aviso { border-radius: var(--radio); padding: 12px 16px; font-size: 15px; margin-bottom: 20px; }
  .aviso-info { background: var(--tinte-suave); color: var(--texto); }
  .aviso-alerta { background: var(--alerta-fondo); color: var(--alerta-texto); }
  .aviso-error { background: var(--alerta-fondo); color: var(--rojo); }

  /* --- Pantalla final --- */
  .final { text-align: center; padding-top: 48px; }
  .final-icono {
    width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 20px;
    background: var(--lima); color: #05200b; display: grid; place-items: center;
  }
  .final .bajada { margin-bottom: 28px; }
  .final .aviso { text-align: left; }

  /* --- Aviso de inactividad (dispositivo prestado) --- */
  .aviso-flotante {
    position: fixed; left: 16px; right: 16px; z-index: 30;
    bottom: calc(100px + env(safe-area-inset-bottom, 0px));
    max-width: calc(var(--ancho-contenido) - 32px); margin: 0 auto;
    background: var(--celda); color: var(--texto);
    border-radius: 16px; padding: 14px 16px; box-shadow: var(--sombra-flotante);
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  .aviso-flotante p { flex: 1 1 200px; font-size: 15px; font-variant-numeric: tabular-nums; }

  /* --- Selector del MODO PRUEBA (solo con ?prueba=1), como control segmentado de iOS --- */
  .selector-prueba {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 50;
    bottom: calc(86px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 2px; padding: 2px; border-radius: 9px;
    background: var(--relleno); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  .selector-prueba button {
    border: 0; background: transparent; border-radius: 7px;
    padding: 5px 12px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
  }
  .selector-prueba button.activo { background: var(--celda); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12); }

  /* --- Hoja de confirmación (como las "action sheets" de iOS) --- */
  .hoja-fondo {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(0, 0, 0, 0.4);
    display: flex; align-items: flex-end; justify-content: center;
    padding: 0 8px calc(8px + env(safe-area-inset-bottom, 0px));
    animation: aparecer 180ms ease-out;
  }
  .hoja { width: 100%; max-width: 500px; animation: subir 220ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  .hoja-grupo { background: var(--celda); border-radius: 14px; overflow: hidden; margin-bottom: 8px; }
  .hoja-mensaje { font-size: 13px; color: var(--texto-2); text-align: center; padding: 14px 16px; border-bottom: 0.5px solid var(--separador); }
  .hoja-boton {
    display: block; width: 100%; min-height: 57px; border: 0; cursor: pointer;
    background: var(--celda); color: var(--tinte); font-size: 20px;
  }
  .hoja-boton:active { background: var(--celda-presionada); }
  .hoja-boton.peligro { color: var(--rojo); }
  .hoja-cancelar { border-radius: 14px; font-weight: 600; }
  /* --- Tutorial "¿Cómo lo saco?" (hoja alta con scroll propio) --- */
  .boton-como {
    display: inline-flex; align-items: center; gap: 4px; margin-left: 6px;
    background: var(--tinte-suave); color: var(--tinte); border: 0; cursor: pointer;
    font-size: 14px; font-weight: 600; padding: 3px 10px; border-radius: 999px; min-height: 28px;
  }
  .boton-como:active { opacity: 0.6; }
  .hoja.tutorial {
    background: var(--celda); border-radius: 16px 16px 14px 14px;
    max-height: calc(100dvh - 40px); display: flex; flex-direction: column; overflow: hidden;
    --tinta-ilus: #08200F;
  }
  .hoja.tutorial:focus { outline: none; }
  .tutorial-agarre { width: 36px; height: 5px; border-radius: 3px; background: var(--separador); margin: 8px auto 0; flex-shrink: 0; }
  .tutorial-cabecera { display: flex; align-items: center; gap: 12px; padding: 10px 16px 8px; flex-shrink: 0; }
  .tutorial-titulo { flex: 1; margin: 0; font-family: 'Nunito', -apple-system, sans-serif; font-size: 21px; font-weight: 900; line-height: 1.2; }
  .tutorial-cerrar {
    width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer; flex-shrink: 0;
    background: var(--relleno); color: var(--texto-2); font-size: 14px;
  }
  .tutorial-cuerpo { overflow-y: auto; overscroll-behavior: contain; padding: 0 16px 8px; }
  .tutorial-intro { font-size: 15px; color: var(--texto-2); margin: 0 0 12px; }
  .tutorial-pasos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .tutorial-paso { display: flex; gap: 14px; align-items: flex-start; background: var(--relleno); border-radius: 14px; padding: 12px; }
  .ilustracion { width: 96px; height: auto; flex-shrink: 0; }
  .ilustracion text { font-family: -apple-system, 'Segoe UI', sans-serif; }
  .tutorial-paso-texto { flex: 1; min-width: 0; }
  .tutorial-paso-texto p { font-size: 15px; line-height: 1.45; margin: 2px 0 8px; }
  .tutorial-numero { font-size: 12px; font-weight: 700; color: var(--tinte); }
  .tutorial-subtitulo { font-size: 13px; color: var(--texto-2); margin: 18px 0 8px; font-weight: 600; }
  .tutorial-enlaces { display: flex; flex-wrap: wrap; gap: 8px; }
  .tutorial-nota { font-size: 13px; color: var(--texto-2); margin: 14px 0 4px; }
  .tutorial-pie { padding: 10px 16px 12px; border-top: 0.5px solid var(--separador); flex-shrink: 0; }
  @media (prefers-color-scheme: dark) { .hoja.tutorial { --tinta-ilus: #000000; } }

  @keyframes aparecer { from { opacity: 0; } }
  @keyframes subir { from { transform: translateY(100%); } }

  @media (prefers-reduced-motion: reduce) {
    .hoja-fondo, .hoja { animation: none; }
    * { transition: none !important; }
  }

  /* ==========================================================================
     PIEZAS PROPIAS DE ESTA APP (fotos por página, vista previa, flechita)
     ========================================================================== */
  /* Flechita ">" de las filas que abren algo, como en iOS */
  .chevron {
    width: 8px; height: 8px; flex-shrink: 0; margin-right: 4px;
    border-right: 2px solid var(--texto-2); border-top: 2px solid var(--texto-2);
    transform: rotate(45deg); opacity: 0.6;
  }
  /* Campos de fecha: misma altura que los demás campos */
  .fila-campo input[type="date"] { min-height: 30px; display: block; }
  .fila-campo input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  .lista.con-error { box-shadow: 0 0 0 1.5px var(--rojo); }

  /* Miniaturas de las fotos (una por página) */
  .miniaturas { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; margin-top: 10px; }
  .miniatura { position: relative; aspect-ratio: 3 / 4; border-radius: 8px; overflow: hidden; background: var(--relleno); }
  .miniatura img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .miniatura.con-advertencia { box-shadow: 0 0 0 2px var(--rojo); }
  .miniatura-numero {
    position: absolute; left: 4px; bottom: 4px; min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 9px; background: rgba(0, 0, 0, 0.6); color: #FFFFFF; font-size: 11px; font-weight: 600;
    display: grid; place-items: center; font-variant-numeric: tabular-nums;
  }
  .miniatura-quitar {
    position: absolute; right: 3px; top: 3px; width: 26px; height: 26px; border-radius: 50%; border: 0;
    background: rgba(0, 0, 0, 0.55); color: #FFFFFF; font-size: 12px; cursor: pointer; display: grid; place-items: center;
  }
  .revisando { display: inline-flex; align-items: center; gap: 8px; }
  .revisando::before {
    content: ''; width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--relleno); border-top-color: var(--tinte); animation: girar 800ms linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }

  /* Vista previa "¿Se lee bien?" */
  .vista-previa { display: flex; flex-direction: column; gap: 14px; }
  .vista-previa figure { margin: 0; border-radius: 10px; overflow: hidden; background: var(--relleno); }
  .vista-previa img { width: 100%; display: block; background: #FFFFFF; }
  .vista-previa figcaption { font-size: 13px; color: var(--texto-2); padding: 6px 10px; }
  .vista-previa .con-advertencia { box-shadow: 0 0 0 2px var(--rojo); }
  .vista-previa .con-advertencia figcaption { color: var(--rojo); font-weight: 600; }
  .pie-doble { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  /* Caja para escribir la contraseña de un PDF y quitársela */
  .caja-clave { margin-top: 10px; padding: 12px; border-radius: 10px; background: var(--relleno); display: flex; flex-direction: column; gap: 8px; }
  .caja-clave input {
    width: 100%; height: 40px; padding: 0 12px; border: 0; border-radius: 10px; outline: 0;
    background: var(--celda); color: var(--texto); font-size: 17px;
  }
  .fila-campo input[type="date"]:disabled { opacity: 0.45; }
  @media (prefers-reduced-motion: reduce) { .revisando::before { animation: none; } }

  /* ==========================================================================
     COMPUTADOR (pantallas de 960 px o más): igual que la app de hojas de vida
     --------------------------------------------------------------------------
     En celular nada de esto aplica. En computador:
       - arriba, la barra con logo, paso y caña (más ancha),
       - tres columnas: "Tu avance" (pasos) · la pantalla · "Ayuda" (manual,
         privacidad, formatos),
       - ventanas (tutorial, vista previa, confirmación) centradas.
     ========================================================================== */
  .cuerpo { flex: 1; display: flex; flex-direction: column; }
  .principal { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .columna { display: none; }
  .fila-tocable { color: inherit; text-decoration: none; }

  @media (min-width: 960px) {
    :root { --ancho-pc: 1040px; }
    .solo-celular { display: none; }
    .barra-nav-interna { max-width: var(--ancho-pc); }
    .cuerpo {
      display: grid; grid-template-columns: 228px minmax(0, 1fr) 228px; gap: 28px;
      width: 100%; max-width: calc(var(--ancho-pc) + 32px); margin: 0 auto; padding: 0 16px;
    }
    .contenido { max-width: none; padding: 20px 0 28px; }
    .barra-accion { padding: 10px 0 14px; background: var(--fondo); -webkit-backdrop-filter: none; backdrop-filter: none; }
    .barra-accion-interna { max-width: none; }

    /* Columnas laterales: quietas mientras se baja por la pantalla */
    .columna { display: block; position: sticky; top: 96px; align-self: start; padding-top: 20px; }
    .columna-titulo { font-size: 13px; font-weight: 400; color: var(--texto-2); margin: 0 4px 10px; }
    .avance-pasos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    .avance-pasos li {
      display: flex; align-items: center; gap: 12px; min-height: 45px; padding: 0 10px;
      border-radius: 10px; font-size: 15px; color: var(--texto-2);
    }
    .avance-pasos li.hecho { color: var(--texto); }
    .avance-pasos li.actual { background: var(--celda); color: var(--texto); font-weight: 700; }
    .avance-circulo {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
      font-size: 13px; font-weight: 700; border: 1.5px solid var(--separador); font-variant-numeric: tabular-nums;
    }
    .avance-pasos li.hecho .avance-circulo { background: var(--lima); border-color: var(--lima); color: #05200b; }
    .avance-pasos li.actual .avance-circulo { border-color: var(--lima); color: var(--tinte); }
    .ayuda-tarjeta { background: var(--celda); border-radius: var(--radio); padding: 14px; margin-bottom: 14px; font-size: 14px; line-height: 1.45; color: var(--texto-2); }
    .ayuda-titulo { color: var(--texto); font-weight: 700; margin-bottom: 4px; }
    .ayuda-boton { display: flex; width: 100%; margin-top: 12px; }

    /* Ventanas centradas (no suben desde abajo) */
    .hoja-fondo { align-items: center; padding: 24px; }
    .hoja { max-width: 440px; animation: aparecerCentro 200ms cubic-bezier(0.2, 0.8, 0.2, 1); }
    .hoja.tutorial { max-width: 640px; max-height: min(86dvh, 900px); border-radius: 16px; }
    .tutorial-agarre { visibility: hidden; height: 0; margin: 0; }
    .tutorial-cabecera { padding: 18px 22px 10px; }
    .tutorial-cuerpo { padding: 0 22px 12px; }
    .tutorial-pie { padding: 12px 22px 16px; display: flex; justify-content: flex-end; }
    .tutorial-pie .boton-principal, .pie-doble .boton-principal { width: auto; min-width: 240px; }
    .pie-doble { flex-direction: row-reverse; justify-content: flex-start; gap: 16px; }
    .vista-previa { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .vista-previa figure:only-child { grid-column: 1 / -1; }
  }
  @keyframes aparecerCentro { from { opacity: 0; transform: scale(0.96); } }

</style>

<script>

  //   tamanoMaximoEntradaMB → peso máximo del archivo que elige el colaborador (antes de comprimir).

SEDE ADMINISTRATIVA
`,

  // ---------------------------------------------------------------------------

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;
const CONFIG = window.CONFIG;
const LOGO = window.LOGO_CANAVERAL;

/* ============================================================================
   1. GUARDADO LOCAL (IndexedDB)
   ----------------------------------------------------------------------------
   IndexedDB es una "base de datos" que trae el navegador. Todo lo que se guarda
   aquí queda SOLO en el celular del colaborador: no viaja a internet.
   Guardamos un único registro llamado "actual" con toda la sesión.
   (Base distinta a la de hojas de vida: no se mezclan.)
   ============================================================================ */
const BD = {
  nombre: 'canaveral_incapacidades',
  almacen: 'sesion',
  clave: 'actual',

  /** Abre (o crea) la base de datos local. */
  abrir() {
    return new Promise((resolver, rechazar) => {
      if (!window.indexedDB) return rechazar(new Error('Este navegador no permite guardar datos.'));
      const solicitud = indexedDB.open(this.nombre, 1);
      solicitud.onupgradeneeded = () => solicitud.result.createObjectStore(this.almacen);
      solicitud.onsuccess = () => resolver(solicitud.result);
      solicitud.onerror = () => rechazar(solicitud.error);
    });
  },

  /** Ejecuta una operación ('readonly' o 'readwrite') sobre el almacén. */
  async operar(modo, accion) {
    const bd = await this.abrir();
    return new Promise((resolver, rechazar) => {
      const transaccion = bd.transaction(this.almacen, modo);
      const solicitud = accion(transaccion.objectStore(this.almacen));
      transaccion.oncomplete = () => { bd.close(); resolver(solicitud && solicitud.result); };
      transaccion.onerror = () => { bd.close(); rechazar(transaccion.error); };
    });
  },

  leer()         { return this.operar('readonly',  (a) => a.get(this.clave)); },
  guardar(valor) { return this.operar('readwrite', (a) => a.put(valor, this.clave)); },
  borrar()       { return this.operar('readwrite', (a) => a.delete(this.clave)); },
};

/* ============================================================================
   2. FUNCIONES DE APOYO (no dibujan nada en pantalla)
   ============================================================================ */

const MS_POR_DIA = 24 * 60 * 60 * 1000;
const LIMITE_BYTES = CONFIG.tamanoMaximoMB * 1024 * 1024;
// Se deja un margen del 5 % para lo que agrega el PDF al unir las fotos.
const LIMITE_FOTOS_BYTES = LIMITE_BYTES * 0.95;
// Máximo de días entre la incapacidad anterior y esta para que cuente como prórroga
// Máximo de días entre el fin de la incapacidad anterior y el inicio de la prórroga.
// Ej.: con 7, si la anterior terminó el 10, la prórroga puede empezar a más tardar el 17.
const DIAS_MAXIMOS_PRORROGA = CONFIG.diasMaximosProrroga || 7;

/** "1 documento" / "3 documentos". */
function plural(cantidad, singular, pluralTexto) {
  return `${cantidad} ${cantidad === 1 ? singular : pluralTexto}`;
}

/** Peso legible: 845 KB, 1,4 MB. */
function pesoLegible(bytes) {
  if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
  return `${(bytes / (1024 * 1024)).toLocaleString('es-CO', { maximumFractionDigits: 1 })} MB`;
}

/** Fecha legible: "12 de noviembre". */
function fechaLegible(ms) {
  return new Date(ms).toLocaleDateString('es-CO', { day: 'numeric', month: 'long' });
}

/* ---------- Fechas del formulario (se guardan como texto "2026-11-10") ---------- */

/** "2026-11-10" → fecha local a medianoche (evita el corrimiento por zona horaria). */
function leerFecha(texto) {
  const [a, m, d] = (texto || '').split('-').map(Number);
  return a && m && d ? new Date(a, m - 1, d) : null;
}
/** Fecha → "2026-11-10". */
function fechaATexto(fecha) {
  const d = (n) => String(n).padStart(2, '0');
  return `${fecha.getFullYear()}-${d(fecha.getMonth() + 1)}-${d(fecha.getDate())}`;
}
/** "2026-11-10" → "10 de noviembre de 2026". */
function fechaLarga(texto) {
  const f = leerFecha(texto);
  return f ? f.toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
}
/** Fecha final de la incapacidad: el primer día cuenta, por eso se suman (días − 1). */
function calcularFechaFinal(fechaInicial, dias) {
  const f = leerFecha(fechaInicial);
  if (!f || !(dias > 0)) return '';
  f.setDate(f.getDate() + dias - 1);
  return fechaATexto(f);
}
/** Suma días a una fecha "2026-11-10" y la devuelve en el mismo formato. */
function sumarDias(texto, dias) {
  const f = leerFecha(texto);
  if (!f) return '';
  f.setDate(f.getDate() + dias);
  return fechaATexto(f);
}
/** Hoy como "2026-11-10". */
function hoyTexto() { return fechaATexto(new Date()); }

/**
 * Convierte un texto en algo seguro para nombre de archivo:
 * "María José Peña" → "MARIA_JOSE_PENA". Quita tildes, ñ y símbolos.
 */
function textoParaArchivo(texto, maximo = 40) {
  const limpio = (texto || '')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^A-Za-z0-9]+/g, '_')
    .replace(/^_+|_+$/g, '')
    .toUpperCase();
  if (limpio.length <= maximo) return limpio;
  const cortado = limpio.slice(0, maximo);
  const ultimoGuion = cortado.lastIndexOf('_');
  return (ultimoGuion > 0 ? cortado.slice(0, ultimoGuion) : cortado).replace(/_+$/g, '');
}

/** Lista de sedes a partir del texto pegado desde Excel (una por línea, sin repetidas). */
function leerSedes(texto) {
  const lista = (texto || '').split(/\r?\n/).map((l) => l.split(/\t|;/)[0].trim()).filter(Boolean)
    .filter((l) => !/^descripci/i.test(l)); // por si pegan el encabezado
  return [...new Set(lista)].sort((a, b) => a.localeCompare(b, 'es'));
}
const SEDES = leerSedes(CONFIG.sedesTexto);

/** Busca un tipo de incapacidad por su código ('018'…). */
const tipoPorCodigo = (codigo) => CONFIG.tipos.find((t) => t.codigo === codigo) || null;
/** Busca un documento por su id. */
const documentoPorId = (id) => CONFIG.documentos.find((d) => d.id === id) || null;

/**
 * Código de diagnóstico CIE-10: una letra y 2 o 3 números (a veces termina en X).
 * Se limpia lo que la gente suele escribir de más: espacios, puntos y guiones.
 * "j06.9" → "J069". Devuelve '' si no tiene el formato.
 */
function limpiarDiagnostico(texto) {
  const limpio = (texto || '').toUpperCase().replace(/[\s.\-]/g, '');
  return /^[A-Z][0-9]{2}[0-9X]?$/.test(limpio) ? limpio : '';
}

/**
 * Documentos que se piden según el tipo de incapacidad.
 * En enfermedad general, si fue accidente de tránsito, se agrega el FURIPS.
 */
function documentosQueAplican(incapacidad) {
  const tipo = incapacidad && tipoPorCodigo(incapacidad.tipo);
  if (!tipo) return [];
  const ids = [...tipo.documentos];
  if (tipo.preguntaTransito && incapacidad.accidenteTransito) ids.push('furips');
  return ids.map(documentoPorId).filter(Boolean);
}

/** ¿El documento ya tiene algo subido (un PDF o al menos una foto)? */
function documentoListo(entrada) {
  return !!(entrada && ((entrada.origen === 'pdf' && entrada.pdf) || (entrada.origen === 'fotos' && entrada.fotos.length)));
}

/** Peso de lo que hay en un documento (el PDF, o la suma de las fotos). */
function pesoDelDocumento(entrada) {
  if (!entrada) return 0;
  return entrada.origen === 'pdf' ? entrada.pdf.tamano : entrada.fotos.reduce((s, f) => s + f.tamano, 0);
}

// pdf.js trabaja con un "ayudante" en segundo plano (worker) que se carga del mismo sitio.
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

/**
 * Huella digital del archivo (SHA-256): dos archivos idénticos tienen la misma huella.
 * Sirve para detectar que suban el mismo archivo en dos documentos distintos.
 */
async function huellaDelArchivo(archivo) {
  try {
    const resumen = await crypto.subtle.digest('SHA-256', await archivo.arrayBuffer());
    return Array.from(new Uint8Array(resumen)).map((b) => b.toString(16).padStart(2, '0')).join('');
  } catch {
    return `${archivo.size}-${archivo.name}`;
  }
}

/** Busca si la huella ya está en algún documento. Devuelve el documento o null. */
function documentoConHuella(huella, archivosActuales) {
  for (const doc of CONFIG.documentos) {
    const e = archivosActuales[doc.id];
    if (!e) continue;
    const huellas = e.origen === 'pdf' ? [e.pdf.huella] : e.fotos.map((f) => f.huella);
    if (huellas.includes(huella)) return doc;
  }
  return null;
}

/* ---------------------------------------------------------------------------
   IMÁGENES: abrir, revisar que se pueda leer y comprimir
   --------------------------------------------------------------------------- */

/** Abre una imagen para poder medirla y dibujarla. Respeta la rotación de las fotos del celular. */
async function abrirImagen(blob) {
  if (window.createImageBitmap) {
    try { return await createImageBitmap(blob, { imageOrientation: 'from-image' }); } catch { /* sigue abajo */ }
  }
  return new Promise((resolver, rechazar) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolver(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rechazar(new Error('imagen ilegible')); };
    img.src = url;
  });
}

/**
 * Dibuja la imagen achicada (lado más largo = maximo px) y la guarda como JPG.
 * Una foto de celular de 4 MB queda en unos 250–450 KB.
 */
function comprimirImagen(imagen, maximo, calidad) {
  const escala = Math.min(1, maximo / Math.max(imagen.width, imagen.height));
  const lienzo = document.createElement('canvas');
  lienzo.width = Math.round(imagen.width * escala);
  lienzo.height = Math.round(imagen.height * escala);
  const ctx = lienzo.getContext('2d');
  ctx.fillStyle = '#FFFFFF'; // por si la imagen PNG trae partes transparentes
  ctx.fillRect(0, 0, lienzo.width, lienzo.height);
  ctx.drawImage(imagen, 0, 0, lienzo.width, lienzo.height);
  return new Promise((resolver) => lienzo.toBlob(
    (blob) => resolver({ blob, ancho: lienzo.width, alto: lienzo.height }), 'image/jpeg', calidad));
}

/**
 * Mide si la foto se puede leer:
 *   - nitidez: qué tanto cambian los píxeles vecinos (bordes de las letras).
 *     Una foto movida o desenfocada tiene bordes suaves → número bajo.
 *     (Es la "varianza del laplaciano", una medida clásica de enfoque.)
 *   - brillo: promedio de claridad (0 = negro, 255 = blanco).
 * Se mide sobre una copia de máximo 1000 px para que sea rápido.
 */
function medirLegibilidad(imagen) {
  const escala = Math.min(1, 1000 / Math.max(imagen.width, imagen.height));
  const w = Math.max(3, Math.round(imagen.width * escala));
  const h = Math.max(3, Math.round(imagen.height * escala));
  const lienzo = document.createElement('canvas');
  lienzo.width = w; lienzo.height = h;
  const ctx = lienzo.getContext('2d');
  ctx.drawImage(imagen, 0, 0, w, h);
  const datos = ctx.getImageData(0, 0, w, h).data;
  const gris = new Float32Array(w * h);
  let suma = 0;
  for (let i = 0; i < w * h; i++) {
    gris[i] = 0.299 * datos[i * 4] + 0.587 * datos[i * 4 + 1] + 0.114 * datos[i * 4 + 2];
    suma += gris[i];
  }
  let n = 0, media = 0, media2 = 0;
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      const l = gris[i - w] + gris[i + w] + gris[i - 1] + gris[i + 1] - 4 * gris[i];
      media += l; media2 += l * l; n++;
    }
  }
  media /= n;
  return { nitidez: media2 / n - media * media, brillo: suma / (w * h) };
}

/**
 * Revisa y comprime UNA foto de una página:
 *   - que sea una imagen que el navegador pueda abrir,
 *   - que no sea muy pequeña (tomada muy de lejos),
 *   - avisa si está borrosa u oscura (el colaborador decide si la usa igual),
 *   - la achica y la guarda en JPG.
 * Devuelve { error } o { foto }.
 */
async function prepararFoto(archivo, archivosActuales) {
  if (!archivo || archivo.size === 0) return { error: 'El archivo está vacío. Vuelve a tomar la foto.' };
  if (archivo.size > CONFIG.tamanoMaximoEntradaMB * 1024 * 1024) {
    return { error: `La foto pesa ${pesoLegible(archivo.size)}. Elige una más liviana.` };
  }
  const huella = await huellaDelArchivo(archivo);
  const repetida = documentoConHuella(huella, archivosActuales);
  if (repetida) return { error: `Esta misma foto ya la subiste en "${repetida.nombre}".` };

  let imagen;
  try { imagen = await abrirImagen(archivo); } catch {
    return { error: 'No pudimos abrir la imagen. Si es del iPhone, tómala desde aquí con "Tomar foto" o elige otra.' };
  }
  const ladoCorto = Math.min(imagen.width, imagen.height);
  if (ladoCorto < CONFIG.foto.ladoMinimo) {
    return { error: `La foto es muy pequeña (${imagen.width}×${imagen.height}). Tómala más cerca para que se lea la letra.` };
  }

  const { nitidez, brillo } = medirLegibilidad(imagen);
  const advertencias = [];
  if (nitidez < CONFIG.foto.nitidezMinima) advertencias.push('Se ve borrosa');
  if (brillo < CONFIG.foto.brilloMinimo) advertencias.push('Se ve oscura');

  const { blob, ancho, alto } = await comprimirImagen(imagen, CONFIG.foto.ladoGuardado, 0.75);
  if (imagen.close) imagen.close();
  return { foto: { blob, ancho, alto, tamano: blob.size, huella, nombre: archivo.name, advertencias } };
}

/** Vuelve a comprimir una foto ya guardada (más pequeña y con menos calidad). */
async function recomprimirFoto(foto, escala, calidad) {
  const imagen = await abrirImagen(foto.blob);
  const lado = Math.round(Math.max(imagen.width, imagen.height) * escala);
  const r = await comprimirImagen(imagen, lado, calidad);
  if (imagen.close) imagen.close();
  return { ...foto, blob: r.blob, ancho: r.ancho, alto: r.alto, tamano: r.blob.size };
}

/**
 * Hace que todas las fotos de un documento quepan en el peso máximo.
 * Si se pasan, las va achicando poco a poco. Si aun así no caben (demasiadas
 * páginas), devuelve un error.
 */
async function ajustarFotosAlLimite(fotos) {
  let actuales = fotos;
  for (let intento = 0; intento < 6; intento++) {
    const total = actuales.reduce((s, f) => s + f.tamano, 0);
    if (total <= LIMITE_FOTOS_BYTES) return { fotos: actuales };
    const ladoMasCorto = Math.min(...actuales.map((f) => Math.min(f.ancho, f.alto)));
    if (ladoMasCorto < 650) break; // más pequeño ya no se leería
    actuales = await Promise.all(actuales.map((f) => recomprimirFoto(f, 0.85, 0.62)));
  }
  return { error: `Son muchas páginas para el máximo de ${CONFIG.tamanoMaximoMB} MB. Quita las que no sean necesarias o súbelo en PDF.` };
}

/**
 * Une varias fotos (JPG) en un solo PDF, una foto por página.
 * Cada página toma la forma de la foto (ancho de hoja carta, alto proporcional).
 */
async function pdfDesdeFotos(fotos) {
  const { jsPDF } = window.jspdf;
  const ANCHO = 612; // puntos: ancho de una hoja carta
  let pdf = null;
  for (const foto of fotos) {
    const alto = Math.round(ANCHO * foto.alto / foto.ancho);
    const bytes = new Uint8Array(await foto.blob.arrayBuffer());
    if (!pdf) pdf = new jsPDF({ unit: 'pt', format: [ANCHO, alto], orientation: alto >= ANCHO ? 'portrait' : 'landscape', compress: true });
    else pdf.addPage([ANCHO, alto], alto >= ANCHO ? 'portrait' : 'landscape');
    pdf.addImage(bytes, 'JPEG', 0, 0, ANCHO, alto, undefined, 'NONE');
  }
  return pdf.output('blob');
}

/* ---------------------------------------------------------------------------
   PDF: revisar y, si pesa más de lo permitido, comprimir
   --------------------------------------------------------------------------- */

/**
 * Abre un PDF con pdf.js. Si tiene contraseña, prueba primero con la cédula
 * (las EPS casi siempre usan la cédula) y luego con la clave que escribió el
 * colaborador, si escribió una.
 * Devuelve:
 *   { pdf, conClave: false }          → no tenía contraseña
 *   { pdf, conClave: true }           → tenía contraseña y se pudo abrir
 *   { protegido: true, claveMala }    → tiene contraseña y no se pudo abrir
 *                                        (claveMala = la clave escrita no sirvió)
 *   { error }                         → el PDF está dañado
 */
async function abrirPdf(archivo, cedula, claveEscrita) {
  const abrir = async (clave) => pdfjsLib.getDocument({ data: await archivo.arrayBuffer(), password: clave }).promise;
  const esClave = (e) => e && e.name === 'PasswordException';
  try {
    return { pdf: await abrir(undefined), conClave: false };
  } catch (e) {
    if (!esClave(e)) return { error: 'El PDF está dañado y no se puede abrir. Vuelve a descargarlo o tómale fotos.' };
  }
  // Tiene contraseña: se prueban la cédula y la clave escrita
  for (const clave of [cedula, claveEscrita].filter(Boolean)) {
    try { return { pdf: await abrir(clave), conClave: true }; }
    catch (e) { if (!esClave(e)) return { error: 'El PDF está dañado y no se puede abrir. Vuelve a descargarlo o tómale fotos.' }; }
  }
  return { protegido: true, claveMala: !!claveEscrita };
}


/**
 * ¿La página tiene algo? (texto o imagen). Un PDF en blanco no sirve.
 */
async function paginaTieneContenido(pagina) {
  const texto = await pagina.getTextContent();
  if (texto.items.some((i) => (i.str || '').trim())) return true;
  const OPS = pdfjsLib.OPS;
  const dibujosDeImagen = [OPS.paintImageXObject, OPS.paintInlineImageXObject, OPS.paintImageMaskXObject, OPS.paintJpegXObject].filter(Boolean);
  const operaciones = await pagina.getOperatorList();
  return operaciones.fnArray.some((op) => dibujosDeImagen.includes(op));
}

/** Dibuja una página del PDF en un lienzo con el ancho pedido y lo guarda como JPG. */
async function paginaAJpg(pagina, ancho, calidad) {
  const base = pagina.getViewport({ scale: 1 });
  const vista = pagina.getViewport({ scale: ancho / base.width });
  const lienzo = document.createElement('canvas');
  lienzo.width = Math.round(vista.width);
  lienzo.height = Math.round(vista.height);
  const ctx = lienzo.getContext('2d');
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, lienzo.width, lienzo.height);
  await pagina.render({ canvasContext: ctx, viewport: vista }).promise;
  const blob = await new Promise((r) => lienzo.toBlob(r, 'image/jpeg', calidad));
  return { blob, ancho: lienzo.width, alto: lienzo.height, tamano: blob.size };
}

/**
 * Comprime un PDF pesado: vuelve cada página una imagen JPG más liviana y las
 * une de nuevo en un PDF. Prueba de mejor a menor calidad hasta que quepa.
 * (Es la forma más segura de comprimir desde el celular; el texto queda como
 * imagen, pero se sigue leyendo igual.)
 * Devuelve { blob, paginas: [fotos para la vista previa] } o { error }.
 */
async function comprimirPdf(pdf) {
  const niveles = [{ ancho: 1400, calidad: 0.72 }, { ancho: 1200, calidad: 0.62 }, { ancho: 1000, calidad: 0.55 }];
  for (const nivel of niveles) {
    const paginas = [];
    for (let n = 1; n <= pdf.numPages; n++) {
      paginas.push(await paginaAJpg(await pdf.getPage(n), nivel.ancho, nivel.calidad));
    }
    const blob = await pdfDesdeFotos(paginas);
    if (blob.size <= LIMITE_BYTES) return { blob, paginas };
  }
  return { error: `No logramos dejarlo en ${CONFIG.tamanoMaximoMB} MB sin que se deje de leer. Tómale fotos a las páginas o pide el documento en menor calidad.` };
}

/**
 * Revisa un PDF antes de aceptarlo:
 *   1. Que sea un PDF real, no vacío.
 *   2. Que no sea el mismo archivo ya subido en otro documento.
 *   3. Si tiene contraseña, se la QUITA (con la cédula o con la clave que
 *      escriba el colaborador). Si no se sabe la clave, la pide.
 *   4. Que no pase del máximo de páginas ni esté en blanco.
 *   5. Si pesa más del máximo, lo comprime.
 * Cuando se quita la clave o se comprime, se muestra la vista previa para confirmar.
 * Devuelve { error }, { necesitaClave, claveMala } o { pdf, vistaPrevia }.
 */
async function prepararPdf(archivo, cedula, archivosActuales, claveEscrita) {
  if (!archivo || archivo.size === 0) return { error: 'El archivo está vacío. Vuelve a descargarlo.' };
  if (archivo.size > CONFIG.tamanoMaximoEntradaMB * 1024 * 1024) {
    return { error: `Pesa ${pesoLegible(archivo.size)}: es demasiado grande. Tómale fotos a las páginas.` };
  }
  const inicio = await archivo.slice(0, 1024).text();
  if (!inicio.includes('%PDF-')) return { error: 'Ese archivo no es un PDF. Si es una foto, usa el botón "Agregar fotos".' };

  const huella = await huellaDelArchivo(archivo);
  const repetido = documentoConHuella(huella, archivosActuales);
  if (repetido) return { error: `Este mismo archivo ya lo subiste en "${repetido.nombre}". Cada documento va en su lugar.` };

  const base = { nombre: archivo.name, huella, comprimido: false, claveQuitada: false };
  if (!window.pdfjsLib) { // sin pdf.js (sin internet) no se puede revisar: se acepta si cumple el peso
    if (archivo.size > LIMITE_BYTES) return { error: `Pesa ${pesoLegible(archivo.size)} y el máximo es ${CONFIG.tamanoMaximoMB} MB.` };
    return { pdf: { ...base, blob: archivo, tamano: archivo.size, paginas: null } };
  }

  const abierto = await abrirPdf(archivo, cedula, claveEscrita);
  if (abierto.error) return { error: abierto.error };
  // Tiene contraseña y no es la cédula: se le pide al colaborador
  if (abierto.protegido) return { necesitaClave: true, claveMala: abierto.claveMala };

  const { pdf, conClave } = abierto;
  if (pdf.numPages > CONFIG.paginasMaximas) {
    return { error: `Tiene ${pdf.numPages} páginas y el máximo es ${CONFIG.paginasMaximas}. Revisa que sea el documento correcto.` };
  }
  if (!(await paginaTieneContenido(await pdf.getPage(1)))) {
    return { error: 'El PDF está en blanco. Revisa que sea el archivo correcto.' };
  }

  // Sin contraseña y con buen peso: se acepta tal cual
  if (!conClave && archivo.size <= LIMITE_BYTES) {
    return { pdf: { ...base, blob: archivo, tamano: archivo.size, paginas: pdf.numPages } };
  }
  // Con contraseña o pesado: se vuelve a armar el PDF (sin clave y dentro del peso).
  // Al rearmarlo desde las páginas dibujadas, el PDF nuevo ya no tiene contraseña.
  const rearmado = await comprimirPdf(pdf);
  if (rearmado.error) return { error: rearmado.error };
  return {
    pdf: { ...base, blob: rearmado.blob, tamano: rearmado.blob.size, paginas: pdf.numPages,
           comprimido: archivo.size > LIMITE_BYTES, claveQuitada: conClave, pesoOriginal: archivo.size },
    vistaPrevia: rearmado.paginas,
  };
}

/** Arma la carta de paternidad en PDF con los datos del colaborador. */
function cartaPaternidadPdf(datos, incapacidad) {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'pt', format: 'letter' });
  const reemplazos = {
    nombre: datos.nombre.toUpperCase(), cedula: datos.cedula, sede: datos.sede, celular: datos.celular,
    dias: String(incapacidad.dias || '____'),
    fechaInicial: fechaLarga(incapacidad.fechaInicial) || '____________',
    fechaFinal: fechaLarga(calcularFechaFinal(incapacidad.fechaInicial, incapacidad.dias)) || '____________',
  };
  const llenar = (t) => t.replace(/\{(\w+)\}/g, (m, k) => (k in reemplazos ? reemplazos[k] : m));
  const margen = 72;
  const ancho = pdf.internal.pageSize.getWidth() - margen * 2;
  let y = 90;
  pdf.setFont('helvetica', 'normal');
  pdf.setFontSize(11.5);
  pdf.text(`Ciudad y fecha: _______________________________`, margen, y);
  y += 40;
  CONFIG.textoCartaPaternidad.forEach((parrafo) => {
    if (!parrafo) { y += 12; return; }
    const lineas = pdf.splitTextToSize(llenar(parrafo), ancho);
    pdf.text(lineas, margen, y);
    y += lineas.length * 16;
  });
  y += 60;
  pdf.line(margen, y, margen + 230, y);
  y += 16;
  pdf.text(reemplazos.nombre, margen, y);
  pdf.text(`C.C. ${reemplazos.cedula}`, margen, y + 16);
  pdf.text(`Celular: ${reemplazos.celular}`, margen, y + 32);
  return pdf.output('blob');
}

/** Nombre de cada archivo dentro del ZIP: 1144123456_018_01_INCAPACIDAD.pdf */
function nombreArchivoEnZip(cedula, tipo, doc) {
  return `${cedula}_${tipo}_${doc.codigo}_${textoParaArchivo(doc.id)}.pdf`;
}

/** Nombre del ZIP: cédula, tipo y fecha inicial → 1144123456_018_2026-11-10.zip */
function nombreDelZip(sesion) {
  return `${sesion.datos.cedula}_${sesion.incapacidad.tipo}_${sesion.incapacidad.fechaInicial}.zip`;
}

/** Devuelve el PDF final de un documento (si son fotos, las une en un PDF). */
async function pdfDelDocumento(entrada) {
  return entrada.origen === 'pdf' ? entrada.pdf.blob : pdfDesdeFotos(entrada.fotos);
}

/**
 * Arma el ZIP con un PDF por documento y el archivo "datos_incapacidad.json",
 * que usará Gestión Humana (y luego su panel) para registrar la incapacidad.
 */
async function armarZip(sesion) {
  const zip = new JSZip();
  const { datos, incapacidad, archivos } = sesion;
  const tipo = tipoPorCodigo(incapacidad.tipo);
  const listado = [];

  for (const doc of documentosQueAplican(incapacidad)) {
    const entrada = archivos[doc.id];
    if (!documentoListo(entrada)) continue;
    const nombre = nombreArchivoEnZip(datos.cedula, incapacidad.tipo, doc);
    zip.file(nombre, await pdfDelDocumento(entrada));
    listado.push({
      documento: doc.id, archivo: nombre,
      origen: entrada.origen,                         // 'pdf' o 'fotos'
      paginas: entrada.origen === 'pdf' ? entrada.pdf.paginas : entrada.fotos.length,
      comprimido: entrada.origen === 'pdf' ? !!entrada.pdf.comprimido : true,
      claveQuitada: entrada.origen === 'pdf' && !!entrada.pdf.claveQuitada, // venía con contraseña y la app se la quitó
      // Fotos que el sistema vio borrosas u oscuras y el colaborador usó igual: GH las mira con cuidado
      fotosConAdvertencia: entrada.origen === 'fotos' ? entrada.fotos.filter((f) => f.advertencias.length).length : 0,
    });
  }

  zip.file('datos_incapacidad.json', JSON.stringify({
    version: 1,
    tipo: 'incapacidad',
    cedula: datos.cedula,
    nombre: datos.nombre,
    celular: datos.celular,
    sede: datos.sede,
    codigoTipo: incapacidad.tipo,
    nombreTipo: tipo ? tipo.nombre : '',
    accidenteTransito: !!(tipo && tipo.preguntaTransito && incapacidad.accidenteTransito),
    fechaAccidente: tipo && tipo.fechaAccidente ? incapacidad.fechaAccidente : null,
    fechaInicial: incapacidad.fechaInicial,
    dias: incapacidad.dias,
    fechaFinal: calcularFechaFinal(incapacidad.fechaInicial, incapacidad.dias),
    diagnostico: incapacidad.diagnostico,
    prorroga: tipo && !tipo.esLicencia ? !!incapacidad.prorroga : null,
    fechaFinalAnterior: tipo && !tipo.esLicencia && incapacidad.prorroga ? incapacidad.fechaFinalAnterior : null,
    autorizacionDatos: sesion.autorizacion,
    generado: new Date().toISOString(),
    archivos: listado,
  }, null, 2));

  return zip.generateAsync({ type: 'blob', compression: 'STORE' });
}

/** Descarga un archivo al dispositivo del colaborador. */
function descargarArchivo(blob, nombre) {
  const url = URL.createObjectURL(blob);
  const enlace = document.createElement('a');
  enlace.href = url;
  enlace.download = nombre;
  document.body.appendChild(enlace);
  enlace.click();
  enlace.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60 * 1000);
}

/** Abre un archivo en otra pestaña para revisarlo. */
function verArchivo(blob) {
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank', 'noopener');
  setTimeout(() => URL.revokeObjectURL(url), 5 * 60 * 1000);
}

/** Dibuja una "página" de prueba (hoja con renglones) y la devuelve como foto JPG. */
async function fotoDePrueba(titulo, advertencias = []) {
  const c = document.createElement('canvas');
  c.width = 1200; c.height = 1600;
  const g = c.getContext('2d');
  g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#222'; g.font = 'bold 54px sans-serif'; g.fillText(titulo, 80, 140);
  g.font = '30px sans-serif';
  for (let i = 0; i < 28; i++) g.fillText('Texto de ejemplo del documento — línea ' + (i + 1), 80, 240 + i * 46);
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.7));
  return { blob, ancho: c.width, alto: c.height, tamano: blob.size, huella: Math.random().toString(16), nombre: 'IMG_20261110_081522.jpg', advertencias };
}

/* ============================================================================
   4. LIMPIEZA POR INACTIVIDAD (solo dispositivos prestados o públicos)
   ----------------------------------------------------------------------------
   Si nadie toca la página en X minutos, se borra todo. Un minuto antes avisa.
   ============================================================================ */
function useInactividad(activo, minutos, alVencer) {
  const [segundosRestantes, setSegundosRestantes] = useState(null);
  const ultimaActividad = useRef(Date.now());
  const alVencerRef = useRef(alVencer);
  alVencerRef.current = alVencer;

  useEffect(() => {
    if (!activo) { setSegundosRestantes(null); return; }
    ultimaActividad.current = Date.now();
    const marcarActividad = () => { ultimaActividad.current = Date.now(); setSegundosRestantes(null); };
    const eventos = ['pointerdown', 'keydown', 'scroll'];
    eventos.forEach((e) => window.addEventListener(e, marcarActividad, { passive: true }));
    const reloj = setInterval(() => {
      const restanteMs = minutos * 60 * 1000 - (Date.now() - ultimaActividad.current);
      if (restanteMs <= 0) { ultimaActividad.current = Date.now(); alVencerRef.current(); }
      else if (restanteMs <= 60 * 1000) setSegundosRestantes(Math.ceil(restanteMs / 1000));
    }, 1000);
    return () => { eventos.forEach((e) => window.removeEventListener(e, marcarActividad)); clearInterval(reloj); };
  }, [activo, minutos]);

  return segundosRestantes;
}

function PantallaDatos({ datosIniciales, alGuardar }) {

  const [celular, setCelular] = useState(datosIniciales?.celular || '');
  // La sede guardada solo se reutiliza si SIGUE en la lista (la lista puede cambiar)
  const [sede, setSede] = useState(SEDES.includes(datosIniciales?.sede) ? datosIniciales.sede : '');
  const [errores, setErrores] = useState({});

  /** Revisa los datos y, si están bien, los entrega limpios. */
  function guardar() {
    const nombreLimpio = nombre.trim().replace(/\s+/g, ' ');
    const cedulaLimpia = cedula.replace(/\D/g, '');
    const celularLimpio = celular.replace(/\D/g, '').replace(/^57(?=3\d{9}$)/, ''); // quita el +57 si lo escriben
    const e = {};
    if (nombreLimpio.length < 3) e.nombre = 'Escribe tu nombre completo, como aparece en tu cédula.';
    if (cedulaLimpia.length < 5 || cedulaLimpia.length > 12) e.cedula = 'Escribe tu número de documento, solo números.';
    if (!/^3\d{9}$/.test(celularLimpio)) e.celular = 'Escribe tu celular de 10 números, empieza por 3.';
    if (!sede) e.sede = 'Elige la sede o tienda donde trabajas.';
    setErrores(e);
    if (Object.keys(e).length) { irAlPrimerError(); return; }
    alGuardar({ nombre: nombreLimpio, cedula: cedulaLimpia, celular: celularLimpio, sede });
  }

  return (
    // Sin <form> a propósito: algunas vistas previas bloquean el envío de formularios.
    <div style={{ display: 'contents' }}>
      <main className="contenido pantalla-angosta">
        <h1>Tus datos</h1>
        <p className="bajada">Con tu número de documento Gestión Humana encuentra tu registro.</p>

        <section className="grupo">
          <div className="lista">
            <label className={`fila fila-campo ${errores.nombre ? 'con-error' : ''}`}>
              <span className="etiqueta">Nombre completo</span>
              <input type="text" autoComplete="name" autoCapitalize="words" enterKeyHint="next"
                     placeholder="Como aparece en tu cédula" value={nombre} maxLength={120}
                     onChange={(e) => setNombre(e.target.value)} />
            </label>
            <label className={`fila fila-campo ${errores.cedula ? 'con-error' : ''}`}>
              <span className="etiqueta">Número de documento</span>
              <input type="text" inputMode="numeric" autoComplete="off" enterKeyHint="next"
                     placeholder="Solo números" value={cedula} maxLength={20}
                     onChange={(e) => setCedula(e.target.value)} />
            </label>
            <label className={`fila fila-campo ${errores.celular ? 'con-error' : ''}`}>
              <span className="etiqueta">Celular</span>
              <input type="tel" inputMode="tel" autoComplete="tel-national" enterKeyHint="next"
                     placeholder="3001234567" value={celular} maxLength={16}
                     onChange={(e) => setCelular(e.target.value)} />
            </label>
            <label className={`fila fila-campo ${errores.sede ? 'con-error' : ''}`}>
              <span className="etiqueta">Sede o tienda</span>
              <span className="selector-con-flecha" style={{ display: 'block' }}>
                <select value={sede} onChange={(e) => setSede(e.target.value)}>
                  <option value="">Elige dónde trabajas</option>
                  {SEDES.map((s) => <option key={s} value={s}>{s}</option>)}
                </select>

            </label>

          {Object.values(errores).map((t) => <p key={t} className="grupo-pie error" role="alert">{t}</p>)}
          <p className="grupo-pie">Gestión Humana te escribirá a este celular si falta algo.</p>
        </section>

      <div className="barra-accion">

          <button type="button" className="boton boton-principal" onClick={guardar}>Guardar y seguir</button>
        </div>
