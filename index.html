  );
}

/** Pantalla 3: tipo, fechas, días, diagnóstico y prórroga. */
function PantallaIncapacidad({ incapacidadInicial, alGuardar, alVolver, alAbrirTutorial }) {
  const ini = incapacidadInicial || {};
  const [tipo, setTipo] = useState(tipoPorCodigo(ini.tipo) ? ini.tipo : '');
  const [transito, setTransito] = useState(!!ini.accidenteTransito);
  const [fechaAccidente, setFechaAccidente] = useState(ini.fechaAccidente || '');
  const [fechaInicial, setFechaInicial] = useState(ini.fechaInicial || '');
  const [dias, setDias] = useState(ini.dias ? String(ini.dias) : '');
  const [diagnostico, setDiagnostico] = useState(ini.diagnostico || '');
  const [prorroga, setProrroga] = useState(!!ini.prorroga);
  const [fechaFinalAnterior, setFechaFinalAnterior] = useState(ini.fechaFinalAnterior || '');
  const [errores, setErrores] = useState({});

  const datosTipo = tipoPorCodigo(tipo);
  const numeroDias = parseInt(dias, 10);
  // La fecha final NO se guarda aparte: siempre sale de fecha inicial + días.
  // Así, al escribir los días, la fecha final se ajusta sola.
  const fechaFinal = calcularFechaFinal(fechaInicial, numeroDias);

  /**
   * Fecha final de la incapacidad anterior (prórroga). Si todavía no hay fecha
   * inicial, se llena sola con el día siguiente, que es lo normal en una prórroga.
   */
  function cambiarFechaAnterior(texto) {
    setFechaFinalAnterior(texto);
    limpiarErrorProrroga();
    if (texto && !fechaInicial) setFechaInicial(sumarDias(texto, 1));
  }
  /** Al cambiar una de las dos fechas se quita el error viejo de la prórroga (se vuelve a revisar al guardar). */
  const limpiarErrorProrroga = () => setErrores((prev) => ({ ...prev, fechaFinalAnterior: undefined }));
  // Días entre el fin de la anterior y el inicio de esta (1 = empieza al día siguiente)
  const diasEntreProrroga = leerFecha(fechaFinalAnterior) && leerFecha(fechaInicial)
    ? Math.round((leerFecha(fechaInicial) - leerFecha(fechaFinalAnterior)) / MS_POR_DIA) : 0;

  /** Si el colaborador cambia la fecha final, se recalculan los días (contando el primer día). */
  function cambiarFechaFinal(texto) {
    const inicio = leerFecha(fechaInicial);
    const fin = leerFecha(texto);
    if (!inicio || !fin) return;
    const total = Math.round((fin - inicio) / MS_POR_DIA) + 1;
    if (total >= 1) setDias(String(total));
  }

  /** Revisa todo y entrega la incapacidad lista. */
  function guardar() {
    const e = {};
    const hoy = leerFecha(hoyTexto());
    const inicio = leerFecha(fechaInicial);
    const codigo = limpiarDiagnostico(diagnostico);
    if (!datosTipo) e.tipo = 'Elige qué vas a enviar.';
    if (!inicio) e.fechaInicial = 'Escribe la fecha inicial que dice la incapacidad.';
    else if ((inicio - hoy) / MS_POR_DIA > 30) e.fechaInicial = 'La fecha inicial no puede ser de más de un mes en el futuro. Revísala.';
    else if ((hoy - inicio) / MS_POR_DIA > 365) e.fechaInicial = 'La fecha inicial es de hace más de un año. Revísala.';
    if (!(numeroDias >= 1 && numeroDias <= 540) || String(numeroDias) !== dias.trim()) e.dias = 'Escribe cuántos días te dieron (solo el número).';
    if (!codigo) e.diagnostico = 'El código del diagnóstico es una letra y 3 números, por ejemplo J069. Toca "¿Dónde lo encuentro?".';
    // Prórroga: la anterior debe terminar ANTES de que empiece esta, y sin pasar el máximo de días entre ambas
    if (datosTipo && !datosTipo.esLicencia && prorroga) {
      const anterior = leerFecha(fechaFinalAnterior);
      if (!anterior) e.fechaFinalAnterior = 'Escribe la fecha final de la incapacidad anterior.';
      else if (inicio && anterior >= inicio) e.fechaFinalAnterior = 'La incapacidad anterior debe terminar antes de la fecha inicial de esta.';
      else if (inicio && Math.round((inicio - anterior) / MS_POR_DIA) > DIAS_MAXIMOS_PRORROGA) {
        e.fechaFinalAnterior = `La anterior terminó el ${fechaLarga(fechaFinalAnterior)}: una prórroga debe empezar a más tardar el ${fechaLarga(sumarDias(fechaFinalAnterior, DIAS_MAXIMOS_PRORROGA))}. Revisa las fechas o apaga "¿Es prórroga?".`;
      }
    }
    if (datosTipo && datosTipo.fechaAccidente) {
      const acc = leerFecha(fechaAccidente);
      if (!acc) e.fechaAccidente = 'Escribe la fecha del accidente.';
      else if (acc > hoy) e.fechaAccidente = 'La fecha del accidente no puede ser futura.';
      else if (inicio && acc > inicio) e.fechaAccidente = 'El accidente no puede ser después de la fecha inicial de la incapacidad.';
    }
    setErrores(e);
    if (Object.keys(e).length) { irAlPrimerError(); return; }
    alGuardar({
      tipo,
      accidenteTransito: !!(datosTipo.preguntaTransito && transito),
      fechaAccidente: datosTipo.fechaAccidente ? fechaAccidente : null,
      fechaInicial, dias: numeroDias, diagnostico: codigo,
      prorroga: datosTipo.esLicencia ? false : prorroga,
      fechaFinalAnterior: !datosTipo.esLicencia && prorroga ? fechaFinalAnterior : null,
    });
  }

  return (
    <div style={{ display: 'contents' }}>
      <main className="contenido pantalla-columnas">
        <h1>Tu incapacidad</h1>
        <p className="bajada">Copia los datos tal como aparecen en el papel que te dieron.</p>

        <section className="grupo">
          <h2 className="grupo-titulo">¿Qué vas a enviar?</h2>
          <div className={`lista ${errores.tipo ? 'con-error' : ''}`} role="radiogroup">
            {CONFIG.tipos.map((t) => (
              <label key={t.codigo} className="fila fila-tocable">
                <input className="oculto" type="radio" name="tipo" checked={tipo === t.codigo} onChange={() => setTipo(t.codigo)} />
                <div className="fila-cuerpo">
                  <div className="fila-titulo">{t.corto}</div>
                  <div className="fila-sub">{t.codigo} · {t.nombre}</div>
                </div>
                {tipo === t.codigo && <span className="marca-check"><Palomita /></span>}
              </label>
            ))}
          </div>
          {errores.tipo && <p className="grupo-pie error" role="alert">{errores.tipo}</p>}
        </section>

        {datosTipo && datosTipo.preguntaTransito && (
          <section className="grupo">
            <div className="lista">
              <label className="fila fila-tocable">
                <div className="fila-cuerpo fila-titulo">¿Fue un accidente de tránsito?</div>
                <input className="interruptor" type="checkbox" role="switch" checked={transito}
                       onChange={(e) => setTransito(e.target.checked)} />
              </label>
            </div>
            <p className="grupo-pie">{transito ? 'Te pediremos también el FURIPS que entrega la clínica.' : 'Si fue de tránsito, actívalo: se pide un documento más (FURIPS).'}</p>
          </section>
        )}

        {/* Prórroga: va ANTES de las fechas, porque si es prórroga se pide la fecha final de la anterior */}
        {datosTipo && !datosTipo.esLicencia && (
          <section className="grupo">
            <h2 className="grupo-titulo">Prórroga</h2>
            <div className="lista">
              <label className="fila fila-tocable">
                <div className="fila-cuerpo fila-titulo">¿Es prórroga de otra incapacidad?</div>
                <input className="interruptor" type="checkbox" role="switch" checked={prorroga}
                       onChange={(e) => setProrroga(e.target.checked)} />
              </label>
              {prorroga && (
                <label className={`fila fila-campo ${errores.fechaFinalAnterior ? 'con-error' : ''}`}>
                  <span className="etiqueta">Fecha final de la incapacidad anterior</span>
                  <input type="date" value={fechaFinalAnterior} max={hoyTexto()} onChange={(e) => cambiarFechaAnterior(e.target.value)} />
                </label>
              )}
            </div>
            {errores.fechaFinalAnterior && <p className="grupo-pie error" role="alert">{errores.fechaFinalAnterior}</p>}
            {/* Aviso suave: dentro del máximo, pero no empieza al día siguiente (lo normal) */}
            {prorroga && !errores.fechaFinalAnterior && diasEntreProrroga > 1 && diasEntreProrroga <= DIAS_MAXIMOS_PRORROGA && (
              <p className="grupo-pie" style={{ color: 'var(--alerta-texto)' }}>
                Normalmente la prórroga empieza al día siguiente ({fechaLarga(sumarDias(fechaFinalAnterior, 1))}). Revisa que las fechas coincidan con tu papel.
              </p>
            )}
            <p className="grupo-pie">
              Es prórroga si continúa una incapacidad anterior por la misma enfermedad (o una relacionada). Normalmente
              empieza al día siguiente de terminar la anterior, y máximo {DIAS_MAXIMOS_PRORROGA} días después.
            </p>
          </section>
        )}

        {datosTipo && (
          <section className="grupo">
            <h2 className="grupo-titulo">Fechas</h2>
            <div className="lista">
              {datosTipo.fechaAccidente && (
                <label className={`fila fila-campo ${errores.fechaAccidente ? 'con-error' : ''}`}>
                  <span className="etiqueta">Fecha del accidente</span>
                  <input type="date" value={fechaAccidente} max={hoyTexto()} onChange={(e) => setFechaAccidente(e.target.value)} />
                </label>
              )}
              <label className={`fila fila-campo ${errores.fechaInicial ? 'con-error' : ''}`}>
                <span className="etiqueta">Fecha inicial</span>
                <input type="date" value={fechaInicial} onChange={(e) => { setFechaInicial(e.target.value); limpiarErrorProrroga(); }} />
              </label>
              <label className={`fila fila-campo ${errores.dias ? 'con-error' : ''}`}>
                <span className="etiqueta">Días de {datosTipo.esLicencia ? 'licencia' : 'incapacidad'}</span>
                <input type="text" inputMode="numeric" placeholder="Ej. 3" value={dias} maxLength={3}
                       onChange={(e) => setDias(e.target.value.replace(/\D/g, ''))} />
              </label>
              {/* Fecha final: se calcula sola con los días. Si la cambian, se recalculan los días. */}
              <label className="fila fila-campo">
                <span className="etiqueta">Fecha final {fechaFinal ? '(se ajusta sola con los días)' : '(se calcula sola)'}</span>
                <input type="date" value={fechaFinal} min={fechaInicial || undefined} disabled={!fechaInicial}
                       onChange={(e) => cambiarFechaFinal(e.target.value)} />
              </label>
            </div>
            {['fechaAccidente', 'fechaInicial', 'dias'].filter((k) => errores[k]).map((k) => <p key={k} className="grupo-pie error" role="alert">{errores[k]}</p>)}
            {fechaFinal && <p className="grupo-pie">Del {fechaLarga(fechaInicial)} al {fechaLarga(fechaFinal)}: {plural(numeroDias, 'día', 'días')}. Revisa que coincida con tu papel.</p>}
          </section>
        )}

        {datosTipo && (
          <section className="grupo">
            <h2 className="grupo-titulo">Diagnóstico</h2>
            <div className="lista">
              <label className={`fila fila-campo ${errores.diagnostico ? 'con-error' : ''}`}>
                <span className="etiqueta">Código del diagnóstico (CIE-10)</span>
                <input type="text" autoCapitalize="characters" autoCorrect="off" spellCheck={false}
                       placeholder="Ej. J069" value={diagnostico} maxLength={8}
                       onChange={(e) => setDiagnostico(e.target.value.toUpperCase())} />
              </label>
              <div className="fila fila-tocable" role="button" tabIndex={0} onClick={alAbrirTutorial}
                   onKeyDown={(e) => (e.key === 'Enter' || e.key === ' ') && alAbrirTutorial()}>
                <div className="fila-cuerpo fila-titulo" style={{ color: 'var(--tinte)' }}>¿Dónde lo encuentro?</div>
                <span className="chevron" aria-hidden="true" />
              </div>
            </div>
            {errores.diagnostico && <p className="grupo-pie error" role="alert">{errores.diagnostico}</p>}
          </section>
        )}

        <div className="boton-centrado">
          <button type="button" className="boton-texto" onClick={alVolver}>Volver a mis datos</button>
        </div>
      </main>

      <div className="barra-accion">
        <div className="barra-accion-interna">
          <button type="button" className="boton boton-principal" onClick={guardar}>Guardar y seguir</button>
        </div>
      </div>
    </div>
  );
}

/**
 * Hoja de vista previa: muestra cómo quedaron las páginas (fotos o PDF comprimido)
 * y pregunta "¿Se lee bien?". Si alguna foto se ve borrosa u oscura, lo marca en rojo.
 */
function HojaVistaPrevia({ titulo, paginas, aviso, alAceptar, alCancelar }) {
  const urls = useMemo(() => paginas.map((p) => URL.createObjectURL(p.blob)), [paginas]);
  useEffect(() => () => urls.forEach((u) => URL.revokeObjectURL(u)), [urls]);
  const conAdvertencia = paginas.some((p) => (p.advertencias || []).length);

  return (
    <div className="hoja-fondo" onClick={alCancelar}>
      <div className="hoja tutorial" role="dialog" aria-modal="true" aria-label={titulo} onClick={(e) => e.stopPropagation()}>
        <div className="tutorial-agarre" aria-hidden="true" />
        <div className="tutorial-cabecera">
          <h2 className="tutorial-titulo">¿Se lee bien?</h2>
          <button type="button" className="tutorial-cerrar" aria-label="Cerrar" onClick={alCancelar}>✕</button>
        </div>
        <div className="tutorial-cuerpo">
          <p className="tutorial-intro">{titulo}. Acerca la vista y revisa que se lean las fechas, los días y el diagnóstico.</p>
          {aviso && <div className="aviso aviso-info">{aviso}</div>}
          {conAdvertencia && (
            <div className="aviso aviso-error">
              Algunas fotos se ven mal. Si no se leen, tómalas de nuevo: sobre una mesa, con buena luz y el celular quieto.
            </div>
          )}
          <div className="vista-previa">
            {paginas.map((p, i) => (
              <figure key={i} className={(p.advertencias || []).length ? 'con-advertencia' : ''}>
                <img src={urls[i]} alt={`Página ${i + 1}`} />
                <figcaption>
                  Página {i + 1}{(p.advertencias || []).length ? ` · ${p.advertencias.join(' y ').toLowerCase()}` : ''}
                </figcaption>
              </figure>
            ))}
          </div>
        </div>
        <div className="tutorial-pie pie-doble">
          <button type="button" className="boton boton-principal" onClick={alAceptar}>
            {conAdvertencia ? 'Sí se lee, usarlas igual' : 'Sí, se lee bien'}
          </button>
          <button type="button" className="boton-texto" onClick={alCancelar}>No, la tomo de nuevo</button>
        </div>
      </div>
    </div>
  );
}

/** Miniaturas de las fotos de un documento, con número de página y botón para quitar. */
function Miniaturas({ fotos, alQuitar }) {
  const urls = useMemo(() => fotos.map((f) => URL.createObjectURL(f.blob)), [fotos]);
  useEffect(() => () => urls.forEach((u) => URL.revokeObjectURL(u)), [urls]);
  return (
    <div className="miniaturas">
      {fotos.map((f, i) => (
        <div key={i} className={`miniatura ${f.advertencias.length ? 'con-advertencia' : ''}`}>
          <img src={urls[i]} alt={`Página ${i + 1}`} />
          <span className="miniatura-numero">{i + 1}</span>
          <button type="button" className="miniatura-quitar" aria-label={`Quitar página ${i + 1}`} onClick={() => alQuitar(i)}>✕</button>
        </div>
      ))}
    </div>
  );
}

/**
 * Fila de un documento: subir un PDF o agregar fotos (una por página), ver,
 * quitar páginas o cambiarlo todo.
 */
function TarjetaDocumento({ doc, posicion, entrada, sesion, alGuardar, alQuitarTodo, alAbrirTutorial }) {
  const selectorFotos = useRef(null);
  const selectorCamara = useRef(null);
  const selectorPdf = useRef(null);
  const [error, setError] = useState(null);
  const [revisando, setRevisando] = useState(null);   // texto de lo que está haciendo, o null
  const [pendiente, setPendiente] = useState(null);   // lo que espera confirmación en la vista previa
  const [pidiendoClave, setPidiendoClave] = useState(null); // { archivo, clave, claveMala } si el PDF tiene contraseña
  const listo = documentoListo(entrada);
  const esFotos = listo && entrada.origen === 'fotos';
  // Para revisar repetidos, lo que hay en ESTE documento no cuenta si se va a reemplazar
  const otrosArchivos = (reemplaza) => (reemplaza ? { ...sesion.archivos, [doc.id]: null } : sesion.archivos);

  /** Fotos elegidas: se revisa cada una, se ajusta el peso y se muestra la vista previa. */
  async function procesarFotos(elegidas) {
    if (!elegidas.length) return;
    setError(null);
    const reemplazaPdf = listo && entrada.origen === 'pdf';
    const anteriores = esFotos ? entrada.fotos : [];
    if (anteriores.length + elegidas.length > CONFIG.paginasMaximas) {
      setError(`Máximo ${CONFIG.paginasMaximas} páginas por documento.`); return;
    }
    setRevisando('Revisando las fotos…');
    const errores = []; // se juntan los problemas de todas las fotos elegidas
    try {
      const nuevas = [];
      const actuales = { ...otrosArchivos(reemplazaPdf) };
      for (const archivo of elegidas) {
        const r = await prepararFoto(archivo, actuales);
        if (r.error) { errores.push(`${archivo.name}: ${r.error}`); continue; }
        nuevas.push(r.foto);
        actuales[doc.id] = { origen: 'fotos', fotos: [...anteriores, ...nuevas] }; // detecta repetidas en el mismo lote
      }
      if (!nuevas.length) return;
      setRevisando('Ajustando el peso…');
      const ajuste = await ajustarFotosAlLimite([...anteriores, ...nuevas]);
      if (ajuste.error) { setError(ajuste.error); return; }
      setPendiente({
        entrada: { origen: 'fotos', fotos: ajuste.fotos },
        paginas: ajuste.fotos.slice(anteriores.length),
        titulo: `${plural(nuevas.length, 'foto nueva', 'fotos nuevas')} en "${doc.nombre}"`,
        aviso: reemplazaPdf ? 'Estas fotos reemplazan el PDF que habías subido.' : null,
      });
    } catch {
      errores.push('No pudimos leer la foto. Vuelve a tomarla.');
    } finally {
      setRevisando(null);
      if (errores.length) setError(errores.join(' '));
    }
  }

  /**
   * PDF elegido: se revisa; si tiene contraseña se la quita (o la pide) y si
   * pesa mucho lo comprime. En esos dos casos muestra la vista previa.
   * claveEscrita: la contraseña que escribió el colaborador (si se la pidieron).
   */
  async function procesarPdf(archivo, claveEscrita) {
    if (!archivo) return;
    setError(null);
    setRevisando(claveEscrita ? 'Quitando la contraseña…'
      : archivo.size > CONFIG.tamanoMaximoMB * 1024 * 1024 ? 'Comprimiendo el PDF… puede tardar un poco' : 'Revisando…');
    try {
      const r = await prepararPdf(archivo, sesion.datos.cedula, otrosArchivos(true), claveEscrita);
      if (r.error) { setError(`${archivo.name}: ${r.error}`); setPidiendoClave(null); return; }
      if (r.necesitaClave) { setPidiendoClave({ archivo, clave: claveEscrita || '', claveMala: r.claveMala }); return; }
      setPidiendoClave(null);
      const nueva = { origen: 'pdf', pdf: r.pdf };
      if (r.vistaPrevia) {
        const hechos = [r.pdf.claveQuitada && 'le quitamos la contraseña',
                        r.pdf.comprimido && `lo comprimimos de ${pesoLegible(r.pdf.pesoOriginal)} a ${pesoLegible(r.pdf.tamano)}`].filter(Boolean);
        setPendiente({
          entrada: nueva, paginas: r.vistaPrevia,
          titulo: `A "${archivo.name}" ${hechos.join(' y ')}`,
          aviso: esFotos ? 'Este PDF reemplaza las fotos que habías subido.' : null,
        });
      } else {
        alGuardar(doc.id, nueva);
      }
    } catch {
      setError('No pudimos leer el archivo. Vuelve a elegirlo.');
    } finally { setRevisando(null); }
  }

  /** Lee los archivos del selector y lo limpia (para poder volver a elegir el mismo). */
  const alElegirFotos = (e) => { const a = Array.from(e.target.files || []); e.target.value = ''; procesarFotos(a); };
  const alElegirPdf = (e) => { const a = (e.target.files || [])[0]; e.target.value = ''; procesarPdf(a); };

  /** Quita una foto (página) del documento. */
  function quitarFoto(indice) {
    const fotos = entrada.fotos.filter((_, i) => i !== indice);
    if (fotos.length) alGuardar(doc.id, { origen: 'fotos', fotos });
    else alQuitarTodo(doc.id);
  }

  /** Abre el documento completo como quedará en el ZIP (si son fotos, arma el PDF). */
  async function ver() {
    try { verArchivo(await pdfDelDocumento(entrada)); } catch { setError('No pudimos abrir el documento.'); }
  }

  const peso = pesoDelDocumento(entrada);

  return (
    <div className="fila fila-con-icono">
      <div className={`circulo ${listo ? 'hecho' : ''}`} aria-hidden="true">
        {listo ? <Palomita tamano={16} /> : posicion}
      </div>
      <div className="fila-cuerpo">
        <div className="fila-titulo fuerte">{doc.nombre}</div>
        <div className="fila-sub">
          {doc.ayuda}{' '}
          {doc.tutorial && (
            <button type="button" className="boton-como" onClick={() => alAbrirTutorial(doc)}>{doc.tutorial.boton || '¿Cómo lo saco?'}</button>
          )}
        </div>

        {doc.plantilla && (
          <div className="doc-acciones">
            <button type="button" className="boton boton-tintado boton-chico"
                    onClick={() => descargarArchivo(cartaPaternidadPdf(sesion.datos, sesion.incapacidad), `carta_licencia_paternidad_${sesion.datos.cedula}.pdf`)}>
              Descargar carta para firmar
            </button>
          </div>
        )}

        {listo && entrada.origen === 'pdf' && (
          <div className="archivo">
            <span className="archivo-nombre">
              {entrada.pdf.nombre} <span className="archivo-peso">· {pesoLegible(entrada.pdf.tamano)}</span>
              {entrada.pdf.comprimido && <span className="archivo-peso"> · comprimido</span>}
              {entrada.pdf.claveQuitada && <span className="archivo-peso"> · sin contraseña</span>}
            </span>
            <span className="archivo-acciones">
              <button type="button" className="boton-texto" onClick={ver}>Ver</button>
              <button type="button" className="boton-texto peligro" onClick={() => alQuitarTodo(doc.id)}>Quitar</button>
            </span>
          </div>
        )}

        {esFotos && (
          <>
            <Miniaturas fotos={entrada.fotos} alQuitar={quitarFoto} />
            <div className="archivo">
              <span className="archivo-nombre">
                {plural(entrada.fotos.length, 'página', 'páginas')} <span className="archivo-peso">· {pesoLegible(peso)} de {CONFIG.tamanoMaximoMB} MB</span>
              </span>
              <span className="archivo-acciones">
                <button type="button" className="boton-texto" onClick={ver}>Ver PDF</button>
                <button type="button" className="boton-texto peligro" onClick={() => alQuitarTodo(doc.id)}>Quitar todo</button>
              </span>
            </div>
          </>
        )}

        {error && <p className="doc-error" role="alert">{error}</p>}

        {/* El PDF tiene contraseña y no es la cédula: se le pide al colaborador para quitársela */}
        {pidiendoClave && !revisando && (
          <div className="caja-clave">
            <p className="fila-sub">
              <strong>"{pidiendoClave.archivo.name}" tiene contraseña.</strong> Escríbela y se la quitamos, para que
              Gestión Humana lo pueda abrir.
            </p>
            <input type="text" autoComplete="off" autoCorrect="off" autoCapitalize="none" spellCheck={false}
                   aria-label="Contraseña del PDF" placeholder="Contraseña del PDF" value={pidiendoClave.clave}
                   onChange={(e) => setPidiendoClave({ ...pidiendoClave, clave: e.target.value, claveMala: false })}
                   onKeyDown={(e) => e.key === 'Enter' && pidiendoClave.clave && procesarPdf(pidiendoClave.archivo, pidiendoClave.clave)} />
            {pidiendoClave.claveMala && <p className="doc-error" role="alert">Esa contraseña no abre el PDF. Revísala e intenta de nuevo.</p>}
            <p className="fila-sub">Suele ser tu número de cédula, una fecha o un código que te llegó en el mismo correo. Si no la sabes, tómale fotos a las páginas.</p>
            <div className="doc-acciones" style={{ marginTop: 0 }}>
              <button type="button" className="boton boton-tintado boton-chico" disabled={!pidiendoClave.clave}
                      onClick={() => procesarPdf(pidiendoClave.archivo, pidiendoClave.clave)}>Quitar contraseña</button>
              <button type="button" className="boton-texto" style={{ fontSize: 15 }} onClick={() => setPidiendoClave(null)}>Cancelar</button>
            </div>
          </div>
        )}

        <div className="doc-acciones">
          {/* Selectores de archivo ocultos: los abren los botones de abajo */}
          <input ref={selectorCamara} className="oculto" type="file" tabIndex={-1} aria-hidden="true"
                 accept="image/*" capture="environment" onChange={alElegirFotos} />
          <input ref={selectorFotos} className="oculto" type="file" tabIndex={-1} aria-hidden="true"
                 accept="image/*" multiple onChange={alElegirFotos} />
          <input ref={selectorPdf} className="oculto" type="file" tabIndex={-1} aria-hidden="true"
                 accept="application/pdf,.pdf" onChange={alElegirPdf} />
          {revisando ? (
            <span className="fila-sub revisando">{revisando}</span>
          ) : (
            <>
              <button type="button" className="boton boton-tintado boton-chico" onClick={() => selectorCamara.current.click()}>
                {esFotos ? 'Tomar otra página' : 'Tomar foto'}
              </button>
              <button type="button" className="boton-texto" style={{ fontSize: 15 }} onClick={() => selectorFotos.current.click()}>
                {esFotos ? 'Agregar de la galería' : 'Elegir fotos'}
              </button>
              <button type="button" className="boton-texto" style={{ fontSize: 15 }} onClick={() => selectorPdf.current.click()}>
                {listo && entrada.origen === 'pdf' ? 'Cambiar PDF' : 'Subir PDF'}
              </button>
            </>
          )}
        </div>
      </div>

      {pendiente && (
        <HojaVistaPrevia titulo={pendiente.titulo} paginas={pendiente.paginas} aviso={pendiente.aviso}
                         alAceptar={() => { alGuardar(doc.id, pendiente.entrada); setPendiente(null); }}
                         alCancelar={() => setPendiente(null)} />
      )}
    </div>
  );
}

/** Pantalla 4: lista de documentos según el tipo de incapacidad. */
function PantallaDocumentos({ sesion, alGuardarDocumento, alQuitarDocumento, alEditarDatos, alEditarIncapacidad,
                              alContinuar, alBorrarTodo, alAbrirTutorial }) {
  const docs = documentosQueAplican(sesion.incapacidad);
  const faltan = docs.filter((d) => !documentoListo(sesion.archivos[d.id])).length;
  const tipo = tipoPorCodigo(sesion.incapacidad.tipo);
  const inc = sesion.incapacidad;

  return (
    <>
      <main className="contenido pantalla-documentos">
        <h1>Tus documentos</h1>
        <p className="bajada">Sube cada uno en PDF o tómale fotos (una por página). Puedes saltar alguno y volver después.</p>

        {/* En computador estos dos bloques quedan lado a lado */}
        <div className="docs-cabecera">
        <section className="grupo">
          <div className="lista">
            <div className="fila">
              <div className="fila-cuerpo">
                <div className="fila-titulo fuerte fila-nombre">{sesion.datos.nombre}</div>
                <div className="fila-sub">Documento {sesion.datos.cedula} · {sesion.datos.sede}</div>
              </div>
              <button type="button" className="boton-texto" onClick={alEditarDatos}>Editar</button>
            </div>
            <div className="fila">
              <div className="fila-cuerpo">
                <div className="fila-titulo fuerte">{tipo.corto}{inc.accidenteTransito ? ' · accidente de tránsito' : ''}{inc.prorroga ? ' · prórroga' : ''}</div>
                {inc.prorroga && inc.fechaFinalAnterior && <div className="fila-sub">La anterior terminó el {fechaLarga(inc.fechaFinalAnterior)}</div>}
                <div className="fila-sub">
                  {plural(inc.dias, 'día', 'días')}: del {fechaLarga(inc.fechaInicial)} al {fechaLarga(calcularFechaFinal(inc.fechaInicial, inc.dias))} · Diagnóstico {inc.diagnostico}
                </div>
              </div>
              <button type="button" className="boton-texto" onClick={alEditarIncapacidad}>Editar</button>
            </div>
          </div>
          <p className="grupo-pie">
            {sesion.dispositivoPersonal
              ? `Tu avance se guarda en este dispositivo hasta el ${fechaLegible(sesion.expira)}. Vuelve desde este mismo navegador para continuar.`
              : 'No guardamos nada en este dispositivo: si cierras la página, tendrás que empezar de nuevo.'}
          </p>
        </section>

        <section className="grupo">
          <div className="lista">
            <div className="fila fila-tocable" role="button" tabIndex={0} onClick={() => alAbrirTutorial('foto')}
                 onKeyDown={(e) => (e.key === 'Enter' || e.key === ' ') && alAbrirTutorial('foto')}>
              <div className="fila-cuerpo">
                <div className="fila-titulo" style={{ color: 'var(--tinte)' }}>Cómo tomar una buena foto</div>
                <div className="fila-sub">Para que Gestión Humana pueda leer tus documentos</div>
              </div>
              <span className="chevron" aria-hidden="true" />
            </div>
          </div>
        </section>
        </div>

        <section className="grupo">
          <h2 className="grupo-titulo">Documentos · máximo {CONFIG.tamanoMaximoMB} MB cada uno (comprimimos por ti)</h2>
          {/* En celular es una lista; en computador cada documento es una tarjeta (dos por fila) */}
          <div className="lista lista-docs">
            {docs.map((doc, i) => (
              <TarjetaDocumento key={doc.id} doc={doc} posicion={i + 1} entrada={sesion.archivos[doc.id]} sesion={sesion}
                                alGuardar={alGuardarDocumento} alQuitarTodo={alQuitarDocumento}
                                alAbrirTutorial={alAbrirTutorial} />
            ))}
          </div>
        </section>

        <div className="boton-centrado">
          <button type="button" className="boton-texto peligro" onClick={alBorrarTodo}>Borrar todo y empezar de nuevo</button>
        </div>
      </main>

      <div className="barra-accion">
        <div className="barra-accion-interna">
          <button type="button" className="boton boton-principal" disabled={faltan > 0} onClick={alContinuar}>Revisar y enviar</button>
          {faltan > 0 && <p className="nota">Te {faltan === 1 ? 'falta' : 'faltan'} {plural(faltan, 'documento', 'documentos')} para poder enviar.</p>}
        </div>
      </div>
    </>
  );
}

/** Pantalla 5: descargar el ZIP y subirlo a OneDrive. */
function PantallaEnvio({ sesion, alVolver, alTerminar }) {
  const [zip, setZip] = useState(null);
  const [armando, setArmando] = useState(false);
  const [error, setError] = useState(null);
  const [abrioEnvio, setAbrioEnvio] = useState(false);
  const nombreZip = nombreDelZip(sesion);
  const hayLink = !!CONFIG.linkSubida;

  /** Arma el ZIP y lo descarga. */
  async function descargar() {
    setArmando(true);
    setError(null);
    try {
      const blob = zip || await armarZip(sesion);
      setZip(blob);
      descargarArchivo(blob, nombreZip);
    } catch (e) {
      setError('No pudimos armar el archivo. Intenta de nuevo; si sigue fallando, prueba desde otro navegador.');
    }
    setArmando(false);
  }

  /** Evita usar el paso 2 antes de descargar; si ya descargó, lo marca como hecho. */
  const alAbrirEnvio = (e) => { if (!zip || !hayLink) e.preventDefault(); else setAbrioEnvio(true); };

  return (
    <>
      <main className="contenido pantalla-angosta">
        <h1>Revisa y envía</h1>
        <p className="bajada">Tienes todos los documentos. Solo faltan dos pasos.</p>
        {error && <div className="aviso aviso-error" role="alert">{error}</div>}

        <section className="grupo">
          <div className="lista">
            <div className="fila fila-con-icono">
              <div className={`circulo ${zip ? 'hecho' : 'activo'}`} aria-hidden="true">{zip ? <Palomita tamano={16} /> : 1}</div>
              <div className="fila-cuerpo">
                <div className="fila-titulo fuerte">Descarga tu paquete</div>
                <div className="fila-sub">Se guarda en tu carpeta de Descargas con este nombre:</div>
                <div className="archivo"><span className="archivo-nombre">{nombreZip}</span>
                  {zip && <span className="archivo-peso">{pesoLegible(zip.size)}</span>}</div>
                <div className="doc-acciones">
                  <button type="button" className="boton boton-tintado boton-chico" onClick={descargar} disabled={armando}>
                    {armando ? 'Armando el paquete…' : zip ? 'Descargar otra vez' : 'Descargar paquete'}
                  </button>
                </div>
              </div>
            </div>

            <div className="fila fila-con-icono" style={{ opacity: zip ? 1 : 0.5 }}>
              <div className={`circulo ${abrioEnvio ? 'hecho' : zip ? 'activo' : ''}`} aria-hidden="true">{abrioEnvio ? <Palomita tamano={16} /> : 2}</div>
              <div className="fila-cuerpo">
                <div className="fila-titulo fuerte">Sube el paquete</div>
                <div className="fila-sub">
                  Se abre la página de Cañaveral para recibir archivos. Toca para elegir archivos,
                  selecciona el ZIP que acabas de descargar (está en Descargas) y escribe tu nombre
                  y apellido cuando te lo pida.
                </div>
                <div className="doc-acciones">
                  <a className="boton boton-tintado boton-chico" href={zip && hayLink ? CONFIG.linkSubida : undefined}
                     target="_blank" rel="noopener noreferrer" aria-disabled={!zip || !hayLink} onClick={alAbrirEnvio}>
                    Abrir página de subida
                  </a>
                </div>
                {!hayLink && <p className="doc-error">Falta configurar el link de subida (Gestión Humana: campo linkSubida).</p>}
              </div>
            </div>
          </div>
        </section>

        <div className="boton-centrado">
          <button type="button" className="boton-texto" onClick={alVolver}>Volver a mis documentos</button>
        </div>
      </main>

      <div className="barra-accion">
        <div className="barra-accion-interna">
          <button type="button" className="boton boton-principal" disabled={!abrioEnvio} onClick={alTerminar}>
            Ya lo subí, borrar mis datos
          </button>
          {!abrioEnvio && <p className="nota">Completa los dos pasos para terminar.</p>}
        </div>
      </div>
    </>
  );
}

      <circle cx="88" cy="30" r="6" fill="var(--lima)" />
      <path d="M88 20 v-4 M88 44 v-4 M78 30 h-4 M102 30 h-4" stroke="var(--lima)" strokeWidth="1.5" />
      <rect x="34" y="44" width="52" height="70" rx="2" fill="var(--celda)" stroke="var(--separador)" />
      {[54, 62, 70, 78, 86].map((y) => <rect key={y} x="40" y={y} width="40" height="3.5" rx="1.5" fill="var(--separador)" />)}
    </MarcoCelular>
  );
}

/** Encuadre: la hoja completa dentro de las esquinas de la cámara. */
function IlustracionEncuadre() {
  const esquina = (x, y, dx, dy) => <path d={`M${x} ${y + dy * 10} v${-dy * 10} h${dx * 10}`} stroke="var(--tinte)" strokeWidth="2.4" fill="none" />;
  return (
    <MarcoCelular>
      <rect x="15" y="12" width="90" height="126" rx="8" fill="var(--tinta-ilus)" opacity="0.85" />
      <rect x="32" y="32" width="56" height="78" rx="2" fill="#FFFFFF" />
      {[42, 50, 58, 66, 74].map((y) => <rect key={y} x="38" y={y} width="44" height="3.5" rx="1.5" fill="#C9D2C6" />)}
      {esquina(26, 26, 1, 1)}{esquina(94, 26, -1, 1)}{esquina(26, 116, 1, -1)}{esquina(94, 116, -1, -1)}
      <circle cx="60" cy="128" r="5" fill="#FFFFFF" />
    </MarcoCelular>
  );
}

/** Varias páginas que se unen en un PDF. */
function IlustracionPaginas() {
  return (
    <MarcoCelular>
      {[0, 1, 2].map((i) => (
        <rect key={i} x={28 + i * 8} y={26 + i * 8} width="44" height="58" rx="2" fill="var(--celda)" stroke="var(--separador)" />
      ))}
      <text x="72" y="72" fontSize="9" fill="var(--texto-2)" textAnchor="middle" fontWeight="700">3</text>
      <path d="M60 98 v10 M55 103 l5 5 5 -5" stroke="var(--tinte)" strokeWidth="2" fill="none" strokeLinecap="round" />
      <rect x="44" y="112" width="32" height="14" rx="3" fill="var(--rojo)" />
      <text x="60" y="122" fontSize="7" fill="#FFFFFF" textAnchor="middle" fontWeight="700">1 PDF</text>
    </MarcoCelular>
  );
}

/** Une el nombre de cada ilustración (usado en la configuración) con su dibujo. */
const ILUSTRACIONES = {
  diagnostico: IlustracionDiagnostico, codigo: IlustracionCodigo, incapacidad: IlustracionIncapacidad,
  hospital: IlustracionHospital, registro: IlustracionRegistro, firma: IlustracionFirma,
  foto: IlustracionFoto, encuadre: IlustracionEncuadre, paginas: IlustracionPaginas,
};

/**
 * Hoja del tutorial: título, pasos numerados con su ilustración y enlaces.
 * Se cierra tocando fuera, con "Entendido" o con la tecla Escape.
 */
function HojaTutorial({ tutorial, alCerrar }) {
  const hoja = useRef(null);
  useEffect(() => {
    if (hoja.current) hoja.current.focus();
    const alTeclear = (e) => { if (e.key === 'Escape') alCerrar(); };
    window.addEventListener('keydown', alTeclear);
    return () => window.removeEventListener('keydown', alTeclear);
  }, []);

  return (
    <div className="hoja-fondo" onClick={alCerrar}>
      <div className="hoja tutorial" role="dialog" aria-modal="true" aria-label={tutorial.titulo}
           ref={hoja} tabIndex={-1} onClick={(e) => e.stopPropagation()}>
        <div className="tutorial-agarre" aria-hidden="true" />
        <div className="tutorial-cabecera">
          <h2 className="tutorial-titulo">{tutorial.titulo}</h2>
          <button type="button" className="tutorial-cerrar" aria-label="Cerrar" onClick={alCerrar}>✕</button>
        </div>
        <div className="tutorial-cuerpo">
          {tutorial.intro && <p className="tutorial-intro">{tutorial.intro}</p>}
          <ol className="tutorial-pasos">
            {tutorial.pasos.map((paso, i) => {
              const Dibujo = ILUSTRACIONES[paso.ilustracion];
              return (
                <li key={i} className="tutorial-paso">
                  {Dibujo && <Dibujo />}
                  <div className="tutorial-paso-texto">
                    <span className="tutorial-numero">Paso {i + 1}</span>
                    <p>{paso.texto}</p>
                    {paso.enlace && (
                      <a className="boton boton-tintado boton-chico" href={paso.enlace.url} target="_blank" rel="noopener noreferrer">{paso.enlace.texto}</a>
                    )}
                  </div>
                </li>
              );
            })}
          </ol>
          {tutorial.nota && <p className="tutorial-nota">{tutorial.nota}</p>}
        </div>
        <div className="tutorial-pie">
          <button type="button" className="boton boton-principal" onClick={alCerrar}>Entendido</button>
        </div>
      </div>
    </div>
  );
}

/**
 * Ventana de confirmación estilo iPhone (hoja que sale desde abajo).
 * Reemplaza confirm()/alert() del navegador, que algunas vistas previas bloquean.
 */
function HojaConfirmacion({ mensaje, textoAccion, peligro, soloAviso, alConfirmar, alCerrar }) {
  return (
    <div className="hoja-fondo" onClick={alCerrar}>
      <div className="hoja" role="alertdialog" aria-modal="true" aria-label={mensaje} onClick={(e) => e.stopPropagation()}>
        <div className="hoja-grupo">
          <p className="hoja-mensaje">{mensaje}</p>
          <button type="button" className={`hoja-boton ${peligro ? 'peligro' : ''}`} onClick={() => { alCerrar(); alConfirmar(); }}>
            {textoAccion}
          </button>
        </div>
        {!soloAviso && <button type="button" className="hoja-boton hoja-cancelar" onClick={alCerrar}>Cancelar</button>}
      </div>
    </div>
  );
}

/** Pantalla final. */
function PantallaFinal({ nombreZip, alReiniciar }) {
  return (
    <main className="contenido final">
      <div className="final-icono"><Palomita tamano={44} /></div>
      <h1>¡Listo!</h1>
      <p className="bajada">
        Borramos tus documentos de esta página. Gestión Humana revisará tu incapacidad y te escribirá si falta algo.
      </p>
      <div className="aviso aviso-alerta">
        El archivo <strong style={{ overflowWrap: 'anywhere' }}>{nombreZip}</strong> sigue en tu carpeta de
        Descargas. Si este dispositivo no es tuyo, bórralo.
      </div>
      <button type="button" className="boton-texto" onClick={alReiniciar}>Enviar otra incapacidad</button>
    </main>
  );
}

/* ============================================================================
   6. APP PRINCIPAL: decide qué pantalla mostrar y guarda los cambios
   ============================================================================ */
function App() {
  const [cargando, setCargando] = useState(true);
  const [sesion, setSesion] = useState(null);
  const [pantalla, setPantalla] = useState('inicio'); // inicio | datos | incapacidad | documentos | envio | final
  const [guardadoDisponible, setGuardadoDisponible] = useState(true);
  const [avisoInicial, setAvisoInicial] = useState(null);
  const [zipFinal, setZipFinal] = useState('');
  const [modoPrueba, setModoPrueba] = useState('normal');
  const [confirmacion, setConfirmacion] = useState(null);
  const [tutorial, setTutorial] = useState(null);       // tutorial abierto (o null)

  // --- Al abrir: recupera el avance guardado (si existe y no ha vencido) ---
  useEffect(() => {
    (async () => {
      try {
        const guardada = await BD.leer();
        if (guardada) {
          if (Date.now() > guardada.expira) {
            await BD.borrar();
            setAvisoInicial(`Tu avance anterior se borró porque pasaron más de ${CONFIG.diasConservacion} días. Empieza de nuevo.`);
          } else {
            setSesion(guardada);
            // Si la sede guardada ya no está en la lista, o falta algo, se vuelve a esa pantalla
            const datosValidos = guardada.datos && SEDES.includes(guardada.datos.sede);
            const incapacidadValida = guardada.incapacidad && tipoPorCodigo(guardada.incapacidad.tipo);
            setPantalla(!datosValidos ? 'datos' : !incapacidadValida ? 'incapacidad' : 'documentos');
          }
        }
      } catch {
        setGuardadoDisponible(false);
      }
      setCargando(false);
    })();
  }, []);

  // --- Cada cambio se guarda en el dispositivo (solo si es propio y no es prueba) ---
  useEffect(() => {
    if (!sesion || !sesion.dispositivoPersonal || sesion.esPrueba) return;
    BD.guardar(sesion).catch(() => {
      setGuardadoDisponible(false);
      setSesion((s) => (s ? { ...s, dispositivoPersonal: false } : s));
      setConfirmacion({
        mensaje: 'No pudimos guardar tu avance en este dispositivo. Puedes seguir, pero termina antes de cerrar la página.',
        textoAccion: 'Entendido', alConfirmar: () => {}, soloAviso: true,
      });
    });
  }, [sesion]);

  // --- Al cambiar de pantalla, vuelve arriba ---
  useEffect(() => { window.scrollTo(0, 0); }, [pantalla]);

  /** Borra todo: memoria y dispositivo. */
  async function borrarTodo() {
    try { await BD.borrar(); } catch { /* sin base de datos no hay nada que borrar */ }
    setSesion(null);
  }

  // --- Limpieza automática en dispositivos prestados ---
  const segundosRestantes = useInactividad(
    !!sesion && !sesion.dispositivoPersonal && !sesion.esPrueba && pantalla !== 'final',
    CONFIG.minutosInactividad,
    async () => {
      await borrarTodo();
      setPantalla('inicio');
      setAvisoInicial('Borramos tus documentos porque la página estuvo sin uso. Empieza de nuevo cuando quieras.');
    }
  );

  // --- Acciones que usan las pantallas ---
  function comenzar(dispositivoPersonal) {
    setAvisoInicial(null);
    setSesion(sesionNueva(dispositivoPersonal));
    setPantalla('datos');
  }
  function guardarDatos(datos) {
    setSesion((s) => ({ ...s, datos }));
    setPantalla(sesion && sesion.incapacidad ? 'documentos' : 'incapacidad');
  }
  function guardarIncapacidad(incapacidad) {
    setSesion((s) => ({ ...s, incapacidad }));
    setPantalla('documentos');
  }
  /** Guarda (o reemplaza) lo subido en un documento. */
  function guardarDocumento(idDoc, entrada) {
    setSesion((s) => ({ ...s, archivos: { ...s.archivos, [idDoc]: entrada } }));
  }
  /** Quita todo lo subido en un documento. */
  function quitarDocumento(idDoc) {
    setSesion((s) => { const archivos = { ...s.archivos }; delete archivos[idDoc]; return { ...s, archivos }; });
  }
  /** Abre un tutorial: el de un documento, el del diagnóstico o el de las fotos. */
  function abrirTutorial(cual) {
    if (cual === 'diagnostico') setTutorial(TUTORIAL_DIAGNOSTICO);
    else if (cual === 'foto') setTutorial(TUTORIAL_FOTO);
    else if (cual && cual.tutorial) setTutorial(cual.tutorial);
  }
  function confirmarBorrado() {
    setConfirmacion({
      mensaje: '¿Borrar todos tus datos y documentos de este dispositivo?', textoAccion: 'Borrar todo', peligro: true,
      alConfirmar: async () => { await borrarTodo(); setPantalla('inicio'); },
    });
  }
  function terminar() {
    setConfirmacion({
      mensaje: '¿Ya subiste el paquete? Vamos a borrar tus documentos de este dispositivo.', textoAccion: 'Sí, ya lo subí',
      alConfirmar: async () => { setZipFinal(nombreDelZip(sesion)); await borrarTodo(); setPantalla('final'); },
    });
  }
  /** Solo modo prueba: cambia entre datos normales y casos difíciles. */
  async function cambiarModoPrueba(modo) {
    setModoPrueba(modo);
    if (modo === 'normal') { setSesion(null); setPantalla('inicio'); return; }
    setSesion(await sesionDePrueba(modo));
    setPantalla('documentos');
  }

  // --- Avance para la barra de caña ---
  const docsAplicables = sesion?.incapacidad ? documentosQueAplican(sesion.incapacidad) : [];
  const completos = docsAplicables.filter((d) => documentoListo(sesion.archivos[d.id])).length;
  const mostrarAvance = ['documentos', 'envio'].includes(pantalla);

  if (cargando) return null;

  return (
    <div className="app">
      <Encabezado paso={{ inicio: 1, datos: 2, incapacidad: 3, documentos: 4, envio: 5 }[pantalla]}
                  completos={completos} total={mostrarAvance ? docsAplicables.length : 0} />

      {/* En computador: tres columnas (Tu avance · pantalla · Ayuda). En celular, solo la pantalla. */}
      <div className="cuerpo">
      <ColumnaAvance pantalla={pantalla} />
      <div className="principal">

      {pantalla === 'inicio' && <PantallaInicio alComenzar={comenzar} guardadoDisponible={guardadoDisponible} avisoInicial={avisoInicial} />}
      {pantalla === 'datos' && sesion && <PantallaDatos datosIniciales={sesion.datos} alGuardar={guardarDatos} />}
      {pantalla === 'incapacidad' && sesion?.datos && (
        <PantallaIncapacidad incapacidadInicial={sesion.incapacidad} alGuardar={guardarIncapacidad}
                             alVolver={() => setPantalla('datos')} alAbrirTutorial={() => abrirTutorial('diagnostico')} />
      )}
      {pantalla === 'documentos' && sesion?.datos && sesion?.incapacidad && (
        <PantallaDocumentos sesion={sesion} alGuardarDocumento={guardarDocumento} alQuitarDocumento={quitarDocumento}
                            alEditarDatos={() => setPantalla('datos')} alEditarIncapacidad={() => setPantalla('incapacidad')}
                            alContinuar={() => setPantalla('envio')} alBorrarTodo={confirmarBorrado} alAbrirTutorial={abrirTutorial} />
      )}
      {pantalla === 'envio' && sesion?.datos && sesion?.incapacidad && (
        <PantallaEnvio sesion={sesion} alVolver={() => setPantalla('documentos')} alTerminar={terminar} />
      )}
      {pantalla === 'final' && <PantallaFinal nombreZip={zipFinal} alReiniciar={() => { setAvisoInicial(null); setPantalla('inicio'); }} />}
      </div>
      <ColumnaAyuda />
      </div>

      {tutorial && <HojaTutorial tutorial={tutorial} alCerrar={() => setTutorial(null)} />}
      {confirmacion && <HojaConfirmacion {...confirmacion} alCerrar={() => setConfirmacion(null)} />}

      {segundosRestantes !== null && (
        <div className="aviso-flotante" role="alert">
          <p>Por seguridad, borraremos todo en {segundosRestantes} s si no usas la página.</p>
          <button type="button" className="boton boton-tintado boton-chico">Sigo aquí</button>
        </div>
      )}

      {MODO_PRUEBA && (
        <div className="selector-prueba" aria-label="Datos de prueba">
          {[['normal', 'Normal'], ['extremo', 'Caso extremo'], ['vacio', 'Vacío']].map(([valor, texto]) => (
            <button key={valor} type="button" className={modoPrueba === valor ? 'activo' : ''} onClick={() => cambiarModoPrueba(valor)}>{texto}</button>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('raiz')).render(<App />);
</script>
</body>
</html>
