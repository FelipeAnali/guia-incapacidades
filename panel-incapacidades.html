  'NUMERO DE PRORROGA (No obligatorio, (Es obligatorio si el TNL   es de prorroga), sí el TNL a prorrogar no se encuntra en el mismo   plano, se valida contra los TNL ya ingresados en el sistema  (la primera validación es con plano).)', // R (solo prórroga)
  'INGRESO BASE DE COTIZACION (Obligatorio, Incluye 2 decimales   sin comas y puntos. si se activa  la casilla de verificación [valoriza al   importar]  se calcula automáticamente)', // S (0)
  'INDICADOR DE PRORROGA (Obligatorio  , (0=No, 1=Si   ))',  // T

  'FECHA DE EXPEDICION DE INCAPACIDAD (  YYYYMMDD,No obligatorio)', // V (vacía)
  'VALOR EMPRESA 1 (Obligatorio, Valor empresa1, incluye 2 decimales sin punto ni coma ,   Corresponde al pago de la incapacidad por parte de la empresa correspondiente a los   tres primeros días cuando la clase de TNL es enfermedad general (1);   o el primer día, si es accidente de trabajo.  si se activa la casilla de verificación   [valoriza al importar] se calcula automáticamente)', // W (0)
  'VALOR EMPRESA 2 (  Obligatorio, Valor empresa2,  incluye 2 decimales sin punto ni coma,  Corresponde al pago de la incapacidad por parte de la  empresa correspondiente al tercio cuando la clase de   TNL es enfermedad general (1). si se  activa la  casilla de verificación [valoriza al importar] se calcula automáticamente)', // X (0)

];

/**
 * Color del título de cada columna (A a AB), igual al formato que mandó nómina:
 *   O = obligatoria (amarillo) · C = siempre 0 (azul) · A = solo accidente de trabajo (verde)
 *   P = solo prórroga (rojo)   · - = vacía (blanco)
 */
const COLORES_PLANO = 'O-O--OOOOC-C--OOAPCO--CCC---'.split('');
const COLOR_TITULO = { O: 'FFFFFF00', C: 'FF9BC2E6', A: 'FF70AD47', P: 'FFFF7C80', '-': 'FFFFFFFF' };

/** Fecha del plano: número AAAAMMDD (ej. 20261001), o '' si no hay fecha. */
function fechaPlano(texto) {
  const d = leerFecha(texto);
  if (!d) return '';
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}

/**
 * Datos de UNA incapacidad para el plano.
 * Devuelve { fila (28 valores, en el orden de COLUMNAS_PLANO), faltan: [lo que falta], cadena }.
 * Si falta algo obligatorio, la fila no se incluye en el archivo hasta que se complete en la ficha.
 */
function datosPlano(exp, ctx, idPropio) {
  const tipo = tipoPorCodigo(exp.codigoTipo) || {};
  const faltan = [];
  const esAccidente = exp.codigoTipo === '019';
  const esProrroga = !!exp.prorroga && !tipo.esLicencia;
  // Número de prórroga = Consec. TNL de la incapacidad anterior (el mismo de la ficha).
  // Como el plano se carga directo al ERP, solo vale si la gestora lo CONFIRMÓ, eligió o escribió
  // en la ficha ("¿De cuál incapacidad viene?"). Un consecutivo solo sugerido por el panel no entra.
  const cadena = esProrroga ? cadenaDeIncapacidad(exp, ctx, idPropio) : null;
  const sinConfirmar = !!(cadena && cadena.sugerida && cadena.consec);
  const consecAnterior = esProrroga && !sinConfirmar ? String((cadena && cadena.consec) || (exp.erp || {}).consecAnterior || '') : '';

  if (!exp.cedula) faltan.push('cédula');
  if (!fechaPlano(exp.fechaInicial)) faltan.push('fecha inicial');
  if (!(Number(exp.dias) >= 1)) faltan.push('días');
  if (!fechaPlano(exp.fechaFinal)) faltan.push('fecha final');
  if (!exp.diagnostico) faltan.push('diagnóstico');
  if (!tipo.clasePlano) faltan.push('clase de incapacidad');
  if (esAccidente && !fechaPlano(exp.fechaAccidente)) faltan.push('fecha del accidente');
  if (esProrroga && sinConfirmar) faltan.push(`confirmar el Consec. TNL anterior (sugerido: ${cadena.consec})`);
  else if (esProrroga && !consecAnterior) faltan.push('Consec. TNL anterior');

  // La cédula va como número (así viene en el formato), salvo que empiece por 0
  const cedula = /^[1-9]\d*$/.test(String(exp.cedula || '')) ? Number(exp.cedula) : String(exp.cedula || '');
  const fila = [
    CONFIG.plano.empresa,                              // A  EMPRESA
    '',                                               // B  consecutivo del plano
    cedula,                                           // C  código del empleado
    '', '',                                           // D  contrato · E consecutivo TNL (los pone el ERP)
    exp.codigoTipo,                                   // F  concepto (texto: "018")
    fechaPlano(exp.fechaInicial),                     // G  fecha inicial
    Number(exp.dias) || '',                           // H  días
    fechaPlano(exp.fechaFinal),                       // I  fecha final
    0,                                                // J  valor de liquidación
    '',                                               // K  observación
    0,                                                // L  valor base de liquidación
    '', '',                                           // M  serie · N número de incapacidad
    (exp.diagnostico || '').toUpperCase(),            // O  diagnóstico
    tipo.clasePlano || '',                            // P  clase de incapacidad
    esAccidente ? fechaPlano(exp.fechaAccidente) : '',// Q  fecha del accidente (solo 019)
    esProrroga && /^\d+$/.test(consecAnterior) ? Number(consecAnterior) : consecAnterior, // R  número de prórroga
    0,                                                // S  ingreso base de cotización
    esProrroga ? 1 : 0,                               // T  indicador de prórroga
    '', '',                                           // U  horas · V fecha de expedición
    0, 0, 0,                                          // W  valor empresa 1 · X valor empresa 2 · Y meses promedio
    '', '', '',                                       // Z  hora inicial · AA hora final · AB EPS/ARL
  ];
  return { fila, faltan, consecAnterior, sugeridoSinConfirmar: sinConfirmar ? String(cadena.consec) : '' };
}

/**
 * Arma el Excel del plano con las filas dadas. Devuelve una promesa con el archivo (Blob).
 * Se arma "a mano" con JSZip (un .xlsx es un ZIP con archivos XML) para que salga
 * igual al formato del ERP: títulos con sus colores, columnas anchas, título fijo
 * arriba y el concepto como TEXTO ("018", sin perder el 0). Los números van como número.
 */
async function archivoPlano(filas) {
  const xml = (v) => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const letra = (i) => (i < 26 ? '' : String.fromCharCode(64 + Math.floor(i / 26))) + String.fromCharCode(65 + (i % 26));
  // Textos compartidos (así los guarda Excel)
  const textos = [], posicion = new Map();
  const texto = (v) => { if (!posicion.has(v)) { posicion.set(v, textos.length); textos.push(v); } return posicion.get(v); };
  // Estilos: 0 normal · 1 a 5 títulos (amarillo, azul, verde, rojo, blanco) · 6 texto (@)
  const ESTILO_TITULO = { O: 1, C: 2, A: 3, P: 4, '-': 5 };
  const celda = (v, ref, estilo = 0) => {
    if (v === '' || v === null || v === undefined) return estilo ? `<c r="${ref}" s="${estilo}"/>` : '';
    if (typeof v === 'number') return `<c r="${ref}"${estilo ? ` s="${estilo}"` : ''}><v>${v}</v></c>`;
    return `<c r="${ref}" s="${estilo}" t="s"><v>${texto(String(v))}</v></c>`;
  };
  const filasXml = [
    `<row r="1" ht="150" customHeight="1">${COLUMNAS_PLANO.map((titulo, j) => celda(titulo, `${letra(j)}1`, ESTILO_TITULO[COLORES_PLANO[j]])).join('')}</row>`,
    ...filas.map((fila, i) => `<row r="${i + 2}">${fila.map((v, j) => celda(j === 5 ? String(v) : v, `${letra(j)}${i + 2}`, j === 5 ? 6 : 0)).join('')}</row>`),
  ];
  const hoja = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<dimension ref="A1:${letra(COLUMNAS_PLANO.length - 1)}${filas.length + 1}"/>
<sheetViews><sheetView tabSelected="1" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
<sheetFormatPr defaultRowHeight="15"/>
<cols><col min="1" max="${COLUMNAS_PLANO.length}" width="20" customWidth="1"/></cols>
<sheetData>${filasXml.join('')}</sheetData>
</worksheet>`;
  const relleno = (argb) => `<fill><patternFill patternType="solid"><fgColor rgb="${argb}"/><bgColor indexed="64"/></patternFill></fill>`;
  const titulo = (fill) => `<xf numFmtId="0" fontId="1" fillId="${fill}" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>`;
  const estilos = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="2"><font><sz val="11"/><name val="Calibri"/><family val="2"/></font><font><b/><sz val="10"/><name val="Calibri"/><family val="2"/></font></fonts>
<fills count="7"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>${['O', 'C', 'A', 'P', '-'].map((k) => relleno(COLOR_TITULO[k])).join('')}</fills>
<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color auto="1"/></left><right style="thin"><color auto="1"/></right><top style="thin"><color auto="1"/></top><bottom style="thin"><color auto="1"/></bottom><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="7"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>${[2, 3, 4, 5, 6].map(titulo).join('')}<xf numFmtId="49" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`;
  const compartidos = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="${textos.length}" uniqueCount="${textos.length}">${textos.map((v) => `<si><t xml:space="preserve">${xml(v)}</t></si>`).join('')}</sst>`;

  const zip = new JSZip();
  zip.file('[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/></Types>`);
  zip.file('_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`);
  zip.file('xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xml(CONFIG.plano.hoja || 'DATOS')}" sheetId="1" r:id="rId1"/></sheets></workbook>`);
  zip.file('xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/></Relationships>`);
  zip.file('xl/worksheets/sheet1.xml', hoja);
  zip.file('xl/styles.xml', estilos);
  zip.file('xl/sharedStrings.xml', compartidos);
  return zip.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

/* ==========================================================================
   8. CARPETA DE EJEMPLO (en memoria)
   Imita una carpeta del computador con las mismas funciones. Sirve para
   conocer el panel y para probarlo con datos difíciles. No toca el computador.
   TODOS los nombres, cédulas y diagnósticos son inventados.
   ========================================================================== */
function errorNoExiste(nombre) { return new DOMException(`No existe: ${nombre}`, 'NotFoundError'); }

class ArchivoMemoria {
  constructor(name, blob, fecha) { this.kind = 'file'; this.name = name; this.blob = blob; this.fecha = fecha || Date.now(); }
  async getFile() { return new File([this.blob], this.name, { lastModified: this.fecha }); }
  async createWritable() {
    const partes = [];
    return { write: async (d) => { partes.push(d); }, close: async () => { this.blob = new Blob(partes); this.fecha = Date.now(); } };
  }
}
class CarpetaMemoria {
  constructor(name) { this.kind = 'directory'; this.name = name; this.hijos = new Map(); }
  async getDirectoryHandle(n, op = {}) {
    const h = this.hijos.get(n);
    if (h && h.kind === 'directory') return h;
    if (!op.create) throw errorNoExiste(n);
    const nueva = new CarpetaMemoria(n); this.hijos.set(n, nueva); return nueva;
  }
  async getFileHandle(n, op = {}) {
    const h = this.hijos.get(n);
    if (h && h.kind === 'file') return h;
    if (!op.create) throw errorNoExiste(n);
    const nuevo = new ArchivoMemoria(n, new Blob([])); this.hijos.set(n, nuevo); return nuevo;
  }
  async removeEntry(n) { if (!this.hijos.delete(n)) throw errorNoExiste(n); }
  async *entries() { for (const par of [...this.hijos.entries()]) yield par; }
  async queryPermission() { return 'granted'; }
  async requestPermission() { return 'granted'; }
  poner(nombre, blob, fecha) { this.hijos.set(nombre, new ArchivoMemoria(nombre, blob, fecha)); }
}

/** PDF mínimo de una página con un título (para los datos de ejemplo). */
function pdfDeEjemplo(titulo, detalle = 'Documento de ejemplo - datos inventados') {
  const limpiar = (t) => textoParaArchivo(t, 70).replace(/_/g, ' ');
  const flujo = `BT /F1 24 Tf 72 700 Td (${limpiar(titulo)}) Tj ET BT /F1 12 Tf 72 670 Td (${limpiar(detalle)}) Tj ET`;
  const objetos = [
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>',
    `<< /Length ${flujo.length} >>\nstream\n${flujo}\nendstream`,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
  ];
  let pdf = '%PDF-1.4\n';
  const posiciones = [];
  objetos.forEach((o, i) => { posiciones.push(pdf.length); pdf += `${i + 1} 0 obj\n${o}\nendobj\n`; });
  const xref = pdf.length;
  pdf += `xref\n0 ${objetos.length + 1}\n0000000000 65535 f \n`;
  posiciones.forEach((p) => { pdf += `${String(p).padStart(10, '0')} 00000 n \n`; });
  pdf += `trailer\n<< /Size ${objetos.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return new Blob([pdf], { type: 'application/pdf' });
}

/**
 * Arma un ZIP igual al de la app del colaborador.
 * c = { cedula, nombre, celular, sede, tipo, ini (días antes de hoy), dias, diagnostico,
 *       prorroga, finAnterior (fecha), transito, accidente, docs (si no, los requeridos),
 *       faltante (en la lista pero no en el ZIP), fotosMalas, conClave, version (cambia el PDF),
 *       finalMala, sinJson, jsonRoto, hojaDeVida }
 */
async function zipDeEjemplo(c) {
  const zip = new JSZip();
  const fechaInicial = c.fechaInicial || sumarDias(hoyTexto(), -(c.ini || 0));
  const datos = { codigoTipo: c.tipo, accidenteTransito: !!c.transito, dias: c.dias };   // con 1 o 2 días no lleva historia
  const docs = c.docs || documentosRequeridos(datos);
  const lista = docs.map((id) => {
    const doc = documentoPorId(id);
    const nombre = `${c.cedula}_${c.tipo}_${doc.codigo}_${textoParaArchivo(id)}.pdf`;
    if (c.faltante !== id) zip.file(nombre, pdfDeEjemplo(`${doc.nombre} ${c.nombre}`, `Ejemplo ${(c.version || {})[id] || 'version 1'} - datos inventados`));
    const fotos = c.fotosMalas === id;
    return { documento: id, archivo: nombre, origen: fotos ? 'fotos' : 'pdf', paginas: fotos ? 3 : 1, comprimido: fotos,
             claveQuitada: c.conClave === id, fotosConAdvertencia: fotos ? 2 : 0 };
  });
  if (c.hojaDeVida) zip.file('datos_candidato.json', JSON.stringify({ cedula: c.cedula, nombre: c.nombre }));
  else if (!c.sinJson) {
    const fechaFinal = calcularFechaFinal(fechaInicial, c.dias);
    zip.file('datos_incapacidad.json', c.jsonRoto ? '{"cedula": "114' : JSON.stringify({
      version: 1, tipo: 'incapacidad', cedula: c.cedula, nombre: c.nombre, celular: c.celular === undefined ? '3001234567' : c.celular,
      sede: c.sede || 'CAÑAVERAL CENTRO', codigoTipo: c.tipo, nombreTipo: nombreTipo(c.tipo),
      accidenteTransito: !!c.transito, fechaAccidente: c.tipo === '019' ? sumarDias(fechaInicial, -(c.accidente || 0)) : null,
      fechaInicial, dias: c.dias, fechaFinal: c.finalMala ? sumarDias(fechaFinal, 2) : fechaFinal,
      diagnostico: c.diagnostico, prorroga: tipoPorCodigo(c.tipo) && tipoPorCodigo(c.tipo).esLicencia ? null : !!c.prorroga,
      fechaFinalAnterior: c.prorroga ? c.finAnterior : null,
      autorizacionDatos: { aceptada: true, fecha: new Date().toISOString() },
      generado: new Date().toISOString(), archivos: lista,
    }, null, 2));
  }
  return zip.generateAsync({ type: 'blob', compression: 'STORE' });
}

/**
 * Reporte de TNL de ejemplo, con las MISMAS columnas del reporte real del ERP.
 * filas = [cedula, nombre, contrato, consec, concepto, iniciaHaceDias, dias, consecAnterior|null, estado?]
 * opciones: { titulosEn (fila de títulos, por defecto 0), fechasTexto, diasConComa }
 */
function reporteDeEjemplo(filas, opciones = {}) {
  const DESCRIPCION = { '018': 'INCAPACIDAD POR ENFERMEDAD GENERAL', '019': 'INCAPACIDAD POR ACCIDENTE DE TRABAJO', '020': 'LICENCIA POR MATERNIDAD', '021': 'LICENCIA POR PATERNIDAD', '028': 'VACACIONES', '045': 'PERMISO PERSONAL REMUNERADO' };
  const CLASE = { '018': 'Enfermedad general', '019': 'Accidente de trabajo', '020': 'Maternidad/Paternidad', '021': 'Maternidad/Paternidad' };
  const serial = (t) => { const d = leerFecha(t); return (Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(1899, 11, 30)) / MS_POR_DIA; };
  const fecha = (t) => (opciones.fechasTexto ? fechaERP(t) : serial(t));
  const tabla = [];
  for (let i = 0; i < (opciones.titulosEn || 0); i++) tabla.push(i === 0 ? ['REPORTE DE TIEMPOS NO LABORADOS'] : []);
  tabla.push(['Cédula', 'Nombres y apellidos', 'Contrato', 'Consec.TNL', 'Estado TNL', 'Concepto', 'Desc.Concepto', 'Fecha Inicial', 'Fecha Final', 'Nro.Dias', 'Clase de incapacidad', 'Es prorroga', 'Consec.TNL Anterior']);
  filas.forEach(([cedula, nombre, contrato, consec, concepto, hace, dias, anterior, estado]) => {
    const ini = sumarDias(hoyTexto(), -hace);
    tabla.push([cedula, nombre, contrato, consec, estado || 'Amortizado', concepto, DESCRIPCION[concepto] || '', fecha(ini), fecha(calcularFechaFinal(ini, dias)),
      opciones.diasConComa ? `${dias},00` : `${dias}.00`, CLASE[concepto] || 'No aplica', anterior ? 'Si' : 'No', anterior || '']);
  });
  const libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, XLSX.utils.aoa_to_sheet(tabla), 'B_INCAPACIDADES');
  return new Blob([XLSX.write(libro, { type: 'array', bookType: 'xlsx' })], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

/**
 * Maestro de personal de ejemplo. filas = [cedula, nombre, eps, arl].
 * opciones.raro → títulos con otros nombres y filas de título arriba (para probar que se encuentran igual).

  const tabla = opciones.raro
    ? [['MAESTRO DE PERSONAL ACTIVO'], [], ['Nro. Identificación', 'Nombre completo', 'Cargo', 'Entidad Promotora de Salud', 'Administradora de Riesgos Laborales']]
    : [['Tipo identificación', 'Empleado', 'Nombres', 'Apellido 2', 'Apellido 1', 'Descripcion del cargo', 'Email del contacto', 'Telefono del contacto',
        'Descripcion C.O.', 'Id eps', 'Descripcion eps', 'Id ARL', 'Descripcion ARL', 'Id pension', 'Descripcion entidad pension', 'Fecha retiro']];
  filas.forEach(([cedula, nombre, eps, arl], n) => {
    const [apellido1 = '', apellido2 = '', ...nombres] = nombre.split(' ');
    tabla.push(opciones.raro ? [cedula, nombre, 'AUXILIAR', eps, arl]

         'SEDE ADMINISTRATIVA', '900000000', eps, '890903790', arl, '800224808', 'PORVENIR', '']);
  });
  const libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, XLSX.utils.aoa_to_sheet(tabla), 'Maestro');
  return new Blob([XLSX.write(libro, { type: 'array', bookType: 'xlsx' })], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

/** Crea la carpeta de ejemplo según el modo: normal, peor, vacio, uno. */
async function crearCarpetaDeEjemplo(modo) {
  const raiz = new CarpetaMemoria('Incapacidades (ejemplo)');
  await prepararEstructura(raiz);
  if (modo === 'vacio') return raiz;

  const carpetaAlertas = await subcarpeta(raiz, C.alertas);
  const idLarga = idAlerta(`${larga}|${sumarDias(hoyTexto(), -175)}`, 'a150');
  (await subcarpeta(carpetaAlertas, C.alertasErrores)).poner(`${idLarga}.json`, new Blob([JSON.stringify({ id: idLarga, tipo: 'a150', estado: 'error', error: 'Send an email (V2): The specified object was not found in the store., The process failed to get the correct properties.' })]), hace(0, 3));
  (await subcarpeta(carpetaAlertas, C.alertasPendientes)).poner('archivo_raro.json', new Blob(['{ esto no es json']), hace(1));
  (await subcarpeta(raiz, C.fuentes)).poner('reporte tnl (3).xlsx', reporteDeEjemplo(filasPeor, { titulosEn: 2, fechasTexto: true, diasConComa: true }), hace(0, 1));
  // Maestro viejo (12 días: el panel debe pedir que lo actualicen), con títulos raros, una EPS de nombre
  // larguísimo, una cédula sin EPS y otras que no están en el maestro.
  (await subcarpeta(raiz, C.fuentes)).poner('MAESTRO ACTIVOS (copia).xlsx', maestroDeEjemplo([
    [String(1000000000 + 4 * 7919), 'PERSONA 4', 'ENTIDAD PROMOTORA DE SALUD SANITAS S.A.S. - REGIMEN CONTRIBUTIVO SUCURSAL VALLE DEL CAUCA', 'POSITIVA COMPAÑIA DE SEGUROS'],
    [String(1000000000 + 10 * 7919), 'PERSONA 10', 'EPS SURA', 'ARL SURA'],
    [String(1000000000 + 16 * 7919), 'PERSONA 16', '', ''],
    [String(1000000000 + 22 * 7919), 'PERSONA 22', 'COOMEVA', ''],
  ], { raro: true }), hace(12));
  raiz.poner('1400000003_019_en_la_raiz.zip', await zipDeEjemplo({ cedula: '1400000003', nombre: 'Lina Marcela Gil', tipo: '019', ini: 1, dias: 8, accidente: 1, diagnostico: 'S620' }), hace(0, 8));
  return raiz;
}

/* ---------- Arranque: elegir carpeta y escribir quién usa el panel ---------- */
function PantallaArranque({ onCarpeta, onEjemplo, carpetaRecordada, onReabrir, error }) {
  const [usuario, setUsuario] = useState('');
  const [ocupado, setOcupado] = useState(false);
  useEffect(() => { recuperar('usuario').then((u) => u && setUsuario(u)); }, []);

  async function elegir() {
    if (!usuario.trim()) return;
    setOcupado(true);
    try {
      const carpeta = await window.showDirectoryPicker({ id: 'incapacidades', mode: 'readwrite' });
      await onCarpeta(carpeta, usuario.trim());
    } catch (e) {
      if (e.name !== 'AbortError') onCarpeta(null, usuario.trim(), e);
    } finally { setOcupado(false); }
  }

  return (
    <main className="inicio">
      <section className="portada">
        <img className="logo" src={LOGO} alt="Supertiendas Cañaveral" />
        <h1>Panel de incapacidades</h1>
        <p>Aquí llegan las incapacidades que envían los colaboradores. Revisas los documentos, apruebas y copias los datos para el ERP.</p>
      </section>

      {carpetaRecordada ? (
        <section className="grupo">
          <h3 className="grupo-titulo">Seguir donde ibas</h3>
          <button className="boton boton-principal boton-grande" onClick={onReabrir}>
            <Icono nombre="carpeta" /> Abrir “{carpetaRecordada}”
          </button>
          <p className="grupo-pie">Por seguridad, el navegador pide permiso cada vez que se abre el panel.</p>
          <div style={{ textAlign: 'center', marginTop: 10 }}>
            <button className="boton boton-texto" onClick={() => onReabrir('otra')}>Usar otra carpeta</button>
          </div>
        </section>
      ) : (
        <>
          <section className="grupo">
            <h3 className="grupo-titulo">Para empezar</h3>
            <ol className="pasos-arranque tarjeta">
              <li><span aria-hidden="true" /><span>Abre la carpeta <strong>Incapacidades</strong> de OneDrive en este computador y verifica que esté sincronizada.</span></li>
              <li><span aria-hidden="true" /><span>Escribe tu nombre: queda en la bitácora de cada cosa que hagas.</span></li>
              <li><span aria-hidden="true" /><span>Toca <strong>Elegir carpeta</strong>, busca “Incapacidades” y acepta el permiso para ver y editar.</span></li>
            </ol>
          </section>
          <section className="grupo">
            <h3 className="grupo-titulo">Quién usa el panel</h3>
            <div className="tarjeta fila-campo">
              <label htmlFor="usuario">Tu nombre</label>
              <input id="usuario" value={usuario} maxLength={60} autoComplete="name" onChange={(e) => setUsuario(e.target.value)} placeholder="Ej. Natalia Restrepo" />
            </div>
          </section>
          {puedeAbrirCarpetas ? (
            <button className="boton boton-principal boton-grande" disabled={!usuario.trim() || ocupado} onClick={elegir}>
              <Icono nombre="carpeta" /> Elegir carpeta
            </button>
          ) : (
            <div className="alerta aviso">Este navegador no puede abrir carpetas. Abre el panel en <strong>Chrome</strong> o <strong>Edge</strong> desde un computador.</div>
          )}
        </>
      )}
      {error && <div className="alerta error">{error}</div>}
      <p className="nota">
        ¿Solo quieres conocerlo?{' '}
        <button className="boton boton-texto" style={{ padding: 0, minHeight: 0, fontSize: 13 }} onClick={() => onEjemplo(usuario.trim() || 'Gestora de ejemplo')}>
          Abrir carpeta de ejemplo
        </button>{' '}(datos inventados, no toca tu computador).
      </p>

      <section className="grupo" style={{ marginTop: 32 }}>
        <h3 className="grupo-titulo">Carpetas que usa el panel</h3>
        <div className="tarjeta">
          <div className="arbol-fila"><Icono nombre="carpeta" /> Incapacidades</div>
          <div className="arbol-fila sangria"><Icono nombre="bandeja" /> Recibidos <small>los ZIP que envían los colaboradores</small></div>
          <div className="arbol-fila sangria"><Icono nombre="lista" /> Colaboradores <small>una carpeta por cédula y otra por incapacidad</small></div>
          <div className="arbol-fila sangria"><Icono nombre="base" /> Fuentes <small>el reporte de TNL que exportas del ERP</small></div>
          <div className="arbol-fila sangria"><Icono nombre="reloj" /> Alertas <small>Pendientes, Enviadas y Errores (las lee Power Automate)</small></div>
        </div>
      </section>
    </main>
  );
}

/* ---------- Bandeja de entrada ---------- */
function Bandeja({ items, cargando, onRecargar, onProcesar, onProcesarTodos, procesando, lote, onAgregar }) {
  const listos = items.filter((x) => x.analisis && x.analisis.tipo !== 'invalido');
  const selector = useRef(null);
  const [encima, setEncima] = useState(false);
  const alArrastrar = (e) => { e.preventDefault(); setEncima(true); };
  const alSalir = (e) => { if (!e.currentTarget.contains(e.relatedTarget)) setEncima(false); };
  const alSoltar = (e) => { e.preventDefault(); setEncima(false); onAgregar([...e.dataTransfer.files]); };
  return (
    <div onDragOver={alArrastrar} onDragLeave={alSalir} onDrop={alSoltar} className={encima ? 'zona-soltar activa' : 'zona-soltar'}>
      <input ref={selector} type="file" accept=".zip,application/zip" multiple hidden onChange={(e) => { onAgregar([...e.target.files]); e.target.value = ''; }} />
      <header className="encabezado">
        <div>
          <h1>Bandeja</h1>
          <p>{cargando ? 'Revisando lo que llegó…'
            : items.length ? `${plural(items.length, 'archivo', 'archivos')} sin procesar; ${plural(listos.length, 'listo', 'listos')} para pasar a revisión.`
            : 'No hay nada nuevo.'}</p>
        </div>
        <div className="acciones">
          <button className="boton boton-secundario" onClick={onRecargar} disabled={cargando || procesando}><Icono nombre="recargar" tamano={18} /> Actualizar</button>
          <button className="boton boton-secundario" onClick={() => selector.current.click()} disabled={procesando}><Icono nombre="subir" tamano={18} /> Agregar ZIP</button>
          <button className="boton boton-principal" onClick={onProcesarTodos} disabled={!listos.length || procesando || cargando}>
            <Icono nombre="paquete" tamano={18} /> Pasar {listos.length > 1 ? `las ${listos.length}` : ''} a revisión
          </button>
        </div>
      </header>
      {lote && (
        <div className="alerta aviso" style={{ marginBottom: 14 }} role="status">
          Procesando {lote.hechos + 1} de {lote.total}…
          <div className="progreso-lote"><div style={{ width: `${(lote.hechos / lote.total) * 100}%` }} /></div>
        </div>
      )}
      <div className="tarjeta">
        {cargando && !items.length ? (
          <div className="vacio"><Icono nombre="cargando" /><p>Leyendo archivos…</p></div>
        ) : !items.length ? (
          <div className="vacio">
            <div className="icono-caja"><Icono nombre="listo" tamano={28} /></div>
            <h3>No hay incapacidades nuevas</h3>
            <p>Cuando un colaborador envíe su ZIP con el link de OneDrive, aparecerá aquí (OneDrive puede tardar unos minutos: toca Actualizar). Si te la mandaron por otro medio, toca <strong>Agregar ZIP</strong> o arrástrala aquí.</p>
          </div>
        ) : items.map((item) => <FilaBandeja key={item.id} item={item} onProcesar={onProcesar} procesando={procesando} />)}
      </div>
      {encima && <div className="aviso-soltar">Suelta el ZIP para agregarlo a Recibidos</div>}
    </div>
  );
}

/* ---------- Listado de incapacidades ---------- */
function Incapacidades({ lista, modo, cargando, onAbrir, onRecargar }) {
  const [busqueda, setBusqueda] = useState('');
  const [filtroEstado, setFiltroEstado] = useState('todos');
  const [filtroTipo, setFiltroTipo] = useState('todos');
  const enRevision = (e) => ['recibida', 'revision', 'correccion'].includes(e.estado);

  const visibles = useMemo(() => {
    const q = paraBuscar(busqueda.trim());
    return lista
      .filter((x) => {
        const e = x.expediente;
        if (modo === 'revisar' && !(e ? enRevision(e) : true)) return false;
        if (modo === 'todas' && filtroEstado !== 'todos' && (!e || e.estado !== filtroEstado)) return false;
        if (filtroTipo !== 'todos' && (!e || e.codigoTipo !== filtroTipo)) return false;
        if (!q) return true;
        return paraBuscar(`${x.nombre} ${x.cedula} ${e ? `${e.diagnostico} ${e.sede}` : ''}`).includes(q);
      })
      .sort((a, b) => {
        const grupo = (x) => !x.expediente ? 2 : ESTADOS_CERRADOS.includes(x.expediente.estado) ? 1 : 0;
        const fecha = (x) => x.expediente ? new Date(x.expediente.creado).getTime() : 0;
        return grupo(a) - grupo(b) || (modo === 'todas' && grupo(a) === 1 ? fecha(b) - fecha(a) : fecha(a) - fecha(b));
      });
  }, [lista, busqueda, filtroEstado, filtroTipo, modo]);

  const cuenta = (id) => lista.filter((x) => x.expediente && x.expediente.estado === id).length;
  const titulo = modo === 'revisar' ? 'Por revisar' : 'Todas las incapacidades';
  const texto = modo === 'revisar'
    ? 'Recibidas, en revisión y con corrección. Las que llevan más días esperando aparecen primero.'
    : `${plural(lista.length, 'incapacidad', 'incapacidades')} en la carpeta.`;

  return (
    <>
      <header className="encabezado">
        <div><h1>{titulo}</h1><p>{texto}</p></div>
        <button className="boton boton-secundario" onClick={onRecargar} disabled={cargando}><Icono nombre="recargar" tamano={18} /> Actualizar</button>
      </header>
      <div className="filtros">
        <input className="buscador" type="search" value={busqueda} onChange={(e) => setBusqueda(e.target.value)} placeholder="Buscar por nombre, cédula, diagnóstico o sede" aria-label="Buscar incapacidad" />
        {modo === 'todas' && (
          <select className="selector" value={filtroEstado} onChange={(e) => setFiltroEstado(e.target.value)} aria-label="Filtrar por estado">
            <option value="todos">Todos los estados ({lista.length})</option>
            {CONFIG.estados.map((e) => <option key={e.id} value={e.id}>{e.nombre} ({cuenta(e.id)})</option>)}
          </select>
        )}
        <select className="selector" value={filtroTipo} onChange={(e) => setFiltroTipo(e.target.value)} aria-label="Filtrar por tipo">
          <option value="todos">Todos los tipos</option>
          {CONFIG.tipos.map((t) => <option key={t.codigo} value={t.codigo}>{t.codigo} {t.nombre}</option>)}
        </select>
      </div>
      {visibles.length > 0 && (
        <div className="inc-cabecera" aria-hidden="true">
          <span>Colaborador</span><span>Incapacidad</span><span>Estado</span><span>Documentos</span><span style={{ textAlign: 'right' }}>Esperando</span>
        </div>
      )}
      <div className="tarjeta">
        {!visibles.length ? (
          <div className="vacio">
            <div className="icono-caja"><Icono nombre={lista.length ? 'lista' : 'listo'} tamano={28} /></div>
            <h3>{modo === 'revisar' && lista.length ? 'No hay nada por revisar' : lista.length ? 'Ninguna coincide' : 'Aún no hay incapacidades'}</h3>
            <p>{modo === 'revisar' && lista.length && !busqueda && filtroTipo === 'todos' ? 'Todo lo recibido ya está aprobado o cerrado. Mira “Para el ERP”.' : lista.length ? 'Prueba con otra búsqueda o cambia el filtro.' : 'Pasa a revisión un ZIP de la bandeja y aparecerá aquí.'}</p>
          </div>
        ) : visibles.map((x) => <FilaIncapacidad key={x.id} x={x} onAbrir={onAbrir} />)}
      </div>
    </>
  );
}

function FilaIncapacidad({ x, onAbrir }) {
  const e = x.expediente;
  const res = e ? resumenDocumentos(e) : null;
  const dias = e ? diasDesde(e.creado) : 0;
  const cerrada = e && ESTADOS_CERRADOS.includes(e.estado);
  return (
    <div className="inc fila-tocable" role="button" tabIndex={0} onClick={() => onAbrir(x)}
         onKeyDown={(ev) => (ev.key === 'Enter' || ev.key === ' ') && (ev.preventDefault(), onAbrir(x))}>
      <div className="fila-texto">
        <span className="fila-titulo">{nombreBonito(x.nombre)}</span>
        <span className="fila-sub numeros">C.C. {x.cedula || '—'}</span>
      </div>
      <div className="fila-texto c-cargo">
        {e ? <>
          <span className="fila-sub" style={{ color: 'var(--texto)' }}>{e.codigoTipo} {nombreTipo(e.codigoTipo)}{e.prorroga ? ' — prórroga' : ''}</span>
          <span className="fila-pista numeros">{rangoFechas(e.fechaInicial, e.fechaFinal)} — {plural(e.dias, 'día', 'días')}</span>
        </> : <span className="mensaje error">{x.problema}</span>}
      </div>
      <div className="c-estado">{e && <span className={`etiqueta-estado e-${e.estado}`}>{nombreEstado(e.estado)}</span>}</div>
      <div className="c-avance">
        {e && <>
          <div className="cana" aria-hidden="true">{res.docs.map((d) => <span key={d.id} className={`nudo ${d.estado === 'aprobado' ? 'aprobado' : d.estado === 'pendiente' ? 'recibido' : 'rechazado'}`} />)}</div>
          <div className="avance-texto">{res.aprobados} de {res.total} aprobados</div>
        </>}
      </div>
      <div className={`cand-dias c-dias ${!cerrada && dias >= CONFIG.diasAlerta ? 'viejo' : ''}`}>
        {e && !cerrada && <><strong>{dias === 0 ? 'Hoy' : dias.toLocaleString('es-CO')}</strong><span>{dias === 0 ? 'llegó' : dias === 1 ? 'día' : 'días'}</span></>}
      </div>
    </div>
  );
}

/* ---------- Para el ERP: las aprobadas que faltan por registrar → plano ---------- */
function ParaERP({ lista, ctx, onAbrir, avisar }) {
  const aprobadas = lista.filter((x) => x.expediente && x.expediente.estado === 'aprobada')
    .sort((a, b) => (a.expediente.fechaInicial || '').localeCompare(b.expediente.fechaInicial || ''));
  // Datos del plano de cada una (y lo que le falta)
  const planos = aprobadas.map((x) => datosPlano(x.expediente, ctx, x.id));
  const completas = planos.filter((p) => !p.faltan.length);
  const incompletas = aprobadas.map((x, i) => ({ x, faltan: planos[i].faltan })).filter((s) => s.faltan.length);
  const sinDato = (v) => (v === '' || v === null || v === undefined);
  const fechaCelda = (n) => (n ? fechaERP(`${String(n).slice(0, 4)}-${String(n).slice(4, 6)}-${String(n).slice(6, 8)}`) : '');

  async function descargarPlano() {
    if (!completas.length) { avisar('Ninguna está completa: ábrelas y completa lo que falta.', 'error'); return; }
    let archivo;
    try { archivo = await archivoPlano(completas.map((p) => p.fila)); } catch { avisar('No se pudo armar el plano. Intenta de nuevo.', 'error'); return; }
    const url = URL.createObjectURL(archivo);
    const a = document.createElement('a'); a.href = url; a.download = `Plano_incapacidades_${hoyTexto()}.xlsx`; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    avisar(incompletas.length
      ? `Plano descargado con ${plural(completas.length, 'fila', 'filas')}. Quedaron por fuera ${plural(incompletas.length, 'incapacidad incompleta', 'incapacidades incompletas')}.`
      : `Plano descargado con ${plural(completas.length, 'fila', 'filas')}. Cárgalo en el ERP y luego márcalas "registradas".`, 'ok');
  }

  return (
    <>
      <header className="encabezado">
        <div>
          <h1>Para el ERP</h1>
          <p>{aprobadas.length ? `${plural(aprobadas.length, 'incapacidad aprobada', 'incapacidades aprobadas')} sin registrar. Descarga el plano y cárgalo en el ERP, o ábrela para copiar dato por dato.` : 'No hay incapacidades aprobadas pendientes de registrar.'}</p>
        </div>
        <div className="acciones">
          <button className="boton boton-principal" disabled={!completas.length} onClick={descargarPlano}><Icono nombre="bajar" tamano={18} /> Descargar plano (Excel)</button>
        </div>
      </header>
      <div className="alerta info-plano">
        <strong>Plano del ERP</strong> (28 columnas, igual al formato de carga):
        <ul className="leyenda-plano">
          <li><span className="muestra" style={{ background: '#FFFF00' }} /> Obligatorias: se llenan con los datos de la incapacidad.</li>
          <li><span className="muestra" style={{ background: '#9BC2E6' }} /> Siempre en 0: el ERP calcula los valores al importar.</li>
          <li><span className="muestra" style={{ background: '#70AD47' }} /> Fecha del accidente: solo en accidente de trabajo (019).</li>
          <li><span className="muestra" style={{ background: '#FF7C80' }} /> Número de prórroga (Consec. TNL anterior): solo en prórrogas.</li>
        </ul>
        Si una fila dice <span className="falta">falta</span> o <span className="falta">sin confirmar</span>, esa incapacidad no entra al plano
        hasta que lo completes en su ficha. El Consec. TNL anterior que sugiere el panel hay que confirmarlo (botón “Confirmar”).
      </div>
      <div className="tarjeta tabla-caja">
        {!aprobadas.length ? (
          <div className="vacio"><div className="icono-caja"><Icono nombre="listo" tamano={28} /></div><h3>Todo registrado</h3><p>Cuando apruebes una incapacidad, aparecerá aquí.</p></div>
        ) : (
          <table className="tabla-erp">
            <thead><tr>{COLUMNAS_TABLA.map((c) => <th key={c} scope="col">{c}</th>)}</tr></thead>
            <tbody>
              {aprobadas.map((x, i) => {
                const e = x.expediente, p = planos[i], f = p.fila;
                const esAccidente = e.codigoTipo === '019', esProrroga = f[19] === 1;
                // Lo que se ve: cédula, nombre, concepto, fechas, días, diagnóstico, clase, accidente, prórroga, consecutivo anterior
                const celdas = [
                  f[2], (e.nombre || '').toUpperCase(), f[5], fechaCelda(f[6]), f[7], fechaCelda(f[8]), f[14], f[15],
                  esAccidente ? (fechaCelda(f[16]) || null) : '—',
                  esProrroga ? 'Sí' : 'No',
                  esProrroga ? (p.sugeridoSinConfirmar ? <span className="falta">{p.sugeridoSinConfirmar} sin confirmar</span> : sinDato(f[17]) ? null : f[17]) : '—',
                ];
                return (
                  <tr key={x.id} tabIndex={0} onClick={() => onAbrir(x)} onKeyDown={(ev) => ev.key === 'Enter' && onAbrir(x)}
                      title={p.faltan.length ? `Falta: ${p.faltan.join(', ')}` : ''}>
                    {celdas.map((v, j) => <td key={j} className={j === 1 ? 'texto' : ''}>{sinDato(v) ? <span className="falta">falta</span> : v}</td>)}
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>
      {incompletas.length > 0 && (
        <div className="alerta error" style={{ marginTop: 14 }}>
          <strong>No entran al plano todavía:</strong>{' '}
          {incompletas.map(({ x, faltan }) => `${nombreBonito(x.expediente.nombre || x.expediente.cedula)} (falta ${faltan.join(', ')})`).join(' · ')}.
          Ábrelas y completa el dato.
        </div>
      )}
    </>
  );
}

/* ---------- Radicación ante la EPS / ARL (después de registrar en el ERP) ---------- */
function Radicacion({ lista, maestro, usuario, avisar, onAbrir, onCambio }) {
  const [filtro, setFiltro] = useState('por_radicar');
  const R = CONFIG.radicacion;
  // Cada caso con su entidad (del maestro), plazo y etapa
  const casos = lista.filter((x) => x.expediente && etapaRadicacion(x.expediente)).map((x) => {
    const e = x.expediente, entidad = entidadDe(e, maestro);
    return { x, e, entidad, etapa: etapaRadicacion(e), plazo: plazoRadicacion(e, entidad), formatos: formatosDe(entidad) };
  });
  const de = (...etapas) => casos.filter((c) => etapas.includes(c.etapa));
  const porRadicar = de('por_radicar').sort((a, b) => a.plazo.limite.localeCompare(b.plazo.limite));
  const radicadas = de('radicada').sort((a, b) => (a.e.radicacion.fecha || '').localeCompare(b.e.radicacion.fecha || ''));
  const rechazadas = de('rechazada');
  const finalizadas = de('aprobada', 'nomina', 'no_se_radica');
  const paraNomina = de('nomina');
  const diasMaestro = diasDelMaestro(maestro);

  // Por radicar: agrupadas por entidad (EPS SURA, NUEVA EPS, ARL SURA…)
  const grupos = [];
  porRadicar.forEach((c) => {
    const nombre = textoEntidad(c.entidad);   // "EPS SURA"… o "EPS sin definir"
    let g = grupos.find((x) => x.nombre === nombre);
    if (!g) grupos.push(g = { nombre, casos: [], sinEntidad: !c.entidad.nombre });
    g.casos.push(c);
  });
  grupos.sort((a, b) => (a.sinEntidad - b.sinEntidad) || a.nombre.localeCompare(b.nombre));

  const visibles = filtro === 'radicadas' ? radicadas : filtro === 'rechazadas' ? rechazadas : filtro === 'finalizadas' ? finalizadas : null;
  const fila = (c) => <CasoRadicacion key={c.x.id} c={c} usuario={usuario} avisar={avisar} onAbrir={onAbrir} onCambio={onCambio} />;

  return (
    <>
      <header className="encabezado">
        <div>
          <h1>Radicación EPS / ARL</h1>
          <p>Las incapacidades ya registradas en el ERP. Descarga los adjuntos, radícalas en el portal de la EPS (o de la ARL si es accidente de trabajo) y anota el número de radicado y la respuesta.</p>
        </div>
        {filtro === 'finalizadas' && (
          <div className="acciones">
            <button className="boton boton-secundario" disabled={!paraNomina.length}
                    onClick={() => { descargarBlob(reporteNomina(paraNomina.map((c) => c.x), maestro), `Reporte_nomina_faltas_${hoyTexto()}.xlsx`); avisar('Reporte para nómina descargado'); }}>
              <Icono nombre="bajar" tamano={18} /> Reporte para nómina ({paraNomina.length})
            </button>
          </div>
        )}
      </header>

      {/* Estado del maestro: de ahí sale la EPS / ARL. Se actualiza cada viernes. */}
      {!maestro ? (
        <div className="alerta aviso rad-maestro"><strong>Falta el maestro de personal.</strong> Sin él no se sabe la EPS ni la ARL de cada colaborador. Exporta el maestro (Excel) y déjalo en la carpeta “{C.fuentes}”; luego toca “Recargar” en la Bandeja.</div>
      ) : diasMaestro > R.diasMaestroViejo ? (
        <div className="alerta aviso rad-maestro"><strong>El maestro tiene {plural(diasMaestro, 'día', 'días')}.</strong> Se actualiza cada viernes: exporta el nuevo y déjalo en “{C.fuentes}” para que las EPS estén al día. (Archivo: {maestro.archivo})</div>
      ) : (
        <div className="alerta info-plano rad-maestro">Maestro: <strong>{maestro.archivo}</strong> — {diasMaestro === 0 ? 'de hoy' : `hace ${plural(diasMaestro, 'día', 'días')}`}, {plural(maestro.total, 'colaborador', 'colaboradores')}.{maestro.avisos.map((a) => ` ${a}`)}</div>
      )}

      <div className="filtros">
        <div className="segmento segmento-filtro" role="group" aria-label="Filtrar radicación">
          {[['por_radicar', `Por radicar (${porRadicar.length})`], ['radicadas', `Esperando respuesta (${radicadas.length})`],
            ['rechazadas', `Rechazadas (${rechazadas.length})`], ['finalizadas', `Finalizadas (${finalizadas.length})`]].map(([id, texto]) => (
            <button key={id} aria-pressed={filtro === id} onClick={() => setFiltro(id)}>{texto}</button>
          ))}
        </div>
      </div>

      <div className="tarjeta">
        {filtro === 'por_radicar' ? (
          !grupos.length ? <VacioRadicacion texto="No hay incapacidades por radicar. Aparecen aquí cuando las marcas “registradas en el ERP”." />
          : grupos.map((g) => (
            <div key={g.nombre}>
              <div className="rad-grupo">
                <strong>{g.nombre}</strong>
                <span>{plural(g.casos.length, 'por radicar', 'por radicar')}{g.casos[0] ? ` · la primera vence el ${fechaLarga(g.casos[0].plazo.limite)}` : ''}</span>
                {g.sinEntidad && <span className="aviso-doc">No están en el maestro o no tienen {g.casos[0].entidad.tipo}: escríbela en cada una.</span>}
              </div>
              {g.casos.map(fila)}
            </div>
          ))
        ) : !visibles.length ? (
          <VacioRadicacion texto={filtro === 'radicadas' ? 'No hay radicados esperando respuesta.' : filtro === 'rechazadas' ? 'No hay rechazos pendientes.' : 'Aún no hay radicaciones finalizadas.'} />
        ) : visibles.map(fila)}
      </div>
    </>
  );
}

function VacioRadicacion({ texto }) {
  return <div className="vacio"><div className="icono-caja"><Icono nombre="listo" tamano={28} /></div><h3>Nada pendiente</h3><p>{texto}</p></div>;
}

/** Una incapacidad en la radicación: lo que pasa y el siguiente paso. */
function CasoRadicacion({ c, usuario, avisar, onAbrir, onCambio }) {
  const { x, e, entidad, etapa, plazo, formatos } = c;
  const r = e.radicacion || {};
  const R = CONFIG.radicacion;
  const hoy = hoyTexto();
  const [modo, setModo] = useState(null);          // null | 'radicar' | 'rechazo' | 'entidad' | 'editar'
  const [numero, setNumero] = useState('');
  const [fecha, setFecha] = useState(hoy);
  const [causa, setCausa] = useState('');
  const [nombreEntidad, setNombreEntidad] = useState('');
  const [ocupado, setOcupado] = useState(false);

  /** Guarda un cambio en la incapacidad y recarga la lista. */
  async function guardar(modificar, accion, textoOk) {
    setOcupado(true);
    try {
      await cambiarIncapacidad(x, usuario, modificar, accion);
      setModo(null); onCambio(); avisar(textoOk);
      return true;
    } catch (err) { avisar(err.message || 'No se pudo guardar', 'error'); return false; }
    finally { setOcupado(false); }
  }
  async function descargar(como) {
    setOcupado(true);
    try {
      const { blob, nombre } = await adjuntosParaRadicar(x, como);
      descargarBlob(blob, nombre);
      avisar(`Descargado ${nombre} (${tamanoLegible(blob.size)})`);
    } catch (err) { avisar(err.message || 'No se pudieron armar los adjuntos', 'error'); }
    finally { setOcupado(false); }
  }
  const nombreEnt = textoEntidad(entidad);
  // Celular para WhatsApp: el que escribió en la app o, si no hay, el del maestro (si es un celular de 10 dígitos)
  const delMaestro = entidad.maestro && /^3\d{9}$/.test(entidad.maestro.telefono || '') ? entidad.maestro.telefono : '';
  const celular = /^3\d{9}$/.test(String(e.celular || '')) ? e.celular : delMaestro;

  function radicar() {
    const n = numero.trim();
    if (!n) { avisar('Escribe el número de radicado que dio el portal', 'error'); return; }
    if (!leerFecha(fecha)) { avisar('Escribe una fecha válida', 'error'); return; }
    guardar((z) => { Object.assign(z.radicacion, { estado: 'radicada', numero: n, fecha, por: usuario }); },
            `Radicó ante ${nombreEnt} (radicado ${n})`, `Radicada: queda esperando respuesta de la ${entidad.tipo}`);
  }
  /** Corrige el número o la fecha del radicado (si se escribió mal), en cualquier etapa después de radicar. */
  function abrirEditar() { setNumero(r.numero || ''); setFecha(r.fecha || hoy); setModo('editar'); }
  function corregirRadicado() {
    const n = numero.trim();
    if (!n) { avisar('Escribe el número de radicado', 'error'); return; }
    if (!leerFecha(fecha)) { avisar('Escribe una fecha válida', 'error'); return; }
    if (n === r.numero && fecha === r.fecha) { setModo(null); return; }
    const cambios = [n !== r.numero ? `número ${r.numero} → ${n}` : '', fecha !== r.fecha ? `fecha ${fechaERP(r.fecha)} → ${fechaERP(fecha)}` : ''].filter(Boolean).join('; ');
    guardar((z) => { z.radicacion.numero = n; z.radicacion.fecha = fecha; }, `Corrigió el radicado (${cambios})`, 'Radicado corregido');
  }

  function rechazar() {
    const motivo = causa.trim();
    if (!motivo) { avisar('Escribe la causa del rechazo', 'error'); return; }
    guardar((z) => { Object.assign(z.radicacion, { estado: 'rechazada', respuesta: { fecha: hoy, por: usuario, causa: motivo }, solicitud: null }); },
            `La ${entidad.tipo} rechazó la radicación: ${motivo}`, 'Rechazada: ahora pídele los documentos al colaborador');
  }
  async function pedirDocumentos(como) {
    const limite = sumarDias(hoy, R.diasReenvio);
    const texto = mensajeRechazoEPS(e, entidad, (r.respuesta || {}).causa || '', limite);
    if (como === 'whatsapp') window.open(`https://wa.me/57${celular}?text=${encodeURIComponent(texto)}`, '_blank', 'noopener');
    else if (!(await copiarTexto(texto))) { avisar('No se pudo copiar', 'error'); return; }
    guardar((z) => { z.radicacion.solicitud = { fecha: new Date().toISOString(), por: usuario, limite }; },
            `Pidió los documentos por el rechazo de la ${entidad.tipo} (plazo hasta ${fechaERP(limite)})`,
            como === 'whatsapp' ? `Pedido por WhatsApp. Tiene hasta el ${fechaLarga(limite)}.` : `Mensaje copiado. Tiene hasta el ${fechaLarga(limite)}.`);
  }
  function volverARadicar() {
    guardar((z) => {
      const { intentos = [], entidad: ent, ...anterior } = z.radicacion;
      z.radicacion = { intentos: [...intentos, anterior], ...(ent ? { entidad: ent } : {}) };
    }, 'Volvió a dejarla “por radicar”', 'Quedó otra vez por radicar');
  }
  function reportarNomina() {
    guardar((z) => { z.radicacion.estado = 'nomina'; z.radicacion.nomina = { fecha: new Date().toISOString(), por: usuario }; },
            'La reportó a nómina como falta injustificada (no reenvió los documentos a tiempo)', 'Reportada: descárgala en “Finalizadas” → Reporte para nómina');
  }
  function guardarEntidad() {
    const n = nombreEntidad.trim().toUpperCase();
    if (!n) return;
    guardar((z) => { z.radicacion.entidad = { nombre: n }; }, `Escribió la ${entidad.tipo}: ${n}`, `${entidad.tipo} guardada`);
  }

  // Semáforo del plazo para radicar
  const diasParaVencer = diasEntre(hoy, plazo.limite);
  const clasePlazo = diasParaVencer < 0 ? 'vencido' : diasParaVencer <= R.diasAviso ? 'por-vencer' : 'bien';
  const reenvioLlego = etapa === 'rechazada' && r.solicitud && ['recibida', 'revision', 'correccion'].includes(e.estado);
  const reenvioVencido = etapa === 'rechazada' && r.solicitud && !reenvioLlego && r.solicitud.limite < hoy;

  return (
    <div className="rad-fila">
      <div className="fila-texto">
        <button className="enlace-archivo" style={{ alignSelf: 'flex-start', fontSize: 16, fontWeight: 600 }} onClick={() => onAbrir(x)}>{nombreBonito(e.nombre)}</button>
        <span className="fila-sub numeros">C.C. {e.cedula} · {e.codigoTipo} {nombreTipo(e.codigoTipo)}</span>
        <span className="fila-sub numeros">{rangoFechas(e.fechaInicial, e.fechaFinal)} · {plural(Number(e.dias) || 0, 'día', 'días')}{(e.erp || {}).consecTNL ? ` · Consec. TNL ${e.erp.consecTNL}` : ''}</span>
      </div>

      <div className="rad-estado">
        {etapa === 'por_radicar' && (<>
          <strong>{nombreEnt}{entidad.manual ? ' (escrita a mano)' : ''}</strong>
          {entidad.maestro && entidad.maestro.retiro && <span className="vencido">En el maestro tiene fecha de retiro.</span>}
          <span className={clasePlazo}>{diasParaVencer < 0 ? `Venció el ${fechaLarga(plazo.limite)}` : diasParaVencer === 0 ? 'Vence hoy' : `Radicar a más tardar el ${fechaLarga(plazo.limite)}`}</span>
          <span>Plazo: {plazo.regla}</span>
          {(r.intentos || []).length > 0 && <span>Se radicó {plural(r.intentos.length, 'vez', 'veces')} antes y fue rechazada: va de nuevo.</span>}
          {formatos.map((f) => <span key={f} className="rad-formato">Lleva: {f}</span>)}
        </>)}
        {etapa === 'radicada' && (<>
          <strong>Radicado {r.numero}</strong>
          <span>{nombreEnt} · el {fechaLarga(r.fecha)}</span>
          <span>{plural(Math.max(0, diasEntre(r.fecha, hoy)), 'día', 'días')} esperando respuesta</span>
        </>)}
        {etapa === 'rechazada' && (<>
          <strong>Rechazada: {(r.respuesta || {}).causa}</strong>
          <span>{nombreEnt} · radicado {r.numero} del {fechaLarga(r.fecha)} · rechazada el {fechaLarga((r.respuesta || {}).fecha)}</span>
          {!r.solicitud && <span className="por-vencer">Falta pedirle los documentos al colaborador.</span>}
          {r.solicitud && !reenvioLlego && <span className={reenvioVencido ? 'vencido' : ''}>Documentos pedidos el {fechaLarga(fechaATexto(new Date(r.solicitud.fecha)))} · {reenvioVencido ? `venció el ${fechaLarga(r.solicitud.limite)}` : `tiene hasta el ${fechaLarga(r.solicitud.limite)}`}</span>}
          {reenvioLlego && <span className="bien">Llegó el reenvío: revísalo en la ficha y apruébalo para radicarla de nuevo.</span>}
        </>)}
        {etapa === 'aprobada' && (<>
          <strong className="bien">Aprobada por la {entidad.tipo}</strong>
          <span>{nombreEnt} · radicado {r.numero} del {fechaLarga(r.fecha)} · aprobada el {fechaLarga((r.respuesta || {}).fecha)}</span>
        </>)}
        {etapa === 'no_se_radica' && (<>
          <strong className="bien">No se radica</strong>
          <span>{nombreEnt} · las incapacidades ante la EPS de {R.diasSinRadicarEPS === 1 ? '1 día' : `1 o ${R.diasSinRadicarEPS} días`} no se radican.</span>
        </>)}
        {etapa === 'nomina' && (<>
          <strong className="vencido">Reportada a nómina</strong>
          <span>No reenvió los documentos a tiempo · {r.nomina ? `${r.nomina.por}, ${fechaCorta(r.nomina.fecha)}` : ''}</span>
          <span>Rechazo: {(r.respuesta || {}).causa}</span>
        </>)}
      </div>

      <div className={`rad-acciones${modo ? ' abierto' : ''}`}>
        {etapa === 'por_radicar' && modo !== 'radicar' && modo !== 'entidad' && (<>
          {!entidad.nombre && <button className="boton boton-suave boton-chico" disabled={ocupado} onClick={() => setModo('entidad')}>Escribir {entidad.tipo}</button>}
          <button className="boton boton-suave boton-chico" disabled={ocupado} onClick={() => descargar('unico')} title="Incapacidad, historia clínica y demás en un solo PDF">Un PDF</button>
          <button className="boton boton-suave boton-chico" disabled={ocupado} onClick={() => descargar('separados')} title="Un PDF por documento, en un ZIP">Por separado</button>
          <button className="boton boton-principal boton-chico" disabled={ocupado} onClick={() => setModo('radicar')}>Radicar</button>
        </>)}
        {modo === 'entidad' && (
          <div className="rad-form">
            <input value={nombreEntidad} onChange={(ev) => setNombreEntidad(ev.target.value)} placeholder={entidad.tipo === 'ARL' ? 'Ej. ARL SURA' : 'Ej. NUEVA EPS'} aria-label={`Nombre de la ${entidad.tipo}`} autoFocus
                   onKeyDown={(ev) => ev.key === 'Enter' && guardarEntidad()} />
            <button className="boton boton-texto boton-chico" onClick={() => setModo(null)}>Cancelar</button>
            <button className="boton boton-principal boton-chico" disabled={ocupado || !nombreEntidad.trim()} onClick={guardarEntidad}>Guardar</button>
          </div>
        )}
        {modo === 'radicar' && (
          <div className="rad-form">
            <input className="numero" value={numero} onChange={(ev) => setNumero(ev.target.value)} placeholder="N.º de radicado" aria-label="Número de radicado" autoFocus
                   onKeyDown={(ev) => ev.key === 'Enter' && radicar()} />
            <input type="date" value={fecha} max={hoy} onChange={(ev) => setFecha(ev.target.value)} aria-label="Fecha de radicación" />
            <button className="boton boton-texto boton-chico" onClick={() => setModo(null)}>Cancelar</button>
            <button className="boton boton-principal boton-chico" disabled={ocupado || !numero.trim()} onClick={radicar}>Guardar</button>
          </div>
        )}
        {modo === 'editar' && (
          <div className="rad-form">
            <span className="fila-sub">Corregir radicado:</span>
            <input className="numero" value={numero} onChange={(ev) => setNumero(ev.target.value)} placeholder="N.º de radicado" aria-label="Número de radicado corregido" autoFocus
                   onKeyDown={(ev) => ev.key === 'Enter' && corregirRadicado()} />
            <input type="date" value={fecha} max={hoy} onChange={(ev) => setFecha(ev.target.value)} aria-label="Fecha de radicación" />
            <button className="boton boton-texto boton-chico" onClick={() => setModo(null)}>Cancelar</button>
            <button className="boton boton-principal boton-chico" disabled={ocupado || !numero.trim()} onClick={corregirRadicado}>Guardar</button>
          </div>
        )}
        {/* Corregir el radicado: en cualquier etapa después de radicar (también en las finalizadas) */}
        {etapa !== 'por_radicar' && r.numero && !modo && (
          <button className="boton boton-texto boton-chico" disabled={ocupado} onClick={abrirEditar} title="Si el número o la fecha del radicado quedaron mal">
            <Icono nombre="corregir" tamano={16} /> Editar radicado
          </button>
        )}
        {etapa === 'radicada' && !modo && (<>
          <button className="boton boton-suave boton-chico" disabled={ocupado} onClick={() => setModo('rechazo')}>Rechazada</button>
          <button className="boton boton-principal boton-chico" disabled={ocupado}
                  onClick={() => guardar((z) => { z.radicacion.estado = 'aprobada'; z.radicacion.respuesta = { fecha: hoy, por: usuario }; },
                                         `La ${entidad.tipo} aprobó la incapacidad (radicado ${r.numero})`, 'Aprobada: la radicación terminó')}>Aprobada</button>
        </>)}
        {modo === 'rechazo' && (<>
          <div className="rad-chips">{R.motivosRechazo.map((m) => <button key={m} type="button" onClick={() => setCausa(m)}>{m}</button>)}</div>
          <div className="rad-form">
            <input className="causa" value={causa} onChange={(ev) => setCausa(ev.target.value)} placeholder="Causa del rechazo (como la dio la EPS)" aria-label="Causa del rechazo" autoFocus
                   onKeyDown={(ev) => ev.key === 'Enter' && rechazar()} />
            <button className="boton boton-texto boton-chico" onClick={() => setModo(null)}>Cancelar</button>
            <button className="boton boton-principal boton-chico" disabled={ocupado || !causa.trim()} onClick={rechazar}>Guardar rechazo</button>
          </div>
        </>)}
        {etapa === 'rechazada' && !modo && (<>
          {!r.solicitud && (<>
            <button className="boton boton-suave boton-chico" disabled={ocupado} onClick={() => pedirDocumentos('copiar')}><Icono nombre="copiar" tamano={16} /> Copiar mensaje</button>
            <button className="boton boton-principal boton-chico" disabled={ocupado || !celular} title={celular ? `WhatsApp al ${celular}` : 'No hay celular: copia el mensaje'} onClick={() => pedirDocumentos('whatsapp')}><Icono nombre="mensaje" tamano={16} /> Pedir por WhatsApp</button>
          </>)}
          {reenvioLlego && <button className="boton boton-principal boton-chico" onClick={() => onAbrir(x)}>Revisar el reenvío</button>}
          {reenvioVencido && <button className="boton boton-principal boton-chico" disabled={ocupado} onClick={reportarNomina}>Reportar a nómina</button>}
          {r.solicitud && !reenvioLlego && <button className="boton boton-texto boton-chico" disabled={ocupado} onClick={() => pedirDocumentos('copiar')}>Copiar el mensaje otra vez</button>}
          <button className="boton boton-texto boton-chico" disabled={ocupado} onClick={volverARadicar} title="Si los documentos llegaron por otro medio">Volver a radicar</button>
        </>)}
      </div>
    </div>
  );
}

/* ---------- Ficha de la incapacidad: revisar documentos y ver los datos para el ERP ---------- */
const MOTIVOS_RAPIDOS = CONFIG.motivosRechazo;

function Ficha({ x, ctx, usuario, avisar, onCambio, onControl, onCerrar }) {
  const [exp, setExp] = useState(x.expediente);
  const [archivos, setArchivos] = useState({});          // nombre → handle
  const [guardando, setGuardando] = useState(false);
  const [rechazando, setRechazando] = useState(null);    // { id, motivo }
  const [editando, setEditando] = useState(null);        // { id, valor }
  const [correccion, setCorreccion] = useState(null);    // texto del mensaje mientras se pide corrección
  const [consec, setConsec] = useState('');

  useEffect(() => {
    listar(x.carpeta).then((l) => setArchivos(Object.fromEntries(l.filter((f) => f.tipo === 'file').map((f) => [f.nombre, f.handle]))));
    const alTeclear = (ev) => ev.key === 'Escape' && !rechazando && !editando && !correccion && onCerrar();
    window.addEventListener('keydown', alTeclear);
    return () => window.removeEventListener('keydown', alTeclear);
  }, [x, rechazando, editando, correccion]);

  /** Hace un cambio en el expediente, lo anota en la bitácora y lo guarda en la carpeta. */
  async function cambiar(modificar, accion, avanzarEstado = true) {
    if (guardando) return false;
    setGuardando(true);
    try {
      const copia = JSON.parse(JSON.stringify(exp));
      copia.erp = copia.erp || {};
      modificar(copia);
      if (avanzarEstado && copia.estado === 'recibida') copia.estado = 'revision';
      anotar(copia, usuario, accion);
      setExp(await guardarExpediente(x.carpeta, copia));
      onCambio();
      return true;
    } catch (e) {
      console.error(e);
      if (e instanceof ErrorChoque) {
        avisar(e.message, 'error');
        try { setExp(await leerExpediente(x.carpeta)); } catch (z) { /* se queda con lo que tenía */ }
      } else avisar(`No se pudo guardar: ${e.message}`, 'error');
      return false;
    } finally { setGuardando(false); }
  }

  if (!exp) {
    return (
      <>
        <div className="velo" onClick={onCerrar} />
        <aside className="detalle" role="dialog" aria-modal="true" aria-label="Incapacidad">
          <div className="agarre" aria-hidden="true" />
          <div className="detalle-cabeza"><h2>{nombreBonito(x.nombre)}</h2></div>
          <div className="detalle-cuerpo"><div className="alerta error">{x.problema} Revisa la carpeta “{x.ruta}” en OneDrive.</div>
            <button className="boton boton-secundario" onClick={onCerrar}>Cerrar</button></div>
        </aside>
      </>
    );
  }

  const res = resumenDocumentos(exp);
  const revisiones = revisionesDe(exp, ctx, x.id);
  const errores = revisiones.filter((r) => r.nivel === 'error').length;
  const datos = datosERP(exp, ctx, x.id);
  const cerrada = ESTADOS_CERRADOS.includes(exp.estado);
  const celularValido = /^3\d{9}$/.test(String(exp.celular || ''));

  /* ----- Documentos ----- */
  function revisar(id, revision, motivo = '') {
    const doc = nombreDocumento(id);
    const texto = revision === 'aprobado' ? `Aprobó ${doc}` : revision === 'rechazado' ? `Rechazó ${doc}: ${motivo}` : `Dejó ${doc} sin revisar`;
    cambiar((e) => {
      e.documentos[id].revision = revision; e.documentos[id].motivo = motivo;
      if (revision !== 'aprobado' && e.estado === 'aprobada') e.estado = 'revision';  // si se cambia de opinión, la incapacidad deja de estar aprobada
    }, texto).then((ok) => ok && setRechazando(null));
  }

  /* ----- Datos (correcciones de la gestora) ----- */
  function guardarDato(campo) {
    const original = (exp.datosOriginales || {})[campo];
    let valor = editando.valor;
    if (campo === 'dias') valor = Math.max(0, parseInt(valor, 10) || 0);
    if (campo === 'diagnostico') valor = limpiarDiagnostico(valor);
    if (campo === 'prorroga') valor = valor === true || valor === 'Sí';
    if ((campo === 'fechaInicial' || campo === 'fechaFinalAnterior' || campo === 'fechaAccidente') && !leerFecha(valor)) { avisar('Escribe una fecha válida', 'error'); return; }
    if (campo === 'dias' && valor < 1) { avisar('Los días deben ser 1 o más', 'error'); return; }
    if (campo === 'consecAnterior') {
      const limpio = String(valor).trim();
      cambiar((e) => { e.erp.consecAnterior = limpio; }, `Escribió el Consec. TNL anterior: ${limpio || '(vacío)'}`).then((ok) => ok && setEditando(null));
      return;
    }
    const antes = exp[campo];
    const legible = (v) => campo.startsWith('fecha') ? fechaERP(v) : campo === 'prorroga' ? (v ? 'Sí' : 'No') : String(v ?? '');
    cambiar((e) => {
      e[campo] = valor;
      if (campo === 'fechaInicial' || campo === 'dias') e.fechaFinal = calcularFechaFinal(e.fechaInicial, e.dias);
      if (campo === 'prorroga' && !valor) { e.fechaFinalAnterior = null; e.erp.consecAnterior = ''; e.erp.anterior = null; }
    }, `Corrigió ${datos.find((d) => d.id === campo).etiqueta.toLowerCase()}: de ${legible(antes)} a ${legible(valor)}${String(original) !== String(valor) ? '' : ' (volvió a lo que mandó el colaborador)'}`)
      .then((ok) => ok && setEditando(null));
  }

  /* ----- Prórroga: de cuál incapacidad viene ----- */
  /** Guarda el consecutivo anterior elegido: { consec, contrato, modo: 'sugerido'|'elegido'|'escrito' } (null = quitar). */
  function elegirAnterior(anterior, texto) {
    return cambiar((e) => { e.erp.anterior = anterior; e.erp.consecAnterior = anterior ? String(anterior.consec) : ''; }, texto);
  }
  /** Días acumulados escritos a mano hasta un consecutivo que no está en el histórico.
   *  Se guardan en control.json para que la próxima prórroga de esa cadena ya los encuentre. */
  async function guardarAcumulado(consec, dias) {
    try {
      await onControl((c) => { c.acumulados[`${exp.cedula}|${consec}`] = { dias, por: usuario, fecha: new Date().toISOString(), nombre: exp.nombre }; });
    } catch (e) { avisar(`No se pudo guardar: ${e.message}`, 'error'); return false; }
    return cambiar((e) => {
      if (e.erp.anterior && String(e.erp.anterior.consec) === String(consec)) e.erp.anterior = { ...e.erp.anterior, diasAcumulados: dias };
    }, `Escribió a mano que hasta el consecutivo ${consec} la cadena llevaba ${plural(dias, 'día', 'días')}`);
  }

  async function copiar(etiqueta, valor) {
    avisar(await copiarTexto(valor) ? `Copiado: ${valor}` : 'No se pudo copiar', 'ok');
  }
  async function copiarTodo() {
    const texto = datos.map((d) => `${d.etiqueta}\t${d.valor}`).join('\n');
    avisar(await copiarTexto(texto) ? 'Se copiaron todos los datos' : 'No se pudo copiar');
  }

  /* ----- Estado ----- */
  function aprobar() {
    // Si ya estaba registrada en el ERP (es el reenvío por un rechazo de la EPS), no vuelve a "Para el ERP":
    // queda registrada y otra vez "por radicar" (la radicación anterior se guarda en "intentos").
    const yaRegistrada = !!(exp.erp && exp.erp.registrado);
    cambiar((e) => {
      if (!yaRegistrada) { e.estado = 'aprobada'; return; }
      e.estado = 'registrada';
      if (e.radicacion && e.radicacion.estado) {
        const { intentos = [], entidad, ...anterior } = e.radicacion;
        e.radicacion = { intentos: [...intentos, anterior], ...(entidad ? { entidad } : {}) };
      }
    }, yaRegistrada ? 'Aprobó el reenvío: queda otra vez por radicar ante la EPS/ARL' : 'Aprobó la incapacidad', false)
      .then((ok) => ok && avisar(yaRegistrada ? 'Aprobada: quedó otra vez “por radicar” en Radicación' : 'Aprobada: ya aparece en “Para el ERP”'));
  }
  function registrar() {
    const n = consec.trim();
    cambiar((e) => { e.estado = 'registrada'; e.erp = { ...e.erp, consecTNL: n, registrado: new Date().toISOString(), registradoPor: usuario }; },
            `La registró en el ERP${n ? ` (Consec. TNL ${n})` : ''}`, false)
      .then((ok) => ok && (setConsec(''), avisar('Marcada como registrada en el ERP')));
  }
  function cambiarEstado(estado) {
    cambiar((e) => { e.estado = estado; }, `Cambió el estado a "${nombreEstado(estado)}"`, false);
  }
  async function enviarCorreccion(como) {
    const texto = correccion;
    if (como === 'whatsapp') window.open(`https://wa.me/57${exp.celular}?text=${encodeURIComponent(texto)}`, '_blank', 'noopener');
    else await copiarTexto(texto);
    const ok = await cambiar((e) => {
      e.estado = 'correccion';
      e.correcciones = [...(e.correcciones || []), { fecha: new Date().toISOString(), por: usuario, mensaje: texto }];
    }, como === 'whatsapp' ? 'Pidió corrección por WhatsApp' : 'Copió el mensaje de corrección para enviarlo', false);
    if (ok) { setCorreccion(null); avisar(como === 'whatsapp' ? 'Quedó “Con corrección”. Cuando reenvíe, llegará a la bandeja.' : 'Mensaje copiado. Quedó “Con corrección”.'); }
  }

  /** Lo que se puede hacer ahora, según cómo va la revisión. */
  function Siguiente() {
    if (exp.estado === 'registrada') {
      return <div className="paso-siguiente hecho"><Icono nombre="listo" /><div><strong>Registrada en el ERP{exp.erp.consecTNL ? ` — Consec. TNL ${exp.erp.consecTNL}` : ''}</strong><span>{exp.erp.registradoPor}, {fechaCorta(exp.erp.registrado)}</span></div></div>;
    }
    if (exp.estado === 'no_procede') return <div className="paso-siguiente"><div><strong>No procede</strong><span>Cambia el estado arriba si fue un error.</span></div></div>;
    if (exp.estado === 'aprobada') {
      return (
        <div className="paso-siguiente listo">
          <div style={{ flex: 1, minWidth: 0 }}>
            <strong>Aprobada. Regístrala en el ERP y escribe el consecutivo</strong>
            <div className="registrar">
              <input value={consec} onChange={(e) => setConsec(e.target.value.replace(/\D/g, ''))} inputMode="numeric" maxLength={12} placeholder="Consec. TNL" aria-label="Consecutivo TNL del ERP" />
              <button className="boton boton-principal" disabled={guardando} onClick={registrar}>Marcar registrada</button>
            </div>
          </div>
        </div>
      );
    }
    if (res.conProblema.length) {
      return (
        <div className="paso-siguiente problema">
          <div style={{ flex: 1, minWidth: 0 }}>
            <strong>{plural(res.conProblema.length, 'documento necesita', 'documentos necesitan')} corrección</strong>
            <span>{res.conProblema.map((d) => nombreDocumento(d.id)).join(', ')}{exp.estado === 'correccion' ? ' — ya se le pidió; esperando el reenvío' : ''}</span>
          </div>
          <button className="boton boton-principal" disabled={guardando} onClick={() => setCorreccion(mensajeCorreccion(exp))}><Icono nombre="mensaje" tamano={18} /> {exp.estado === 'correccion' ? 'Pedir de nuevo' : 'Pedir corrección'}</button>
        </div>
      );
    }
    if (res.pendientes) {
      return <div className="paso-siguiente"><div><strong>{res.pendientes === 1 ? 'Falta 1 documento' : `Faltan ${res.pendientes} documentos`} por revisar</strong><span>Ábrelos con “Ver” y aprueba o rechaza cada uno.</span></div></div>;
    }
    return (
      <div className="paso-siguiente listo">
        <div style={{ flex: 1, minWidth: 0 }}>
          <strong>Todos los documentos están aprobados</strong>
          <span>{errores ? `Ojo: hay ${plural(errores, 'revisión en rojo', 'revisiones en rojo')} en los datos. Corrígelas antes de aprobar.` : 'Los datos pasaron las revisiones.'}</span>
        </div>
        <button className="boton boton-principal" disabled={guardando} onClick={aprobar}><Icono nombre="listo" tamano={18} /> Aprobar incapacidad</button>
      </div>
    );
  }

  return (
    <>
      <div className="velo" onClick={onCerrar} />
      <aside className="detalle ficha ficha-ancha" role="dialog" aria-modal="true" aria-label={`Incapacidad de ${exp.nombre}`}>
        <div className="agarre" aria-hidden="true" />
        <div className="detalle-cabeza">
          <div style={{ display: 'flex', justifyContent: 'space-between', gap: 12, alignItems: 'flex-start' }}>
            <div className="fila-texto">
              <h2 style={{ overflowWrap: 'anywhere' }}>{nombreBonito(exp.nombre)}</h2>
              <span className="fila-sub"><span className="numeros">C.C. {exp.cedula}</span> — {exp.codigoTipo} {nombreTipo(exp.codigoTipo)}{exp.prorroga ? ' (prórroga)' : ''} — {exp.sede || 'sin sede'}</span>
            </div>
            <button className="boton boton-texto" style={{ fontWeight: 600, fontSize: 17 }} onClick={onCerrar}>Listo</button>
          </div>
          <div className="cabeza-estado">
            <select className={`selector selector-estado e-${exp.estado}`} value={exp.estado} disabled={guardando} onChange={(e) => cambiarEstado(e.target.value)} aria-label="Estado de la incapacidad">
              {CONFIG.estados.map((e) => <option key={e.id} value={e.id}>{e.nombre}</option>)}
            </select>
            <div style={{ flex: 1, minWidth: 140 }}>
              <div className="cana cana-ancha" aria-hidden="true">{res.docs.map((d) => <span key={d.id} className={`nudo ${d.estado === 'aprobado' ? 'aprobado' : d.estado === 'pendiente' ? 'recibido' : 'rechazado'}`} />)}</div>
              <div className="avance-texto">{res.aprobados} de {plural(res.total, 'documento aprobado', 'documentos aprobados')}{guardando ? ' — guardando…' : ''}</div>
            </div>
          </div>
          <Siguiente />
        </div>

        <div className="detalle-cuerpo">
          <div className="ficha-columnas">
            {/* ---------- Izquierda: documentos y revisiones ---------- */}
            <div className="ficha-col">
              <section>
                <h3>Documentos</h3>
                <p className="nota-seccion">Ábrelos con “Ver”, compáralos con los datos de la derecha y marca cada uno.</p>
                <div className="tarjeta">
                  {res.docs.map(({ id, doc, estado, requerido }) => (
                    <div key={id} className="item-ficha">
                      <span className={`punto ${estado === 'aprobado' ? 'hecho' : estado === 'rechazado' || estado === 'falta' ? 'malo' : ''}`} aria-hidden="true">
                        {estado === 'aprobado' && <Icono nombre="listo" tamano={13} />}{(estado === 'rechazado' || estado === 'falta') && <Icono nombre="cerrar" tamano={12} />}
                      </span>
                      <div className="fila-texto">
                        <span className="item-titulo">{nombreDocumento(id)}</span>
                        {!doc ? (
                          <span className="motivo-texto">{requerido ? 'No llegó: se le debe pedir.' : 'No llegó.'}</span>
                        ) : (
                          <span className="nombre-archivo">
                            <button className="enlace-archivo" disabled={!archivos[doc.archivo]} onClick={() => abrirArchivo(archivos[doc.archivo])}>Ver</button>
                            {doc.origen === 'fotos' ? `${plural(doc.paginas || 1, 'foto', 'fotos')}` : `PDF${doc.paginas ? `, ${plural(doc.paginas, 'página', 'páginas')}` : ''}`}
                            {doc.claveQuitada ? ' — venía con contraseña (la app se la quitó)' : ''}
                          </span>
                        )}
                        {doc && doc.fotosConAdvertencia > 0 && <span className="aviso-doc">{plural(doc.fotosConAdvertencia, 'foto salió borrosa u oscura', 'fotos salieron borrosas u oscuras')} y el colaborador las envió igual: míralas con cuidado.</span>}
                        {doc && doc.revision === 'rechazado' && doc.motivo && <span className="motivo-texto">Motivo: {doc.motivo}</span>}
                        {rechazando && rechazando.id === id && (
                          <div className="caja-motivo">
                            <div className="chips">{MOTIVOS_RAPIDOS.map((m) => <button key={m} className="chip" onClick={() => setRechazando({ id, motivo: m })}>{m}</button>)}</div>
                            <input autoFocus value={rechazando.motivo} maxLength={160} placeholder="¿Por qué se rechaza? El colaborador lo verá"
                                   onChange={(e) => setRechazando({ id, motivo: e.target.value })}
                                   onKeyDown={(e) => { if (e.key === 'Enter' && rechazando.motivo.trim()) revisar(id, 'rechazado', rechazando.motivo.trim()); if (e.key === 'Escape') setRechazando(null); }} />
                            <div className="acciones">
                              <button className="boton boton-secundario" onClick={() => setRechazando(null)}>Cancelar</button>
                              <button className="boton boton-principal" disabled={!rechazando.motivo.trim() || guardando} onClick={() => revisar(id, 'rechazado', rechazando.motivo.trim())}>Rechazar</button>
                            </div>
                          </div>
                        )}
                      </div>
                      {doc && !cerrada && (
                        <div className="segmento" role="group" aria-label={`Revisión de ${nombreDocumento(id)}`}>
                          <button aria-pressed={doc.revision === 'aprobado'} disabled={guardando} onClick={() => revisar(id, doc.revision === 'aprobado' ? 'pendiente' : 'aprobado')}>Aprobar</button>
                          <button aria-pressed={doc.revision === 'rechazado'} className="rechazar" disabled={guardando}
                                  onClick={() => doc.revision === 'rechazado' ? revisar(id, 'pendiente') : setRechazando({ id, motivo: '' })}>Rechazar</button>
                        </div>
