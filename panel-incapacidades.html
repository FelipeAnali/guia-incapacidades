<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;
const CONFIG = window.CONFIG_PANEL;
const LOGO = window.LOGO_CANAVERAL;
const C = CONFIG.carpetas;
const MS_POR_DIA = 24 * 60 * 60 * 1000;

/* ==========================================================================
   1. UTILIDADES
   ========================================================================== */

/** Convierte un texto en nombre de archivo seguro: "Laura Gómez" → "LAURA_GOMEZ".
 *  Es la MISMA regla de la app del colaborador, para que los nombres coincidan. */
function textoParaArchivo(texto, maximo = 40) {
  const limpio = (texto || '')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^A-Za-z0-9]+/g, '_')
    .replace(/^_+|_+$/g, '')
    .toUpperCase();
  if (limpio.length <= maximo) return limpio;
  const cortado = limpio.slice(0, maximo);
  const ultimoGuion = cortado.lastIndexOf('_');
  return (ultimoGuion > 0 ? cortado.slice(0, ultimoGuion) : cortado).replace(/_+$/g, '');
}

/** Texto sin tildes y en minúscula, para buscar sin importar cómo se escribió. */
function paraBuscar(texto) {
  return (texto || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}

/** "LAURA GÓMEZ" → "Laura Gómez" (solo si vino todo en mayúsculas). */
function nombreBonito(texto) {
  const t = (texto || '').trim();
  if (t !== t.toUpperCase()) return t;
  return t.toLowerCase().replace(/(^|\s|-)(\p{L})/gu, (m, a, b) => a + b.toUpperCase())
    .replace(/\b(Ii|Iii|Iv)\b/g, (r) => r.toUpperCase());   // "Montoya III", no "Montoya Iii"
}

/** Plural correcto: plural(1,'día','días') → "1 día". */
function plural(n, uno, varios) {
  return `${Number(n).toLocaleString('es-CO')} ${n === 1 ? uno : varios}`;
}

/** Fecha y hora corta: "9 nov. 2026, 2:33 p. m." */
function fechaCorta(valor) {
  if (!valor) return '—';
  return new Date(valor).toLocaleString('es-CO', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
}

/** Días completos entre una fecha y hoy (0 = hoy). */
function diasDesde(valor) {
  if (!valor) return 0;
  const inicio = new Date(valor); inicio.setHours(0, 0, 0, 0);
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  return Math.max(0, Math.round((hoy - inicio) / MS_POR_DIA));
}

/** Tamaño legible: 1536000 → "1,5 MB". */
function tamanoLegible(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toLocaleString('es-CO', { maximumFractionDigits: 0 })} KB`;
  return `${(bytes / 1024 / 1024).toLocaleString('es-CO', { maximumFractionDigits: 1 })} MB`;
}

/** Marca de tiempo para nombres de carpeta: "2026-11-09_1433". */
function marcaDeTiempo(fecha = new Date()) {
  const d = (n) => String(n).padStart(2, '0');
  return `${fecha.getFullYear()}-${d(fecha.getMonth() + 1)}-${d(fecha.getDate())}_${d(fecha.getHours())}${d(fecha.getMinutes())}`;
}

/* ----- Fechas de la incapacidad (siempre en texto "aaaa-mm-dd", como las manda la app) ----- */

/** "2026-11-10" → Date (a medianoche, hora local). Devuelve null si no es una fecha real. */
function leerFecha(texto) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(texto || '');
  if (!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return d.getMonth() === +m[2] - 1 ? d : null;
}
/** Date → "2026-11-10". */
function fechaATexto(d) {
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function hoyTexto() { return fechaATexto(new Date()); }
/** Suma días a una fecha en texto: sumarDias("2026-11-10", 4) → "2026-11-14". */
function sumarDias(texto, n) {
  const d = leerFecha(texto);
  if (!d) return '';
  d.setDate(d.getDate() + n);
  return fechaATexto(d);
}
/** Fecha final = fecha inicial + días − 1 (el primer día cuenta). Misma regla de la app. */
function calcularFechaFinal(inicial, dias) {
  const n = Number(dias);
  return leerFecha(inicial) && n >= 1 ? sumarDias(inicial, n - 1) : '';
}
/** Días de calendario de "a" a "b" (b − a). */
function diasEntre(a, b) {
  const x = leerFecha(a), y = leerFecha(b);
  if (!x || !y) return null;
  return Math.round((Date.UTC(y.getFullYear(), y.getMonth(), y.getDate()) - Date.UTC(x.getFullYear(), x.getMonth(), x.getDate())) / MS_POR_DIA);
}
/** Como se escribe en el ERP: "10/11/2026". */
function fechaERP(texto) {
  const d = leerFecha(texto);
  if (!d) return texto || '—';
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()}`;
}
/** Para leer: "10 nov. 2026". */
function fechaLarga(texto) {
  const d = leerFecha(texto);
  return d ? d.toLocaleDateString('es-CO', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
}
/** Rango corto para listados: "10 nov. → 14 nov. 2026". */
function rangoFechas(inicial, final) {
  const a = leerFecha(inicial), b = leerFecha(final);
  if (!a) return '—';
  const corto = (d) => d.toLocaleDateString('es-CO', { day: 'numeric', month: 'short' });
  if (!b) return fechaLarga(inicial);
  return `${corto(a)} → ${corto(b)} ${b.getFullYear()}`;
}

/** Diagnóstico CIE-10: una letra y 2 o 3 números (la 4.ª puede ser X). Misma regla de la app. */
function limpiarDiagnostico(texto) {
  return String(texto || '').toUpperCase().replace(/[\s.\-]/g, '');
}
const PATRON_CIE10 = /^[A-Z][0-9]{2}[0-9X]?$/;

/* ----- Tipos, documentos y estados ----- */
const tipoPorCodigo = (codigo) => CONFIG.tipos.find((t) => t.codigo === codigo) || null;
const nombreTipo = (codigo) => (tipoPorCodigo(codigo) || {}).nombre || `Tipo ${codigo || '—'}`;
const documentoPorId = (id) => CONFIG.documentos.find((d) => d.id === id) || null;
const nombreDocumento = (id) => (documentoPorId(id) || {}).nombre || id;
const nombreEstado = (id) => (CONFIG.estados.find((e) => e.id === id) || {}).nombre || id;
const ESTADOS_CERRADOS = ['registrada', 'no_procede'];

/**
 * Documentos que DEBE traer una incapacidad según su tipo (FURIPS si fue de tránsito).
 * Enfermedad general (018) de 1 o 2 días (CONFIG.diasSinHistoria) no pide historia clínica. Accidente de trabajo sí.
 */
function documentosRequeridos(exp) {
  const tipo = tipoPorCodigo(exp.codigoTipo);
  if (!tipo) return [];
  const dias = Number(exp.dias);
  const sinHistoria = exp.codigoTipo === '018' && dias >= 1 && dias <= (CONFIG.diasSinHistoria || 0);
  const ids = tipo.documentos.filter((id) => id !== 'historia' || !sinHistoria);
  if (exp.codigoTipo === '018' && exp.accidenteTransito) ids.push('furips');
  return ids;
}

/** Abre un archivo (PDF) en otra pestaña. */
async function abrirArchivo(handle) {
  const archivo = await handle.getFile();
  const url = URL.createObjectURL(new Blob([archivo], { type: 'application/pdf' }));
  window.open(url, '_blank', 'noopener');
  setTimeout(() => URL.revokeObjectURL(url), 5 * 60 * 1000);
}

/** Copia un texto al portapapeles (con plan B para navegadores viejos). */
async function copiarTexto(texto) {
  try { await navigator.clipboard.writeText(texto); return true; }
  catch (e) {
    const area = document.createElement('textarea');
    area.value = texto; area.style.position = 'fixed'; area.style.opacity = '0';
    document.body.appendChild(area); area.select();
    const ok = document.execCommand('copy');
    area.remove();
    return ok;
  }
}

/** Huella (SHA-256) de un archivo: sirve para saber si un reenvío trae el MISMO documento. */
async function huellaDe(blob) {
  const datos = await blob.arrayBuffer();
  const hash = await crypto.subtle.digest('SHA-256', datos);
  return [...new Uint8Array(hash)].map((b) => b.toString(16).padStart(2, '0')).join('');
}

/* ==========================================================================
   2. RECORDAR LA CARPETA Y EL USUARIO
   El navegador guarda (en IndexedDB) SOLO: el acceso a la carpeta elegida y
   el nombre de quien usa el panel. Ningún documento ni dato de salud.
   ========================================================================== */
const BD_NOMBRE = 'panel-incapacidades';
const BD_TABLA = 'ajustes';

function abrirBd() {
  return new Promise((resolver, rechazar) => {
    const pedido = indexedDB.open(BD_NOMBRE, 1);
    pedido.onupgradeneeded = () => pedido.result.createObjectStore(BD_TABLA);
    pedido.onsuccess = () => resolver(pedido.result);
    pedido.onerror = () => rechazar(pedido.error);
  });
}
async function recordar(clave, valor) {
  try {
    const bd = await abrirBd();
    await new Promise((ok, mal) => {
      const t = bd.transaction(BD_TABLA, 'readwrite');
      t.objectStore(BD_TABLA).put(valor, clave);
      t.oncomplete = ok; t.onerror = () => mal(t.error);
    });
  } catch (e) { console.warn('No se pudo recordar', clave, e); }
}
async function recuperar(clave) {
  try {
    const bd = await abrirBd();
    return await new Promise((ok, mal) => {
      const p = bd.transaction(BD_TABLA).objectStore(BD_TABLA).get(clave);
      p.onsuccess = () => ok(p.result); p.onerror = () => mal(p.error);
    });
  } catch (e) { return undefined; }
}

/* ==========================================================================
   3. ARCHIVOS (sobre la carpeta elegida)
   Funcionan igual con la carpeta real del computador y con la carpeta de
   ejemplo en memoria (sección 8), porque ambas tienen las mismas funciones.
   ========================================================================== */

/** ¿Este navegador permite abrir carpetas? (Chrome/Edge de computador) */
const puedeAbrirCarpetas = typeof window.showDirectoryPicker === 'function';

/** Abre (o crea) una subcarpeta. */
function subcarpeta(carpeta, nombre, crear = true) {
  return carpeta.getDirectoryHandle(nombre, { create: crear });
}

/** Lista lo que hay dentro de una carpeta: [{ nombre, handle, tipo }]. */
async function listar(carpeta) {
  const lista = [];
  for await (const [nombre, handle] of carpeta.entries()) lista.push({ nombre, handle, tipo: handle.kind });
  return lista.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
}

/** ¿Existe un archivo o carpeta con ese nombre? */
async function existe(carpeta, nombre) {
  for await (const [n] of carpeta.entries()) if (n === nombre) return true;
  return false;
}

/** Escribe un archivo (texto o Blob), reemplazándolo si ya existe. */
async function escribir(carpeta, nombre, contenido) {
  const handle = await carpeta.getFileHandle(nombre, { create: true });
  const escritor = await handle.createWritable();
  await escritor.write(contenido);
  await escritor.close();
  return handle;
}

/** Busca un nombre libre: si "x.zip" existe, devuelve "x (2).zip". */
async function nombreLibre(carpeta, nombre) {
  if (!(await existe(carpeta, nombre))) return nombre;
  const punto = nombre.lastIndexOf('.');
  const base = punto > 0 ? nombre.slice(0, punto) : nombre;
  const ext = punto > 0 ? nombre.slice(punto) : '';
  for (let i = 2; i < 1000; i++) {
    const intento = `${base} (${i})${ext}`;
    if (!(await existe(carpeta, intento))) return intento;
  }
  return `${base}_${Date.now()}${ext}`;
}

/**
 * Mueve un archivo a otra carpeta. Si el navegador sabe "mover", lo usa;
 * si no, copia y luego borra el original (solo si la copia quedó bien).
 */
async function moverArchivo(handle, carpetaOrigen, carpetaDestino, nombreNuevo) {
  const destino = await nombreLibre(carpetaDestino, nombreNuevo || handle.name);
  if (typeof handle.move === 'function') {
    try { await handle.move(carpetaDestino, destino); return destino; }
    catch (e) { /* algunos navegadores no lo permiten: se copia */ }
  }
  const archivo = await handle.getFile();
  await escribir(carpetaDestino, destino, archivo);
  await carpetaOrigen.removeEntry(handle.name);
  return destino;
}

/** Crea las subcarpetas que falten y devuelve cuáles creó. */
async function prepararEstructura(raiz) {
  const creadas = [];
  for (const nombre of [C.recibidos, C.colaboradores, C.fuentes]) {
    if (!(await existe(raiz, nombre))) creadas.push(nombre);
    await subcarpeta(raiz, nombre);
  }
  await subcarpeta(await subcarpeta(raiz, C.recibidos), C.procesados);
  const alertas = await subcarpeta(raiz, C.alertas);
  for (const nombre of [C.alertasPendientes, C.alertasEnviadas, C.alertasErrores]) await subcarpeta(alertas, nombre);
  return creadas;
}

/* ==========================================================================
   4. EXPEDIENTE DE LA INCAPACIDAD (incapacidad.json)
   Cada incapacidad tiene su carpeta:
     Colaboradores / 1144123456_LAURA_GOMEZ / 2026-11-10_018 /
         incapacidad.json  + los PDF
   El json guarda los datos, la revisión de cada documento, los datos del ERP
   y la bitácora. Tiene un número "rev": antes de guardar se revisa que nadie
   más lo haya cambiado (por si dos personas lo abren a la vez).
   ========================================================================== */
const ARCHIVO_EXPEDIENTE = 'incapacidad.json';

/** Datos que manda el colaborador y que la gestora puede corregir. */
const CAMPOS_DATOS = ['nombre', 'celular', 'sede', 'codigoTipo', 'nombreTipo', 'accidenteTransito', 'fechaAccidente',
  'prorroga', 'fechaFinalAnterior', 'fechaInicial', 'dias', 'fechaFinal', 'diagnostico'];

class ErrorChoque extends Error {}

async function leerExpediente(carpeta) {
  if (!(await existe(carpeta, ARCHIVO_EXPEDIENTE))) return null;
  const handle = await carpeta.getFileHandle(ARCHIVO_EXPEDIENTE);
  return JSON.parse(await (await handle.getFile()).text());
}

async function guardarExpediente(carpeta, expediente) {
  let actual = null;
  try { actual = await leerExpediente(carpeta); } catch (e) { actual = null; }
  if (actual && (actual.rev || 0) !== (expediente.rev || 0)) {
    throw new ErrorChoque(`${actual.actualizadoPor || 'Otra persona'} cambió esta incapacidad hace un momento. Ciérrala y ábrela de nuevo para ver sus cambios.`);
  }
  const nuevo = { ...expediente, rev: (expediente.rev || 0) + 1, actualizado: new Date().toISOString() };
  await escribir(carpeta, ARCHIVO_EXPEDIENTE, JSON.stringify(nuevo, null, 2));
  return nuevo;
}

/** Toma solo los datos de la incapacidad del json que manda la app. */
function datosDelPaquete(d) {
  const fuera = {};
  CAMPOS_DATOS.forEach((k) => { fuera[k] = d[k] === undefined ? null : d[k]; });
  fuera.diagnostico = limpiarDiagnostico(fuera.diagnostico);
  fuera.dias = Number(fuera.dias) || 0;
  fuera.nombreTipo = fuera.nombreTipo || nombreTipo(fuera.codigoTipo);
  return fuera;
}

function expedienteNuevo(d, usuario) {
  const ahora = new Date().toISOString();
  const datos = datosDelPaquete(d);
  return {
    version: 1,
    rev: 0,
    cedula: String(d.cedula),
    ...datos,
    datosOriginales: { ...datos },   // lo que mandó el colaborador, tal cual (para comparar si se corrige algo)
    autorizacionDatos: d.autorizacionDatos || null,
    estado: 'recibida',
    creado: ahora,
    actualizado: ahora,
    actualizadoPor: usuario,
    documentos: {},     // { historia: { archivo, revision: 'pendiente'|'aprobado'|'rechazado', motivo, huella, ... } }
    erp: { consecTNL: '', consecAnterior: '', registrado: null, registradoPor: '' },
    correcciones: [],   // cada vez que se le pidió corregir algo al colaborador
    envios: [],         // cada ZIP procesado
    bitacora: [],       // qué se hizo, quién y cuándo
  };
}

function anotar(expediente, usuario, accion) {
  expediente.bitacora = [...(expediente.bitacora || []), { fecha: new Date().toISOString(), usuario, accion }];
  expediente.actualizadoPor = usuario;
}

/* ==========================================================================
   5. BANDEJA: buscar los ZIP que llegaron y revisar cada uno
   ========================================================================== */

/** Nombre válido de un PDF dentro del ZIP: 1144123456_018_02_HISTORIA.pdf */
const PATRON_ARCHIVO = /^\d{5,12}_0(18|19|20|21)_\d{2}_[A-Z0-9_]+\.pdf$/;

/**
 * Busca lo que llegó: los archivos de "Recibidos" (y sus subcarpetas, sin
 * entrar a "Procesados") y los .zip sueltos en la carpeta principal (por si
 * el link de OneDrive los deja ahí).
 */
async function buscarEnRecibidos(raiz) {
  const encontrados = [];
  async function agregar(item, carpeta, ruta) {
    const archivo = await item.handle.getFile();
    encontrados.push({ id: [...ruta, item.nombre].join('/'), nombre: item.nombre, ruta, handle: item.handle, carpeta, tamano: archivo.size, fecha: archivo.lastModified });
  }
  async function recorrer(carpeta, ruta, nivel) {
    for (const item of await listar(carpeta)) {
      if (item.tipo === 'directory') {
        if (nivel === 0 && item.nombre === C.procesados) continue;
        if (nivel < 2) await recorrer(item.handle, [...ruta, item.nombre], nivel + 1);
      } else if (!item.nombre.startsWith('.') && !item.nombre.startsWith('~')) {
        await agregar(item, carpeta, ruta);
      }
    }
  }
  await recorrer(await subcarpeta(raiz, C.recibidos), [C.recibidos], 0);
  for (const item of await listar(raiz)) {
    if (item.tipo === 'file' && /\.zip$/i.test(item.nombre)) await agregar(item, raiz, ['carpeta principal']);
  }
  return encontrados.sort((a, b) => a.fecha - b.fecha); // el más antiguo primero
}

/**
 * Revisa un archivo de la bandeja. Devuelve:
 *   { tipo: 'nueva' | 'reenvio' | 'invalido', datos, zip, errores[], avisos[], archivos[], existente }
 * "errores" impiden procesarlo; "avisos" solo informan (y se repiten en la ficha).
 * "todas" = las incapacidades que ya están en el panel (para detectar reenvíos).
 */
async function analizarArchivo(item, todas) {
  const r = { tipo: 'invalido', datos: null, zip: null, errores: [], avisos: [], archivos: [], existente: null };

  if (!/\.zip$/i.test(item.nombre)) {
    r.errores.push('No es un paquete ZIP. El colaborador debe enviar el ZIP que arma la página de incapacidades.');
    return r;
  }
  try { r.zip = await JSZip.loadAsync(await item.handle.getFile()); }
  catch (e) { r.errores.push('El ZIP está dañado o no se pudo abrir. Pídele al colaborador que lo descargue y lo envíe otra vez.'); return r; }

  const json = r.zip.file('datos_incapacidad.json');
  if (!json) {
    r.errores.push(r.zip.file('datos_candidato.json')
      ? 'Este ZIP es de hojas de vida (documentos de ingreso), no de incapacidades. Muévelo a la carpeta de Hojas de vida.'
      : 'El ZIP no tiene "datos_incapacidad.json": no lo armó la página de incapacidades.');
    return r;
  }
  try { r.datos = JSON.parse(await json.async('string')); }
  catch (e) { r.errores.push('El archivo de datos de la incapacidad está dañado.'); return r; }

  const d = r.datos;
  if (!/^\d{5,12}$/.test(String(d.cedula || ''))) r.errores.push('La cédula del paquete no es válida.');
  if (!String(d.nombre || '').trim()) r.errores.push('El paquete no trae el nombre del colaborador.');
  if (!tipoPorCodigo(d.codigoTipo)) r.errores.push(`El tipo de incapacidad "${d.codigoTipo || '—'}" no existe.`);
  if (!leerFecha(d.fechaInicial)) r.errores.push('La fecha inicial no es válida.');
  if (!(Number(d.dias) >= 1)) r.errores.push('Los días de incapacidad no son válidos.');
  if (!Array.isArray(d.archivos)) d.archivos = [];

  // Solo se aceptan PDF con el nombre estándar y que de verdad estén en el ZIP
  d.archivos.forEach((a) => {
    const nombre = String(a.archivo || '');
    if (!PATRON_ARCHIVO.test(nombre)) r.avisos.push(`Se ignora "${nombre}": no tiene el nombre estándar.`);
    else if (!r.zip.file(nombre)) r.avisos.push(`Falta dentro del ZIP: ${nombreDocumento(a.documento)}.`);
    else r.archivos.push(a);
  });
  if (!r.archivos.length && !r.errores.length) r.errores.push('El paquete no trae ningún documento.');
  if (r.errores.length) return r;

  const faltan = documentosRequeridos(d).filter((id) => !r.archivos.some((a) => a.documento === id));
  if (faltan.length) r.avisos.push(`No trae: ${faltan.map(nombreDocumento).join(', ')}. Se le pedirá en la revisión.`);
  if (calcularFechaFinal(d.fechaInicial, d.dias) !== d.fechaFinal) r.avisos.push('La fecha final no cuadra con los días: revísala en la ficha.');

  // ¿Ya existe esta incapacidad (misma cédula, fecha inicial y tipo)? Entonces es un reenvío.
  r.existente = todas.find((x) => x.expediente && x.expediente.cedula === String(d.cedula)
    && x.expediente.fechaInicial === d.fechaInicial && x.expediente.codigoTipo === d.codigoTipo) || null;
  if (r.existente) {
    const estado = r.existente.expediente.estado;
    r.avisos.push(estado === 'correccion'
      ? 'Es la corrección que se le pidió: reemplaza los documentos que cambiaron y vuelve a "En revisión".'
      : `Ya existe esta incapacidad (está en "${nombreEstado(estado)}"). Se tomará como reenvío: los documentos que cambiaron vuelven a revisión.`);
  }
  r.tipo = r.existente ? 'reenvio' : 'nueva';
  return r;
}

/* ==========================================================================
   6. PROCESAR: pasar un ZIP a la carpeta de la incapacidad
   Orden pensado para no perder nada si algo falla a la mitad:
     1) guardar en "_anteriores" los PDF que se van a reemplazar,
     2) escribir los nuevos, 3) guardar incapacidad.json,
     4) solo al final mover el ZIP a Recibidos/Procesados.
   ========================================================================== */

/** Carpeta del colaborador por cédula (empieza por "1144123456_"). */
async function buscarCarpetaColaborador(raiz, cedula) {
  const carpeta = await subcarpeta(raiz, C.colaboradores);
  for (const item of await listar(carpeta)) {
    if (item.tipo === 'directory' && (item.nombre === String(cedula) || item.nombre.startsWith(`${cedula}_`))) return item.handle;
  }
  return null;
}

async function procesarZip(raiz, item, usuario, todas) {
  const analisis = await analizarArchivo(item, todas);
  if (analisis.errores.length) throw new Error(analisis.errores[0]);
  const d = analisis.datos;

  // 1) Carpeta del colaborador y de la incapacidad: 2026-11-10_018
  let carpetaColaborador = await buscarCarpetaColaborador(raiz, d.cedula);
  if (!carpetaColaborador) carpetaColaborador = await subcarpeta(await subcarpeta(raiz, C.colaboradores), `${d.cedula}_${textoParaArchivo(d.nombre, 40)}`);
  const carpeta = await subcarpeta(carpetaColaborador, `${d.fechaInicial}_${d.codigoTipo}`);

  let exp = null;
  try { exp = await leerExpediente(carpeta); } catch (e) { exp = null; }
  const esReenvio = !!exp;
  const revLeida = exp ? exp.rev : undefined;
  if (!exp) exp = expedienteNuevo(d, usuario);

  // 2) y 3) Documentos: si el PDF es idéntico al que ya estaba, se deja igual (con su revisión);
  //         si cambió, el anterior se guarda en _anteriores y el nuevo queda pendiente de revisar.
  const documentos = { ...(exp.documentos || {}) };
  let carpetaAnteriores = null;
  const cambiados = [], iguales = [];
  for (const a of analisis.archivos) {
    const blob = await analisis.zip.file(a.archivo).async('blob');
    const huella = await huellaDe(blob);
    const previo = documentos[a.documento];
    if (previo && previo.huella === huella) { iguales.push(a.documento); continue; }
    if (previo && previo.archivo && (await existe(carpeta, previo.archivo))) {
      if (!carpetaAnteriores) carpetaAnteriores = await subcarpeta(await subcarpeta(carpeta, C.anteriores), await nombreLibre(await subcarpeta(carpeta, C.anteriores), marcaDeTiempo()));
      await moverArchivo(await carpeta.getFileHandle(previo.archivo), carpeta, carpetaAnteriores);
    }
    await escribir(carpeta, a.archivo, blob);
    documentos[a.documento] = {
      archivo: a.archivo, huella, revision: 'pendiente', motivo: '',
      origen: a.origen || 'pdf', paginas: a.paginas || null, comprimido: !!a.comprimido,
      claveQuitada: !!a.claveQuitada, fotosConAdvertencia: a.fotosConAdvertencia || 0,
      recibido: new Date().toISOString(),
    };
    cambiados.push(a.documento);
  }

  // 4) Datos: en un reenvío se toman los del paquete nuevo y se anota qué cambió
  const datos = datosDelPaquete(d);
  const cambiosDatos = esReenvio ? CAMPOS_DATOS.filter((k) => String(exp[k] ?? '') !== String(datos[k] ?? '')) : [];
  exp = {
    ...exp, ...datos,
    datosOriginales: { ...datos },
    autorizacionDatos: d.autorizacionDatos || exp.autorizacionDatos,
    documentos,
    envios: [...(exp.envios || []), { zip: item.nombre, generado: d.generado || null, procesado: new Date().toISOString(), procesadoPor: usuario, archivos: analisis.archivos.map((a) => a.archivo) }],
  };
  if (esReenvio) {
    exp.rev = revLeida;
    if (exp.estado !== 'no_procede') exp.estado = 'revision';
    anotar(exp, usuario, `Llegó un reenvío: ${cambiados.length ? `cambió ${cambiados.map(nombreDocumento).join(', ')}` : 'sin documentos nuevos'}${iguales.length ? `; igual: ${iguales.map(nombreDocumento).join(', ')}` : ''}${cambiosDatos.length ? `; datos que cambiaron: ${cambiosDatos.join(', ')}` : ''}`);
  } else {
    anotar(exp, usuario, `Recibió la incapacidad con ${plural(analisis.archivos.length, 'documento', 'documentos')}`);
  }
  await guardarExpediente(carpeta, exp);

  // 5) Mover el ZIP a Recibidos/Procesados
  const procesados = await subcarpeta(await subcarpeta(raiz, C.recibidos), C.procesados);
  await moverArchivo(item.handle, item.carpeta, procesados);
  return { esReenvio, nombre: d.nombre };
}

/* ==========================================================================
   7. INCAPACIDADES: leer el listado y las revisiones automáticas
   ========================================================================== */

/** Lee todas las incapacidades: Colaboradores/<colaborador>/<incapacidad>/incapacidad.json */
async function leerIncapacidades(raiz) {
  const lista = [];
  for (const colaborador of await listar(await subcarpeta(raiz, C.colaboradores))) {
    if (colaborador.tipo !== 'directory') continue;
    for (const inc of await listar(colaborador.handle)) {
      if (inc.tipo !== 'directory' || inc.nombre.startsWith('_')) continue;
      let expediente = null, problema = null;
      try {
        expediente = await leerExpediente(inc.handle);
        if (!expediente) problema = 'Esta carpeta no tiene incapacidad.json (se creó a mano o quedó a medias).';
      } catch (e) { problema = 'El incapacidad.json está dañado.'; }
      lista.push({
        id: `${colaborador.nombre}/${inc.nombre}`,
        carpeta: inc.handle,
        ruta: `${C.colaboradores} / ${colaborador.nombre} / ${inc.nombre}`,
        expediente, problema,
        cedula: expediente ? expediente.cedula : (colaborador.nombre.match(/^\d+/) || [''])[0],
        nombre: expediente ? expediente.nombre : colaborador.nombre.replace(/^\d+_?/, '').replace(/_/g, ' '),
      });
    }
  }
  return lista;
}

/**
 * Estado de los documentos de una incapacidad, en el orden de la lista de la app:
 * [{ id, doc (o null si no llegó), requerido, estado: 'aprobado'|'rechazado'|'pendiente'|'falta' }]
 */
function documentosDe(exp) {
  const requeridos = documentosRequeridos(exp);
  const ids = [...new Set([...requeridos, ...Object.keys(exp.documentos || {})])]
    .sort((a, b) => CONFIG.documentos.findIndex((d) => d.id === a) - CONFIG.documentos.findIndex((d) => d.id === b));
  return ids.map((id) => {
    const doc = (exp.documentos || {})[id] || null;
    return { id, doc, requerido: requeridos.includes(id), estado: !doc ? 'falta' : doc.revision === 'aprobado' ? 'aprobado' : doc.revision === 'rechazado' ? 'rechazado' : 'pendiente' };
  });
}

/** Resumen para el listado y para saber qué se puede hacer. */
function resumenDocumentos(exp) {
  const docs = documentosDe(exp);
  return {
    docs,
    total: docs.length,
    aprobados: docs.filter((d) => d.estado === 'aprobado').length,
    pendientes: docs.filter((d) => d.estado === 'pendiente').length,
    conProblema: docs.filter((d) => d.estado === 'rechazado' || (d.estado === 'falta' && d.requerido)),
  };
}

/** ¿Se cruzan dos rangos de fechas? */
function seCruzan(a1, a2, b1, b2) { return a1 && a2 && b1 && b2 && a1 <= b2 && b1 <= a2; }

/**
 * Revisiones automáticas de una incapacidad. Las ve la gestora en la ficha
 * para no tener que calcular nada a mano. Cada una: { nivel: 'ok'|'aviso'|'error', texto }
 * ctx = { todas, indice (del reporte del ERP), control }
 */
function revisionesDe(exp, ctx, idPropio) {
  const r = [];
  const todas = ctx.todas;
  const tipo = tipoPorCodigo(exp.codigoTipo);
  const otras = todas.filter((x) => x.expediente && x.id !== idPropio && x.expediente.cedula === exp.cedula && x.expediente.estado !== 'no_procede');

  // Fechas y días
  const finalCalculada = calcularFechaFinal(exp.fechaInicial, exp.dias);
  if (!finalCalculada) r.push({ nivel: 'error', texto: 'La fecha inicial o los días no son válidos.' });
  else if (finalCalculada !== exp.fechaFinal) r.push({ nivel: 'error', texto: `La fecha final no cuadra: con ${plural(exp.dias, 'día', 'días')} debería terminar el ${fechaLarga(finalCalculada)}, no el ${fechaLarga(exp.fechaFinal)}.` });
  else r.push({ nivel: 'ok', texto: `Las fechas cuadran: ${plural(exp.dias, 'día', 'días')}, del ${fechaLarga(exp.fechaInicial)} al ${fechaLarga(exp.fechaFinal)}.` });

  const antiguedad = diasEntre(exp.fechaInicial, hoyTexto());
  if (antiguedad > 30) r.push({ nivel: 'aviso', texto: `Empezó hace ${antiguedad} días: revisa que todavía esté a tiempo para cobrarla.` });
  if (antiguedad < 0) r.push({ nivel: 'aviso', texto: 'La fecha inicial es en el futuro.' });

  // Diagnóstico
  if (PATRON_CIE10.test(exp.diagnostico || '')) r.push({ nivel: 'ok', texto: `Diagnóstico con formato CIE-10 (${exp.diagnostico}).` });
  else r.push({ nivel: 'error', texto: `El diagnóstico "${exp.diagnostico || 'vacío'}" no tiene formato CIE-10 (una letra y 2 o 3 números, ej. J069). Búscalo en la incapacidad y corrígelo.` });

  // Prórroga
  if (tipo && !tipo.esLicencia) {
    if (exp.prorroga) {
      const salto = diasEntre(exp.fechaFinalAnterior, exp.fechaInicial);
      if (salto === null) r.push({ nivel: 'error', texto: 'Dice que es prórroga pero no trae la fecha final de la anterior.' });
      else if (salto < 1) r.push({ nivel: 'error', texto: 'La prórroga empieza antes de que termine la anterior.' });
      else if (salto > CONFIG.diasMaximosProrroga) r.push({ nivel: 'error', texto: `Entre la anterior y esta hay ${salto} días: con más de ${CONFIG.diasMaximosProrroga} no es prórroga.` });
      else if (salto > CONFIG.diasNormalesProrroga) r.push({ nivel: 'aviso', texto: `Prórroga: empieza ${salto} días después de la anterior. Se acepta (máximo ${CONFIG.diasMaximosProrroga}), pero es raro: revisa que la fecha esté bien.` });
      else r.push({ nivel: 'ok', texto: salto === 1 ? 'Prórroga: empieza al día siguiente de la anterior.' : `Prórroga: empieza ${salto} días después de la anterior.` });

      // Cadena de prórrogas (con el reporte del ERP, el panel o lo escrito a mano)
      const c = cadenaDeIncapacidad(exp, ctx, idPropio);
      if (c.sinAnterior) {
        r.push({ nivel: 'aviso', texto: ctx.indice.hay
          ? 'No encontré la anterior ni en el reporte del ERP ni en el panel: escribe abajo el consecutivo anterior y los días que llevaba.'
          : 'No hay reporte del ERP cargado: escribe abajo el consecutivo anterior y los días que llevaba.' });
      } else if (!c.completo && c.faltaConsec) {
        r.push({ nivel: 'aviso', texto: `La cadena viene del consecutivo ${c.faltaConsec}, que no está en el histórico: escribe abajo cuántos días llevaba acumulados.` });
      }
      const nivel = nivelAlerta(c.total);
      if (nivel && c.completo) r.push({ nivel: nivel === 'a30' ? 'aviso' : 'error', texto: `Con esta prórroga la cadena llega a ${c.total} días: ${TEXTO_NIVEL[nivel].toLowerCase()}. Aparece en “Alertas 30/150”.` });
    } else {
      const pegada = otras.find((x) => diasEntre(x.expediente.fechaFinal, exp.fechaInicial) >= 1 && diasEntre(x.expediente.fechaFinal, exp.fechaInicial) <= CONFIG.diasMaximosProrroga && x.expediente.codigoTipo === exp.codigoTipo);
      if (pegada) r.push({ nivel: 'aviso', texto: `Dice que NO es prórroga, pero tiene otra que terminó el ${fechaLarga(pegada.expediente.fechaFinal)}. Revisa si debería serlo.` });
    }
  }

  // ¿Se cruza con otra incapacidad del mismo colaborador?
  otras.forEach((x) => {
    if (seCruzan(exp.fechaInicial, exp.fechaFinal, x.expediente.fechaInicial, x.expediente.fechaFinal)) {
      r.push({ nivel: 'error', texto: `Se cruza con otra incapacidad del ${fechaLarga(x.expediente.fechaInicial)} al ${fechaLarga(x.expediente.fechaFinal)} (${nombreEstado(x.expediente.estado)}). Puede estar repetida.` });
    }
  });

  if (exp.codigoTipo === '018' && exp.accidenteTransito) r.push({ nivel: 'aviso', texto: 'Fue accidente de tránsito: la paga el SOAT, debe venir el FURIPS.' });
  if (exp.codigoTipo === '019' && exp.fechaAccidente) r.push({ nivel: 'ok', texto: `Accidente de trabajo del ${fechaLarga(exp.fechaAccidente)}.` });
  if (!/^3\d{9}$/.test(String(exp.celular || ''))) r.push({ nivel: 'aviso', texto: 'No hay un celular válido: no se le podrá escribir por WhatsApp.' });
  return r;
}

/**
 * Datos que se pasan al ERP, en el orden del reporte TNL. Cada uno:
 * { id, etiqueta, valor (como se copia), editar: 'fecha'|'numero'|'texto'|'sino'|null }
 * Cuando llegue el plano del ERP se ajusta esta lista (orden, nombres y formato).
 */
function datosERP(exp, ctx, idPropio = null) {
  const tipo = tipoPorCodigo(exp.codigoTipo);
  // Mismo orden de la pantalla "Tiempos no laborados / Generales" del ERP, de arriba abajo.
  // No van: Consecutivo TNL (lo pone el ERP), horas, contrato y fecha de expedición (el ERP los llena solo).
  const lista = [
    { id: 'codigoTipo', etiqueta: 'Concepto', valor: exp.codigoTipo, extra: nombreTipo(exp.codigoTipo) },
    { id: 'fechaInicial', etiqueta: 'Fecha inicial', valor: fechaERP(exp.fechaInicial), editar: 'fecha' },
    { id: 'dias', etiqueta: 'No. días', valor: String(exp.dias || ''), editar: 'numero' },
    { id: 'fechaFinal', etiqueta: 'Fecha final', valor: fechaERP(exp.fechaFinal), extra: 'Se calcula con la fecha inicial y los días' },
    { id: 'cedula', etiqueta: 'Empleado (cédula)', valor: exp.cedula },
    { id: 'nombre', etiqueta: 'Nombre', valor: (exp.nombre || '').toUpperCase() },
    { id: 'diagnostico', etiqueta: 'Código de diagnóstico', valor: exp.diagnostico || '', editar: 'texto' },
    { id: 'clase', etiqueta: 'Clase de incapacidad', valor: (tipo || {}).clase || '' },
  ];
  if (exp.codigoTipo === '019') {
    lista.push({ id: 'fechaAccidente', etiqueta: 'Fecha de accidente', valor: leerFecha(exp.fechaAccidente) ? fechaERP(exp.fechaAccidente) : '', editar: 'fecha', vacio: 'Escríbela (está en la incapacidad o el FURAT)' });
  }
  if (tipo && !tipo.esLicencia) {
    lista.push({ id: 'prorroga', etiqueta: 'Es prórroga', valor: exp.prorroga ? 'Sí' : 'No', editar: 'sino' });
    if (exp.prorroga) {
      lista.push({ id: 'fechaFinalAnterior', etiqueta: 'Terminó la anterior', valor: fechaERP(exp.fechaFinalAnterior), editar: 'fecha' });
      // El consecutivo anterior y el total salen del bloque "¿De cuál incapacidad viene?" (más abajo en la ficha)
      const c = cadenaDeIncapacidad(exp, ctx, idPropio);
      lista.push({ id: 'consecAnterior', etiqueta: 'Consecutivo TNL anterior', valor: c.consec || '', marca: c.sugerida && c.consec ? 'Sugerido' : '', vacio: 'Elígelo abajo, en “¿De cuál incapacidad viene?”' });
      lista.push(c.completo && !c.sinAnterior
        ? { id: 'totalDias', etiqueta: 'Total días', valor: String(c.total), extra: `${c.base} días que traía la cadena + ${exp.dias} de esta. Compáralo con el que muestra el ERP.` }
        : { id: 'totalDias', etiqueta: 'Total días', valor: '', vacio: 'Faltan los días anteriores (abajo)' });
    }
  }
  return lista;
}

/* ==========================================================================
   7b. REPORTE DEL ERP, CADENAS DE PRÓRROGAS Y CONTROL
   La gestora deja en "Incapacidades/Fuentes" el reporte de tiempos no
   laborados (TNL) que exporta del ERP. El panel lo lee aquí mismo (no sale
   del computador) y con él:
     - arma las CADENAS de prórrogas (cada prórroga dice su "Consec.TNL Anterior"),
     - sugiere el consecutivo anterior de las prórrogas que llegan por la app,
     - calcula las alertas de 30 y 150 días,
     - hace la doble verificación de lo que se marcó "registrada en el ERP".
   Si no hay reporte, todo sigue funcionando: la gestora escribe a mano el
   consecutivo y los días acumulados.

   OJO: en el ERP el Consec.TNL es POR COLABORADOR Y CONTRATO (cada persona
   tiene su 1, 2, 3...). Por eso la llave es cédula + contrato + consecutivo.

   control.json (en la carpeta principal) guarda lo que NO está en el ERP:
     acumulados → días escritos a mano cuando el consecutivo anterior no está
                  en el histórico: { "31945220|7": { dias, por, fecha } }
     alertas    → qué alertas ya se gestionaron:
                  { "<cédula>|<inicio de la cadena>": { a30: {...}, previo150: {...}, a150: {...} } }
   El reporte NO se acumula: siempre se usa el más reciente de "Fuentes".
   Si lo vuelven a subir, no se duplica nada.
   ========================================================================== */
const ARCHIVO_CONTROL = 'control.json';
const controlVacio = () => ({ version: 1, rev: 0, acumulados: {}, alertas: {} });

async function leerControl(raiz) {
  try {
    if (!(await existe(raiz, ARCHIVO_CONTROL))) return controlVacio();
    const datos = JSON.parse(await (await (await raiz.getFileHandle(ARCHIVO_CONTROL)).getFile()).text());
    return { ...controlVacio(), ...datos };
  } catch (e) { console.warn('control.json dañado', e); return { ...controlVacio(), danado: true }; }
}

/** Lee el control MÁS RECIENTE, aplica el cambio y lo guarda (así no se pisa lo de otra persona). */
async function cambiarControl(raiz, modificar) {
  const actual = await leerControl(raiz);
  if (actual.danado) throw new Error('control.json está dañado: revísalo en la carpeta antes de seguir.');
  modificar(actual);
  const nuevo = { ...actual, rev: (actual.rev || 0) + 1, actualizado: new Date().toISOString() };
  await escribir(raiz, ARCHIVO_CONTROL, JSON.stringify(nuevo, null, 2));
  return nuevo;
}

/* ----- Leer el reporte ----- */

/** Nombre de columna "normalizado": "Consec.TNL Anterior" → "consectnlanterior". */
const normalizarColumna = (t) => paraBuscar(String(t || '')).replace(/[^a-z0-9]/g, '');

/** Columnas que se buscan en el reporte (se aceptan varios nombres por si el ERP cambia el título). */
const COLUMNAS_REPORTE = {
  cedula: ['cedula', 'identificacion', 'documento', 'empleado'],
  nombre: ['nombresyapellidos', 'nombre', 'nombres'],
  contrato: ['contrato', 'numerodecontrato'],
  consec: ['consectnl', 'consecutivotnl', 'consecutivo'],
  estado: ['estadotnl', 'estado'],
  concepto: ['concepto'],
  descripcion: ['descconcepto', 'descripcionconcepto'],
  fechaInicial: ['fechainicial'],
  fechaFinal: ['fechafinal'],
  dias: ['nrodias', 'nodias', 'dias', 'numerodedias'],
  clase: ['clasedeincapacidad'],
  prorroga: ['esprorroga'],
  anterior: ['consectnlanterior', 'consecutivotnlanterior'],
};
const COLUMNAS_OBLIGATORIAS = ['cedula', 'consec', 'concepto', 'fechaInicial', 'fechaFinal', 'dias'];

/** Fecha de una celda: número de Excel, Date o texto ("31/10/2026", "2026-10-31"). Devuelve "aaaa-mm-dd" o ''. */
function fechaDeCelda(v) {
  if (v === null || v === undefined || v === '') return '';
  if (typeof v === 'number') {             // número de serie de Excel (días desde 1899-12-30)
    const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * MS_POR_DIA);
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
  }
  if (v instanceof Date) return fechaATexto(v);
  const t = String(v).trim();
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(t);
  if (m) return leerFecha(`${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`) ? `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}` : '';
  m = /^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})/.exec(t);   // en Colombia: día/mes/año
  if (m) { const x = `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; return leerFecha(x) ? x : ''; }
  return '';
}

/** Días: "3.00", "3,00", 3 → 3. (Sin el truco de dividir por 100 del Excel viejo.) */
function numeroDeCelda(v) {
  if (typeof v === 'number') return v;
  let t = String(v || '').trim();
  if (t.includes(',') && !t.includes('.')) t = t.replace(',', '.');
  else t = t.replace(/,/g, '');
  const n = parseFloat(t);
  return Number.isFinite(n) ? n : NaN;
}

/** Texto de una llave: cédula sin puntos, consecutivo sin decimales. */
const textoLlave = (v) => String(v ?? '').trim().replace(/\.0+$/, '').replace(/[^\dA-Za-z]/g, '');

/**
 * Lee el reporte más reciente de la carpeta Fuentes.
 * Devuelve null si no hay, o { archivo, modificado, filas[], ignoradas, errores[], avisos[], totalFilas }.
 * Cada fila: { clave, cedula, nombre, contrato, consec, estado, concepto, descripcion, fechaInicial, fechaFinal, dias, clase, prorroga, anterior }
 */
async function leerReporte(raiz, cache) {
  const fuentes = await subcarpeta(raiz, C.fuentes);
  const archivos = [];
  for (const item of await listar(fuentes)) {
    if (item.tipo === 'file' && /\.(xlsx|xlsm|xls|csv)$/i.test(item.nombre) && !item.nombre.startsWith('~$')) {
      const f = await item.handle.getFile();
      archivos.push({ nombre: item.nombre, archivo: f });
    }
  }
  if (!archivos.length) return null;
  archivos.sort((a, b) => b.archivo.lastModified - a.archivo.lastModified);
  // En Fuentes también está el MAESTRO de personal: se usa el archivo más reciente que SÍ sea reporte de TNL.
  for (const elegido of archivos) {
    const clave = `${elegido.nombre}|${elegido.archivo.lastModified}`;
    if (NO_SON_REPORTE.has(clave)) continue;
    // Si es el mismo archivo de la vez pasada, no se vuelve a leer (17.000 filas tardan un par de segundos)
    if (cache && cache.archivo === elegido.nombre && cache.modificado === elegido.archivo.lastModified) return cache;
    const r = await leerUnReporte(elegido, archivos.length - 1);
    if (r.noEsReporte) { NO_SON_REPORTE.add(clave); continue; }
    return r;
  }
  return { archivo: archivos[0].nombre, modificado: archivos[0].archivo.lastModified, otros: archivos.length - 1, filas: [], ignoradas: 0, avisos: [], totalFilas: 0,
           errores: [`En "${C.fuentes}" no hay un reporte de TNL: ningún archivo tiene las columnas ${COLUMNAS_OBLIGATORIAS.map((c) => COLUMNAS_REPORTE[c][0]).join(', ')}.`] };
}

/** Archivos de Fuentes que ya se sabe que NO son reporte de TNL (por ejemplo, el maestro). Llave: nombre|fecha. */
const NO_SON_REPORTE = new Set();

/** Lee UN archivo como reporte de TNL. Si no tiene sus columnas, devuelve { noEsReporte: true }. */
async function leerUnReporte(elegido, otros) {
  const r = { archivo: elegido.nombre, modificado: elegido.archivo.lastModified, otros, filas: [], ignoradas: 0, errores: [], avisos: [], totalFilas: 0 };
  let libro;
  try { libro = XLSX.read(await elegido.archivo.arrayBuffer(), { type: 'array', cellDates: false }); }
  catch (e) { r.errores.push(`No se pudo abrir "${elegido.nombre}": ${e.message}`); return r; }

  // Busca la hoja y la fila de títulos (en las primeras 15 filas) que tenga las columnas del reporte
  let tabla = null, mapa = null, filaTitulos = 0;
  for (const nombreHoja of libro.SheetNames) {
    const filas = XLSX.utils.sheet_to_json(libro.Sheets[nombreHoja], { header: 1, raw: true, defval: '' });
    for (let i = 0; i < Math.min(15, filas.length); i++) {
      const titulos = filas[i].map(normalizarColumna);
      const m = {};
      Object.entries(COLUMNAS_REPORTE).forEach(([campo, nombres]) => {
        const j = titulos.findIndex((t) => nombres.includes(t));
        if (j >= 0) m[campo] = j;
      });
      if (COLUMNAS_OBLIGATORIAS.every((c) => m[c] !== undefined)) { tabla = filas; mapa = m; filaTitulos = i; break; }
    }
    if (tabla) break;
  }
  if (!tabla) { r.noEsReporte = true; return r; }
  if (mapa.contrato === undefined) r.avisos.push('El reporte no trae la columna "Contrato": se asume un solo contrato por colaborador.');
  if (mapa.anterior === undefined) r.avisos.push('El reporte no trae "Consec.TNL Anterior": no se pueden armar las cadenas de prórrogas.');

  const celda = (fila, campo) => (mapa[campo] === undefined ? '' : fila[mapa[campo]]);
  for (let i = filaTitulos + 1; i < tabla.length; i++) {
    const f = tabla[i];
    if (!f || f.every((v) => v === '' || v === null)) continue;
    r.totalFilas++;
    const concepto = textoLlave(celda(f, 'concepto')).padStart(3, '0');
    if (!CONFIG.conceptosIncapacidad.includes(concepto)) continue;   // vacaciones, permisos...: no cuentan
    const fila = {
      cedula: textoLlave(celda(f, 'cedula')),
      nombre: String(celda(f, 'nombre') || '').replace(/\s+/g, ' ').trim(),
      contrato: textoLlave(celda(f, 'contrato')) || '1',
      consec: textoLlave(celda(f, 'consec')),
      estado: String(celda(f, 'estado') || '').trim(),
      concepto,
      descripcion: String(celda(f, 'descripcion') || '').trim(),
      fechaInicial: fechaDeCelda(celda(f, 'fechaInicial')),
      fechaFinal: fechaDeCelda(celda(f, 'fechaFinal')),
      dias: Math.round(numeroDeCelda(celda(f, 'dias'))),
      clase: String(celda(f, 'clase') || '').trim(),
      prorroga: /^s/i.test(String(celda(f, 'prorroga') || '').trim()),
      anterior: textoLlave(celda(f, 'anterior')),
    };
    if (!fila.cedula || !fila.consec || !fila.fechaInicial || !fila.fechaFinal || !Number.isFinite(fila.dias)) { r.ignoradas++; continue; }
    fila.clave = `${fila.cedula}|${fila.contrato}|${fila.consec}`;
    r.filas.push(fila);
  }
  if (r.ignoradas) r.avisos.push(`${plural(r.ignoradas, 'fila de incapacidad se ignoró', 'filas de incapacidad se ignoraron')} por tener la cédula, el consecutivo, las fechas o los días vacíos o raros.`);
  if (!r.filas.length) r.errores.push('El reporte no tiene incapacidades (conceptos 018, 019, 020, 021 o 042).');
  r.desde = r.filas.reduce((m, f) => (!m || f.fechaInicial < m ? f.fechaInicial : m), '');
  r.hasta = r.filas.reduce((m, f) => (f.fechaFinal > m ? f.fechaFinal : m), '');
  return r;
}

/* ----- Cadenas de prórrogas ----- */

/**
 * Arma el índice del reporte y una función que calcula la cadena de cualquier fila.
 * cadenaDe(fila) → { total, inicio, eslabones, completo, faltaConsec, raiz }
 *   total      → días de toda la cadena hasta esa fila (incluida)
 *   inicio     → fecha inicial de la primera incapacidad de la cadena
 *   completo   → false si una prórroga apunta a un consecutivo que no está en el reporte
 *                y nadie escribió a mano sus días acumulados (faltaConsec dice cuál)
 */
function indexarReporte(reporte, control) {
  const porClave = new Map(), porCedula = new Map(), referenciadas = new Set();
  const filas = (reporte && reporte.filas) || [];
  filas.forEach((f) => {
    porClave.set(f.clave, f);
    if (!porCedula.has(f.cedula)) porCedula.set(f.cedula, []);
    porCedula.get(f.cedula).push(f);
    if (f.prorroga && f.anterior) referenciadas.add(`${f.cedula}|${f.contrato}|${f.anterior}`);
  });
  porCedula.forEach((l) => l.sort((a, b) => b.fechaInicial.localeCompare(a.fechaInicial)));
  const acumulados = (control && control.acumulados) || {};
  const memo = new Map();

  function cadenaDe(f, profundidad = 0) {
    if (memo.has(f.clave)) return memo.get(f.clave) || { total: f.dias, inicio: f.fechaInicial, eslabones: 1, completo: false, raiz: `${f.cedula}|${f.fechaInicial}` };
    memo.set(f.clave, null);                         // marca "en cálculo" (protege de ciclos raros)
    let r;
    if (f.prorroga && f.anterior && profundidad < 500) {
      const anterior = porClave.get(`${f.cedula}|${f.contrato}|${f.anterior}`);
      const manual = acumulados[`${f.cedula}|${f.anterior}`];
      if (anterior && anterior !== f) {
        const a = cadenaDe(anterior, profundidad + 1);
        r = { ...a, total: a.total + f.dias, eslabones: a.eslabones + 1 };
      } else if (manual) {
        r = { total: manual.dias + f.dias, inicio: null, eslabones: 2, completo: true, manual: true, raiz: `${f.cedula}|m${f.anterior}` };
      } else {
        r = { total: f.dias, inicio: f.fechaInicial, eslabones: 1, completo: false, faltaConsec: f.anterior, raiz: `${f.cedula}|m${f.anterior}` };
      }
    } else {
      r = { total: f.dias, inicio: f.fechaInicial, eslabones: 1, completo: true, raiz: `${f.cedula}|${f.fechaInicial}` };
    }
    memo.set(f.clave, r);
    return r;
  }

  return {
    hay: filas.length > 0,
    porClave, porCedula, referenciadas, acumulados, cadenaDe,
    /** Filas de un colaborador (más reciente primero). */
    deCedula: (cedula) => porCedula.get(String(cedula)) || [],
    /** Busca por cédula + consecutivo (el contrato puede no saberse). */
    buscar: (cedula, consec, contrato) => {
      const l = (porCedula.get(String(cedula)) || []).filter((f) => f.consec === String(consec));
      return (contrato && l.find((f) => f.contrato === String(contrato))) || l.sort((a, b) => Number(b.contrato) - Number(a.contrato))[0] || null;
    },
    /** Una fila es el final de su cadena si ninguna otra la nombra como anterior. */
    esFinal: (f) => !referenciadas.has(f.clave),
  };
}

/**
 * Sugiere de cuál incapacidad viene una prórroga que llegó por la app.
 * Busca en el reporte del ERP y en el panel: misma cédula, que haya terminado
 * entre 1 y CONFIG.diasMaximosProrroga (30) días antes; prefiere la que termina justo en
 * "terminó la anterior" y, si no, la más cercana.
 * Devuelve { fuente: 'reporte', fila } | { fuente: 'panel', item } | null
 */
function sugerirAnterior(exp, ctx, idPropio) {
  const dentro = (fin) => { const s = diasEntre(fin, exp.fechaInicial); return s !== null && s >= 1 && s <= CONFIG.diasMaximosProrroga; };
  const candidatas = [];
  ctx.indice.deCedula(exp.cedula).forEach((f) => {
    if (dentro(f.fechaFinal)) candidatas.push({ fuente: 'reporte', fila: f, fin: f.fechaFinal });
  });
  ctx.todas.forEach((x) => {
    const e = x.expediente;
    if (!e || x.id === idPropio || e.cedula !== exp.cedula || e.estado === 'no_procede' || !dentro(e.fechaFinal)) return;
    if (e.erp && e.erp.consecTNL && ctx.indice.buscar(e.cedula, e.erp.consecTNL)) return;   // ya está en el reporte
    candidatas.push({ fuente: 'panel', item: x, fin: e.fechaFinal });
  });
  if (!candidatas.length) return null;
  candidatas.sort((a, b) => (b.fin === exp.fechaFinalAnterior) - (a.fin === exp.fechaFinalAnterior)
    || diasEntre(a.fin, exp.fechaInicial) - diasEntre(b.fin, exp.fechaInicial)
    || (a.fuente === 'reporte' ? -1 : 1));
  return candidatas[0];
}

/**
 * Cadena completa de una incapacidad del panel (esta + todas sus anteriores).
 * Usa, en este orden: lo que la gestora eligió/escribió (exp.erp.anterior), o la sugerencia.
 * Devuelve { total, base, inicio, eslabones, completo, modo, consec, faltaConsec, fila, item, sugerida, raiz, texto }
 */
function cadenaDeIncapacidad(exp, ctx, idPropio, profundidad = 0) {
  const dias = Number(exp.dias) || 0;
  const solo = { total: dias, base: 0, inicio: exp.fechaInicial, eslabones: 1, completo: true, modo: null, raiz: `${exp.cedula}|${exp.fechaInicial}` };
  const tipo = tipoPorCodigo(exp.codigoTipo);
  if (!exp.prorroga || (tipo && tipo.esLicencia)) return solo;

  const elegido = (exp.erp || {}).anterior;
  const conBase = (base, extra) => ({ ...extra, base: base.total, total: base.total + dias, inicio: base.inicio, eslabones: base.eslabones + 1, completo: base.completo, faltaConsec: base.faltaConsec, raiz: base.raiz });

  if (elegido && elegido.consec) {
    const fila = ctx.indice.buscar(exp.cedula, elegido.consec, elegido.contrato);
    if (fila) return conBase(ctx.indice.cadenaDe(fila), { modo: elegido.modo, consec: fila.consec, fila });
    // No está en el reporte: ¿está en el panel con ese consecutivo?
    const enPanel = ctx.todas.find((x) => x.expediente && x.id !== idPropio && x.expediente.cedula === exp.cedula && (x.expediente.erp || {}).consecTNL === String(elegido.consec));
    if (enPanel && profundidad < 50) return conBase(cadenaDeIncapacidad(enPanel.expediente, ctx, enPanel.id, profundidad + 1), { modo: elegido.modo, consec: elegido.consec, item: enPanel });
    const manual = ctx.indice.acumulados[`${exp.cedula}|${elegido.consec}`];
    const diasManual = manual ? manual.dias : elegido.diasAcumulados;
    if (Number.isFinite(diasManual)) {
      return { modo: 'manual', consec: elegido.consec, base: diasManual, total: diasManual + dias, inicio: null, eslabones: 2, completo: true, manual: manual || { dias: diasManual }, raiz: `${exp.cedula}|m${elegido.consec}` };
    }
    return { ...solo, modo: elegido.modo, consec: elegido.consec, completo: false, faltaConsec: elegido.consec, raiz: `${exp.cedula}|m${elegido.consec}` };
  }

  const s = sugerirAnterior(exp, ctx, idPropio);
  if (s && s.fuente === 'reporte') return conBase(ctx.indice.cadenaDe(s.fila), { modo: null, sugerida: true, consec: s.fila.consec, fila: s.fila });
  if (s && s.fuente === 'panel' && profundidad < 50) {
    const e = s.item.expediente;
    return conBase(cadenaDeIncapacidad(e, ctx, s.item.id, profundidad + 1), { modo: null, sugerida: true, consec: (e.erp || {}).consecTNL || '', item: s.item });
  }
  return { ...solo, completo: false, sinAnterior: true };
}

/** Nivel de alerta según los días de la cadena: 'a150' | 'previo150' | 'a30' | null */
function nivelAlerta(total) {
  const a = CONFIG.alertas;
  if (total >= a.umbral150) return 'a150';
  if (total >= a.avisoPrevio150) return 'previo150';
  if (total >= a.umbral30) return 'a30';
  return null;
}
const TEXTO_NIVEL = { a30: 'Pasó 30 días', previo150: 'Se acerca a 150', a150: 'Pasó 150 días' };

/**
 * Lista de alertas: cadenas de prórrogas que pasan los umbrales y siguen activas.
 * Junta el reporte del ERP con lo que está en el panel y todavía no sale en el reporte.
 */
function calcularAlertas(ctx) {
  const hoy = hoyTexto();
  const activa = (fin) => diasEntre(fin, hoy) <= CONFIG.alertas.diasActiva;
  const reemplazadas = new Set();   // finales del reporte que ya siguen en el panel
  const alertas = [];

  // 1) Lo del panel que todavía no está en el reporte
  ctx.todas.forEach((x) => {
    const e = x.expediente;
    if (!e || e.estado === 'no_procede' || (tipoPorCodigo(e.codigoTipo) || {}).esLicencia) return;   // las licencias no son alertas
    if (e.erp && e.erp.consecTNL && ctx.indice.buscar(e.cedula, e.erp.consecTNL)) return;
    const c = cadenaDeIncapacidad(e, ctx, x.id);
    if (c.fila) reemplazadas.add(c.fila.clave);
    if (c.item) reemplazadas.add(`panel:${c.item.id}`);
    alertas.push({ x, c, fin: e.fechaFinal, cedula: e.cedula, nombre: e.nombre, fuente: 'panel' });
  });
  // 2) Finales de cadena del reporte
  ctx.indice.porClave.forEach((f) => {
    if (!ctx.indice.esFinal(f) || reemplazadas.has(f.clave) || (tipoPorCodigo(f.concepto) || {}).esLicencia) return;
    const c = ctx.indice.cadenaDe(f);
    if (c.total < CONFIG.alertas.umbral30) return;
    alertas.push({ fila: f, c, fin: f.fechaFinal, cedula: f.cedula, nombre: f.nombre, fuente: 'reporte' });
  });

  return alertas
    .filter((a) => !reemplazadas.has(`panel:${a.x && a.x.id}`) && a.c.total >= CONFIG.alertas.umbral30 && activa(a.fin))
    .map((a) => {
      const nivel = nivelAlerta(a.c.total);
      const id = idAlerta(a.c.raiz, nivel);
      const envio = (ctx.envios || {})[id] || null;                                   // archivo en Alertas/Pendientes, Enviadas o Errores
      const descartada = ((ctx.control.alertas || {})[a.c.raiz] || {})[nivel] || null; // "no se envía" (con motivo)
      const estado = envio ? envio.estado : descartada ? 'descartada' : 'sin_enviar';
      return { ...a, nivel, id, envio, descartada, estado, clave: a.c.raiz };
    })
    .sort((a, b) => ORDEN_ESTADO_ALERTA[a.estado] - ORDEN_ESTADO_ALERTA[b.estado] || b.c.total - a.c.total);
}

/* ----- Envío de alertas por Power Automate -----
   El panel NO envía correos. Cuando la gestora revisa los días y toca "Enviar alerta",
   el panel crea un archivo JSON en  Alertas/Pendientes/<id>.json.
   Power Automate ("cuando se crea un archivo" en esa carpeta) lo lee, manda el correo de
   30 o de 150 días, y deja el archivo en Alertas/Enviadas (o en Alertas/Errores si falló),
   agregándole { estado, enviado, destinatarios, error }. El panel lee esas carpetas para
   mostrar en qué va cada alerta. El nombre del archivo es único (cédula + inicio de la
   cadena + nivel): la misma alerta nunca se envía dos veces. */
const ORDEN_ESTADO_ALERTA = { error: 0, sin_enviar: 1, cola: 2, enviada: 3, descartada: 4 };
const ESTADOS_COLA = { cola: C.alertasPendientes, enviada: C.alertasEnviadas, error: C.alertasErrores };

/** Id de la alerta, sirve de nombre de archivo: "31945220_2026-09-27_a30" (o "..._m7_..." si la cadena viene de un consecutivo escrito a mano). */
function idAlerta(raizCadena, nivel) {
  return `${raizCadena.replace('|', '_').replace(/[^0-9A-Za-z_-]/g, '')}_${nivel}`;
}

/** Lee las tres carpetas de alertas: { [id]: { estado: 'cola'|'enviada'|'error', datos, archivo, fecha } } */
async function leerEnviosAlertas(raiz) {
  const envios = {};
  const alertas = await subcarpeta(raiz, C.alertas);
  for (const [estado, nombreCarpeta] of Object.entries(ESTADOS_COLA)) {
    const carpeta = await subcarpeta(alertas, nombreCarpeta);
    for (const item of await listar(carpeta)) {
      if (item.tipo !== 'file' || !/\.json$/i.test(item.nombre)) continue;
      const archivo = await item.handle.getFile();
      let datos = null;
      try { datos = JSON.parse(await archivo.text()); } catch (e) { datos = { dañado: true }; }
      const id = item.nombre.replace(/\.json$/i, '');
      // Si por algo quedó en dos carpetas, gana la más avanzada (enviada > error > cola)
      const previo = envios[id];
      const peso = { cola: 1, error: 2, enviada: 3 };
      if (!previo || peso[estado] > peso[previo.estado]) envios[id] = { estado, datos, archivo: item.nombre, fecha: archivo.lastModified };
    }
  }
  return envios;
}

/**
 * Lista de incapacidades de la cadena (de la más reciente a la primera), para el JSON y la revisión.
 * Cada una: { consec, concepto, fechaInicial, fechaFinal, dias, fuente: 'ERP'|'panel'|'manual' }
 */
function incapacidadesDeLaCadena(a, ctx) {
  const lista = [];
  const desdeReporte = (fila) => {
    let f = fila, n = 0;
    while (f && n++ < 300) {
      lista.push({ consec: f.consec, concepto: f.concepto, fechaInicial: f.fechaInicial, fechaFinal: f.fechaFinal, dias: f.dias, fuente: 'ERP' });
      if (!(f.prorroga && f.anterior)) return;
      const sig = ctx.indice.porClave.get(`${f.cedula}|${f.contrato}|${f.anterior}`);
      if (!sig || sig === f) {
        const m = ctx.indice.acumulados[`${f.cedula}|${f.anterior}`];
        lista.push({ consec: f.anterior, dias: m ? m.dias : null, fuente: 'manual' });
        return;
      }
      f = sig;
    }
  };
  const desdePanel = (x, n = 0) => {
    const e = x.expediente;
    lista.push({ consec: (e.erp || {}).consecTNL || '', concepto: e.codigoTipo, fechaInicial: e.fechaInicial, fechaFinal: e.fechaFinal, dias: Number(e.dias), fuente: 'panel' });
    const c = cadenaDeIncapacidad(e, ctx, x.id);
    if (c.fila) desdeReporte(c.fila);
    else if (c.item && n < 50) desdePanel(c.item, n + 1);
    else if (c.modo === 'manual' || c.manual) lista.push({ consec: c.consec, dias: c.base, fuente: 'manual' });
  };
  if (a.x) desdePanel(a.x); else desdeReporte(a.fila);
  return lista;
}

/** Contenido del JSON de la alerta (lo que lee Power Automate). Sin diagnóstico: el correo no debe llevar datos de salud. */
function datosDeAlerta(a, ctx, usuario, nota) {
  const delPanel = ctx.todas.find((x) => x.expediente && x.expediente.cedula === a.cedula);
  return {
    version: 1,
    id: a.id,
    tipo: a.nivel,                                   // a30 | previo150 | a150
    tipoTexto: TEXTO_NIVEL[a.nivel],
    cedula: a.cedula,
    nombre: nombreBonito(a.nombre),
    sede: delPanel ? delPanel.expediente.sede : '',
    diasCadena: a.c.total,
    cadenaCompleta: !!a.c.completo,
    inicioCadena: a.c.inicio || '',
    finUltima: a.fin,
    incapacidades: incapacidadesDeLaCadena(a, ctx),
    nota: nota || '',
    creado: new Date().toISOString(),
    creadoPor: usuario,
    estado: 'pendiente',
  };
}

/** Crea el JSON en Alertas/Pendientes (si ya existe en cualquier carpeta, no lo duplica). */
async function crearArchivoAlerta(raiz, datos) {
  const envios = await leerEnviosAlertas(raiz);
  if (envios[datos.id]) throw new Error('Esta alerta ya se había enviado.');
  const pendientes = await subcarpeta(await subcarpeta(raiz, C.alertas), C.alertasPendientes);
  await escribir(pendientes, `${datos.id}.json`, JSON.stringify(datos, null, 2));
}

/** Quita una alerta de la cola (solo mientras Power Automate no la haya tomado). */
async function cancelarArchivoAlerta(raiz, id) {
  const pendientes = await subcarpeta(await subcarpeta(raiz, C.alertas), C.alertasPendientes);
  await pendientes.removeEntry(`${id}.json`);
}

/** Vuelve a poner en la cola una alerta que falló (la saca de Errores). */
async function reintentarArchivoAlerta(raiz, id, usuario) {
  const alertas = await subcarpeta(raiz, C.alertas);
  const errores = await subcarpeta(alertas, C.alertasErrores);
  const handle = await errores.getFileHandle(`${id}.json`);
  const datos = JSON.parse(await (await handle.getFile()).text());
  const limpio = { ...datos, estado: 'pendiente', error: undefined, reintento: { fecha: new Date().toISOString(), por: usuario, errorAnterior: datos.error || '' } };
  await escribir(await subcarpeta(alertas, C.alertasPendientes), `${id}.json`, JSON.stringify(limpio, null, 2));
  await errores.removeEntry(`${id}.json`);
}

/**
 * Doble verificación: lo que el panel marcó "registrada" contra el reporte del ERP.
 * Devuelve { confirmadas[], diferencias[], noAparecen[], pendientesDeReporte[] }
 */
function verificarContraReporte(ctx, reporte) {
  const r = { confirmadas: [], diferencias: [], noAparecen: [], pendientesDeReporte: [] };
  if (!ctx.indice.hay) return r;
  const fechaReporte = fechaATexto(new Date(reporte.modificado));
  ctx.todas.forEach((x) => {
    const e = x.expediente;
    if (!e || e.estado !== 'registrada' || !e.erp || !e.erp.consecTNL) return;
    const f = ctx.indice.buscar(e.cedula, e.erp.consecTNL);
    if (!f) {
      // Si se registró después de exportar el reporte, es normal que no esté
      if (e.erp.registrado && fechaATexto(new Date(e.erp.registrado)) >= fechaReporte) r.pendientesDeReporte.push({ x });
      else r.noAparecen.push({ x });
      return;
    }
    const cambios = [];
    const comparar = (que, panel, erp) => { if (String(panel ?? '') !== String(erp ?? '')) cambios.push({ que, panel, erp }); };
    comparar('Concepto', e.codigoTipo, f.concepto);
    comparar('Fecha inicial', fechaERP(e.fechaInicial), fechaERP(f.fechaInicial));
    comparar('Fecha final', fechaERP(e.fechaFinal), fechaERP(f.fechaFinal));
    comparar('No. días', e.dias, f.dias);
    comparar('Es prórroga', e.prorroga ? 'Sí' : 'No', f.prorroga ? 'Sí' : 'No');
    if (e.prorroga && e.erp.consecAnterior) comparar('Consec. anterior', e.erp.consecAnterior, f.anterior);
    (cambios.length ? r.diferencias : r.confirmadas).push({ x, fila: f, cambios });
  });
  return r;
}

/* ==========================================================================
   7c. MAESTRO DE PERSONAL Y RADICACIÓN ANTE LA EPS / ARL
   El MAESTRO de personal se deja en "Fuentes" (se actualiza cada viernes).
   De ahí sale la EPS y la ARL de cada colaborador (cruzando por cédula, como TEXTO).
   Después de registrar en el ERP, cada incapacidad se radica ante su entidad:
     - accidente de trabajo (019) → ARL; las demás → EPS.
   Lo de la radicación se guarda en incapacidad.json → "radicacion":
     { estado: (vacío = por radicar) | 'radicada' | 'aprobada' | 'rechazada' | 'nomina',
       entidad: { tipo, nombre } (solo si la gestora la escribió a mano),
       numero, fecha, por            → el radicado que dio el portal de la EPS
       respuesta: { fecha, por, causa }
       solicitud: { fecha, por, limite } → cuándo se le pidieron los documentos al colaborador
       nomina: { fecha, por }        → reportada a nómina como falta injustificada
       intentos: [ ... ]             → radicaciones anteriores que fueron rechazadas }
   ========================================================================== */

/**
 * Columnas que se buscan en el maestro (se aceptan varios nombres).
 * El maestro del ERP (NomProConContratosGrid) trae: Tipo identificación, EMPLEADO (= la cédula), Nombres,
 * Apellido 1, Apellido 2, Descripcion del cargo, Email del contacto, Telefono del contacto, Descripcion C.O. (sede),
 * Id eps, DESCRIPCION EPS, Id ARL, DESCRIPCION ARL, pensión y Fecha retiro.
 */
const esColumnaCedula = (t) => !/^tipo/.test(t) && (['cedula', 'empleado', 'codigoempleado', 'codigodelempleado', 'numerocedula', 'cedulaempleado', 'identificacion',
  'numeroidentificacion', 'nroidentificacion', 'documento', 'numerodocumento', 'nrodocumento', 'nodocumento', 'numdocumento', 'documentoidentidad', 'cc'].includes(t)
  || /^(cedula|identificacion|nrodoc|numerodedocumento)/.test(t));
const esColumnaEPS = (t) => t === 'eps' || /eps|entidadpromotora|entidaddesalud|saludentidad/.test(t);
const esColumnaARL = (t) => t === 'arl' || /arl|riesgoslaborales|riesgosprofesionales/.test(t);
const esColumnaNombre = (t) => /^(nombre|nombrecompleto|nombresyapellidos|nombreempleado|nombredelempleado)$/.test(t);
const esColumnaNombres = (t) => t === 'nombres';
const esColumnaApellido1 = (t) => /^(apellido1|primerapellido|apellido)$/.test(t);
const esColumnaApellido2 = (t) => /^(apellido2|segundoapellido)$/.test(t);
const esColumnaTelefono = (t) => /telefono|celular|movil/.test(t);
const esColumnaCorreo = (t) => /email|correo|mail/.test(t);
const esColumnaSede = (t) => /^(sede|descripcionco|centrodeoperacion|centrooperacion|co)$/.test(t);
const esColumnaRetiro = (t) => /retiro/.test(t);
/**
 * Entre varias columnas que sirven, prefiere la del NOMBRE de la entidad ("Descripcion eps"),
 * no la del código o el NIT ("Id eps").
 */
function mejorColumna(titulos, sirve) {
  const opciones = titulos.map((t, j) => ({ t, j })).filter((o) => sirve(o.t));
  if (!opciones.length) return undefined;
  const nombre = opciones.find((o) => !/^(id|cod|nit|numero|nro)|(id|cod|nit)$/.test(o.t));
  return (nombre || opciones[0]).j;
}

/** Archivos de Fuentes que ya se sabe que NO son maestro (por ejemplo, el reporte de TNL). */
const NO_SON_MAESTRO = new Set();

/**
 * Lee el maestro más reciente de Fuentes (el archivo que tenga cédula + EPS).
 * Devuelve null si no hay, o { archivo, modificado, porCedula: Map(cedula → { eps, arl, nombre }), total, sinEPS, columnas, avisos[] }.
 */
async function leerMaestro(raiz, cache) {
  const fuentes = await subcarpeta(raiz, C.fuentes);
  const archivos = [];
  for (const item of await listar(fuentes)) {
    if (item.tipo === 'file' && /\.(xlsx|xlsm|xls|csv)$/i.test(item.nombre) && !item.nombre.startsWith('~$')) {
      archivos.push({ nombre: item.nombre, archivo: await item.handle.getFile() });
    }
  }
  archivos.sort((a, b) => b.archivo.lastModified - a.archivo.lastModified);
  for (const elegido of archivos) {
    const clave = `${elegido.nombre}|${elegido.archivo.lastModified}`;
    if (NO_SON_MAESTRO.has(clave)) continue;
    if (cache && cache.archivo === elegido.nombre && cache.modificado === elegido.archivo.lastModified) return cache;
    let libro;
    try { libro = XLSX.read(await elegido.archivo.arrayBuffer(), { type: 'array', cellDates: false }); }
    catch (e) { NO_SON_MAESTRO.add(clave); continue; }
    for (const nombreHoja of libro.SheetNames) {
      const filas = XLSX.utils.sheet_to_json(libro.Sheets[nombreHoja], { header: 1, raw: true, defval: '' });
      for (let i = 0; i < Math.min(15, filas.length); i++) {
        const titulos = filas[i].map(normalizarColumna);
        const col = { cedula: mejorColumna(titulos, esColumnaCedula), eps: mejorColumna(titulos, esColumnaEPS), arl: mejorColumna(titulos, esColumnaARL),
                      nombre: mejorColumna(titulos, esColumnaNombre), nombres: mejorColumna(titulos, esColumnaNombres),
                      apellido1: mejorColumna(titulos, esColumnaApellido1), apellido2: mejorColumna(titulos, esColumnaApellido2),
                      telefono: mejorColumna(titulos, esColumnaTelefono), correo: mejorColumna(titulos, esColumnaCorreo),
                      sede: mejorColumna(titulos, esColumnaSede), retiro: mejorColumna(titulos, esColumnaRetiro) };
        if (col.cedula === undefined || col.eps === undefined) continue;
        const porCedula = new Map();
        const texto = (f, c) => (col[c] === undefined ? '' : String(f[col[c]] ?? '').replace(/\s+/g, ' ').trim().toUpperCase());
        let retirados = 0;
        for (let k = i + 1; k < filas.length; k++) {
          const cedula = textoLlave(filas[k][col.cedula]);
          if (!cedula) continue;
          // El nombre viene en una columna, o en Nombres + Apellido 1 + Apellido 2
          const nombre = texto(filas[k], 'nombre') || [texto(filas[k], 'nombres'), texto(filas[k], 'apellido1'), texto(filas[k], 'apellido2')].filter(Boolean).join(' ');
          const retiro = col.retiro !== undefined && String(filas[k][col.retiro] ?? '').trim() !== '';
          if (retiro) retirados++;
          const previo = porCedula.get(cedula);
          if (previo && !previo.retiro && retiro) continue;    // si tiene dos contratos, gana el activo
          porCedula.set(cedula, { eps: texto(filas[k], 'eps'), arl: texto(filas[k], 'arl'), nombre,
                                  telefono: textoLlave(filas[k][col.telefono] ?? ''), correo: String(col.correo === undefined ? '' : filas[k][col.correo] ?? '').trim(),
                                  sede: texto(filas[k], 'sede'), retiro });
        }
        const r = { archivo: elegido.nombre, modificado: elegido.archivo.lastModified, porCedula, total: porCedula.size,
                    sinEPS: [...porCedula.values()].filter((v) => !v.eps).length, avisos: [],
                    columnas: { cedula: filas[i][col.cedula], eps: filas[i][col.eps], arl: col.arl === undefined ? '' : filas[i][col.arl],
                                telefono: col.telefono === undefined ? '' : filas[i][col.telefono] } };
        if (col.arl === undefined) r.avisos.push('El maestro no trae una columna de ARL: los accidentes de trabajo saldrán "sin ARL".');
        if (retirados) r.avisos.push(`${plural(retirados, 'persona tiene', 'personas tienen')} fecha de retiro.`);
        return r;
      }
    }
    NO_SON_MAESTRO.add(clave);
  }
  return null;
}

/** Días que tiene el maestro (por la fecha del archivo). */
const diasDelMaestro = (m) => (m ? Math.floor((Date.now() - m.modificado) / MS_POR_DIA) : null);

/** ¿Ante quién se radica? { tipo: 'EPS'|'ARL', nombre, deMaestro } — nombre vacío si no se sabe. */
function entidadDe(exp, maestro) {
  const tipo = exp.codigoTipo === '019' ? 'ARL' : 'EPS';
  const manual = (exp.radicacion || {}).entidad;
  const m = maestro && maestro.porCedula.get(textoLlave(exp.cedula));
  if (manual && manual.nombre) return { tipo, nombre: manual.nombre, manual: true, maestro: m || null };
  return { tipo, nombre: m ? (tipo === 'ARL' ? m.arl : m.eps) : '', enMaestro: !!m, maestro: m || null };
}

/** Plazo para radicar: { limite (fecha), dias, desde, regla } según la entidad y el tipo. */
function plazoRadicacion(exp, entidad) {
  const R = CONFIG.radicacion;
  if (exp.codigoTipo === '021') {
    return { limite: sumarDias(exp.fechaInicial, R.diasPlazoPaternidad), regla: `${R.diasPlazoPaternidad} días desde que inicia la licencia` };
  }
  const desde = exp.erp && exp.erp.registrado ? fechaATexto(new Date(exp.erp.registrado)) : hoyTexto();
  const especial = entidad.tipo === 'EPS' && R.plazosPorEntidad.find((p) => (entidad.nombre || '').includes(p.contiene.toUpperCase()));
  const dias = especial ? especial.dias : R.diasPlazo;
  return { limite: sumarDias(desde, dias), regla: `${dias} días desde que se registró en el ERP` };
}

/** Nombre para mostrar: "EPS SURA", "NUEVA EPS", "ARL SURA" (sin repetir "EPS" si ya lo trae). */
function textoEntidad(entidad) {
  if (!entidad.nombre) return `${entidad.tipo} sin definir`;
  return entidad.nombre.includes(entidad.tipo) ? entidad.nombre : `${entidad.tipo} ${entidad.nombre}`;
}

/** Formatos extra que pide la entidad (recordatorio). */
const formatosDe = (entidad) => CONFIG.radicacion.formatosPorEntidad.filter((f) => (entidad.nombre || '').includes(f.contiene.toUpperCase())).map((f) => f.texto);

/** ¿Se queda sin radicar? Las de la EPS (no accidente de trabajo) de 1 o 2 días no se radican. */
function noSeRadica(exp) {
  const dias = Number(exp.dias);
  return exp.codigoTipo !== '019' && dias >= 1 && dias <= (CONFIG.radicacion.diasSinRadicarEPS || 0);
}

/**
 * Etapa de la radicación: 'por_radicar' | 'radicada' | 'rechazada' | 'aprobada' | 'nomina'
 * | 'no_se_radica' (EPS de 1 o 2 días: finalizada sin radicado) — o null si todavía no aplica.
 */
function etapaRadicacion(exp) {
  if (!exp || (exp.estado !== 'registrada' && !(exp.radicacion && exp.radicacion.estado))) return null;
  const r = exp.radicacion || {};
  if (!r.estado && noSeRadica(exp)) return 'no_se_radica';
  return r.estado || 'por_radicar';
}

/** Mensaje de WhatsApp cuando la EPS/ARL rechaza (sin diagnóstico). */
function mensajeRechazoEPS(exp, entidad, causa, limite) {
  const primerNombre = nombreBonito(exp.nombre || '').split(/\s+/)[0] || '';
  return [
    `Hola ${primerNombre}, te escribimos de Gestión Humana de Supertiendas Cañaveral por tu ${nombreTipo(exp.codigoTipo).toLowerCase()} que empezó el ${fechaLarga(exp.fechaInicial)}.`,
    '',
    `La ${entidad.nombre ? textoEntidad(entidad) : entidad.tipo} la rechazó por este motivo: ${causa}.`,
    '',
    `Necesitamos que envíes de nuevo los documentos corregidos a más tardar el ${fechaLarga(limite)}. Entra otra vez a la página de incapacidades${CONFIG.enlaceAppColaborador ? ` (${CONFIG.enlaceAppColaborador})` : ''}, llena los mismos datos, sube los documentos y envía el paquete.`,
    '',
    'Si no los recibimos antes de esa fecha, esos días se reportarán a nómina como no justificados. ¡Gracias!',
  ].join('\n');
}

/**
 * Cambia una incapacidad desde una lista (sin abrir la ficha): la lee de nuevo,
 * aplica el cambio, lo anota en la bitácora y la guarda (con el control de choques).
 */
async function cambiarIncapacidad(x, usuario, modificar, accion) {
  const actual = await leerExpediente(x.carpeta);
  const copia = JSON.parse(JSON.stringify(actual));
  copia.radicacion = copia.radicacion || {};
  modificar(copia);
  anotar(copia, usuario, accion);
  return guardarExpediente(x.carpeta, copia);
}

/** Los PDF de una incapacidad, en el orden de los documentos: [{ id, nombre, archivo (File) }]. */
async function pdfsDeIncapacidad(x) {
  const exp = x.expediente, lista = [];
  for (const d of CONFIG.documentos) {
    const doc = (exp.documentos || {})[d.id];
    if (!doc || !doc.archivo || doc.revision === 'rechazado') continue;
    try { lista.push({ id: d.id, nombre: doc.archivo, archivo: await (await x.carpeta.getFileHandle(doc.archivo)).getFile() }); }
    catch (e) { /* si el archivo no está en la carpeta, se salta */ }
  }
  return lista;
}

/**
 * Adjuntos para radicar en el portal. Cada EPS los pide distinto:
 *   'unico'     → un solo PDF con todos los documentos (incapacidad + historia clínica…), en orden
 *   'separados' → un ZIP con un PDF por documento
 * Devuelve { blob, nombre }.
 */
async function adjuntosParaRadicar(x, como) {
  const exp = x.expediente;
  const pdfs = await pdfsDeIncapacidad(x);
  if (!pdfs.length) throw new Error('No se encontraron los PDF en la carpeta de la incapacidad.');
  const base = `${exp.cedula}_${exp.codigoTipo}_${exp.fechaInicial}`;
  if (como === 'unico') {
    if (!window.PDFLib) throw new Error('No cargó la librería para unir PDF. Revisa la conexión a internet y recarga la página.');
    const unido = await PDFLib.PDFDocument.create();
    for (const p of pdfs) {
      const doc = await PDFLib.PDFDocument.load(await p.archivo.arrayBuffer(), { ignoreEncryption: true });
      (await unido.copyPages(doc, doc.getPageIndices())).forEach((pagina) => unido.addPage(pagina));
    }
    return { blob: new Blob([await unido.save()], { type: 'application/pdf' }), nombre: `${base}.pdf` };
  }
  const zip = new JSZip();
  pdfs.forEach((p) => zip.file(p.nombre, p.archivo));
  return { blob: await zip.generateAsync({ type: 'blob', compression: 'STORE' }), nombre: `${base}.zip` };
}

/** Descarga un archivo (Blob) con ese nombre. */
function descargarBlob(blob, nombre) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = nombre; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

/** Reporte para nómina (faltas injustificadas). Sin diagnóstico. Devuelve un Blob xlsx. */
function reporteNomina(lista, maestro) {
  const tabla = [['Cédula', 'Nombres y apellidos', 'Concepto', 'Tipo', 'Fecha inicial', 'Fecha final', 'Días', 'Consec. TNL', 'Entidad', 'Radicado', 'Causa del rechazo', 'Fecha límite para reenviar', 'Reportada a nómina', 'Por']];
  lista.forEach((x) => {
    const e = x.expediente, r = e.radicacion || {}, ent = entidadDe(e, maestro);
    tabla.push([e.cedula, (e.nombre || '').toUpperCase(), e.codigoTipo, nombreTipo(e.codigoTipo), fechaERP(e.fechaInicial), fechaERP(e.fechaFinal), Number(e.dias) || '',
      (e.erp || {}).consecTNL || '', textoEntidad(ent), r.numero || '', (r.respuesta || {}).causa || '',
      r.solicitud ? fechaERP(r.solicitud.limite) : '', r.nomina ? fechaERP(fechaATexto(new Date(r.nomina.fecha))) : '', r.nomina ? r.nomina.por : '']);
  });
  const libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, XLSX.utils.aoa_to_sheet(tabla), 'Para nómina');
  return new Blob([XLSX.write(libro, { type: 'array', bookType: 'xlsx' })], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

/* ---------------------------------------------------------------------------
   PLANO DEL ERP
   Archivo Excel con el formato de carga de TNL del ERP: una fila por incapacidad,
   28 columnas (A a AB) con los mismos títulos del formato. En el formato:
     - AMARILLO = obligatorio: empresa, cédula, concepto, fechas, días, diagnóstico,
       clase de incapacidad e indicador de prórroga.
     - AZUL     = siempre 0: valores de liquidación, base, IBC, valor empresa 1 y 2
       y meses promedio (el ERP los calcula al importar con "valoriza al importar").
     - VERDE    = solo si es accidente de trabajo (019): fecha del accidente.
     - ROJO     = solo si es prórroga: número de prórroga (Consec. TNL anterior).
     - Las demás van vacías (el ERP las llena solo: contrato, consecutivo TNL, etc.).
   Fechas en número AAAAMMDD (ej. 20261001). El concepto va como texto ("018").
   --------------------------------------------------------------------------- */
const COLUMNAS_PLANO = [

  'OBSERVACION DE TNL (No obligatorio)',                     // K (vacía)
  'VALOR BASE DE LIQUIDACION (Obligatorio,  Incluye 2 decimales sin comas y puntos. si se  activa la casilla de verificación  [valoriza al  importar] se calcula automáticamente)', // L (0)
  'SERIE DE INCAPACIDAD (No obligatorio)',                   // M (vacía)

  'CLASE DE INCAPACIDAD (Obligatorio,  (1=Enfermedad General , 2=Maternidad,  3=Accidente de trabajo, 4=Enfermedad Profesional),   si el concepto esta configurado como [Clase de tiempo no laborado = otros]  se carga automaticamente en este campo [No aplica],indiferentemente que configuración este en el plano)', // P
