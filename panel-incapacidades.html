                      )}
                    </div>
                  ))}
                </div>
              </section>

              <section>
                <h3>Revisiones automáticas</h3>
                <p className="nota-seccion">El panel ya hizo estas cuentas por ti.</p>
                <ul className="tarjeta revisiones">
                  {revisiones.map((r, i) => (
                    <li key={i} className={`rev-${r.nivel}`}>
                      <span className="rev-icono" aria-hidden="true"><Icono nombre={r.nivel === 'ok' ? 'listo' : 'alerta'} tamano={15} /></span>
                      <span>{r.texto}</span>
                    </li>
                  ))}
                </ul>
              </section>

              <section>
                <h3>Bitácora</h3>
                <ul className="bitacora tarjeta">
                  {[...(exp.bitacora || [])].reverse().map((b, i) => <li key={i}><div>{b.accion}<span>{b.usuario}, {fechaCorta(b.fecha)}</span></div></li>)}
                </ul>
                <p className="nota-seccion" style={{ marginTop: 10 }}>Carpeta: {x.ruta}</p>
              </section>
            </div>

            {/* ---------- Derecha: datos para el ERP ---------- */}
            <div className="ficha-col ficha-lado">
              <section>
                <div className="titulo-con-boton">
                  <h3>Datos para el ERP</h3>
                  <button className="boton boton-texto" onClick={copiarTodo}><Icono nombre="copiar" tamano={16} /> Copiar todo</button>
                </div>
                <p className="nota-seccion">Toca un dato para copiarlo y pegarlo en el ERP. Si el documento dice otra cosa, corrígelo con el lápiz.</p>
                <div className="tarjeta">
                  {datos.map((d) => {
                    const original = d.id === 'consecAnterior' ? undefined : (exp.datosOriginales || {})[d.id];
                    const editado = original !== undefined && String(original ?? '') !== String(exp[d.id] ?? '');
                    const enEdicion = editando && editando.id === d.id;
                    return (
                      <div key={d.id} className={`dato ${enEdicion ? 'editando' : ''}`}>
                        {enEdicion ? (
                          <div className="dato-edicion">
                            <label htmlFor={`dato-${d.id}`}>{d.etiqueta}</label>
                            {d.editar === 'sino' ? (
                              <div className="segmento segmento-ancho" role="group" aria-label={d.etiqueta}>
                                {['Sí', 'No'].map((v) => <button key={v} aria-pressed={editando.valor === v} onClick={() => setEditando({ id: d.id, valor: v })}>{v}</button>)}
                              </div>
                            ) : (
                              <input id={`dato-${d.id}`} autoFocus type={d.editar === 'fecha' ? 'date' : d.editar === 'numero' ? 'number' : 'text'} min={d.editar === 'numero' ? 1 : undefined}
                                     value={editando.valor} onChange={(e) => setEditando({ id: d.id, valor: e.target.value })}
                                     onKeyDown={(e) => { if (e.key === 'Enter') guardarDato(d.id); if (e.key === 'Escape') setEditando(null); }} />
                            )}
                            {d.id === 'dias' && <small>La fecha final se recalcula sola.</small>}
                            <div className="acciones">
                              <button className="boton boton-secundario" onClick={() => setEditando(null)}>Cancelar</button>
                              <button className="boton boton-principal" disabled={guardando} onClick={() => guardarDato(d.id)}>Guardar</button>
                            </div>
                          </div>
                        ) : (
                          <>
                            <button className="dato-copiar" disabled={!d.valor} onClick={() => copiar(d.etiqueta, d.valor)} aria-label={`Copiar ${d.etiqueta}: ${d.valor}`}>
                              <span className="dato-etiqueta">{d.etiqueta}{editado && <span className="etiqueta-mini">Corregido</span>}{d.marca && <span className="etiqueta-mini">{d.marca}</span>}</span>
                              <span className={`dato-valor ${!d.valor ? 'vacio-dato' : ''}`}>{d.valor || d.vacio || '—'}</span>
                              {d.extra && <span className="dato-extra">{d.extra}</span>}
                              {editado && <span className="dato-extra">El colaborador puso: {d.id.startsWith('fecha') ? fechaERP(original) : d.id === 'prorroga' ? (original ? 'Sí' : 'No') : String(original ?? '—')}</span>}
                            </button>
                            <div className="dato-botones">
                              {d.valor && <span className="icono-copiar" aria-hidden="true"><Icono nombre="copiar" tamano={17} /></span>}
                              {d.editar && !cerrada && (
                                <button className="boton-icono" aria-label={`Corregir ${d.etiqueta}`} disabled={guardando}
                                        onClick={() => setEditando({ id: d.id, valor: d.editar === 'fecha' ? (exp[d.id] || '') : d.editar === 'sino' ? (exp[d.id] ? 'Sí' : 'No') : d.id === 'consecAnterior' ? (exp.erp.consecAnterior || '') : String(exp[d.id] ?? '') })}>
                                  <Icono nombre="corregir" tamano={17} />
                                </button>
                              )}
                            </div>
                          </>
                        )}
                      </div>
                    );
                  })}
                </div>
              </section>

              {exp.prorroga && !(tipoPorCodigo(exp.codigoTipo) || {}).esLicencia && (
                <EnlaceProrroga exp={exp} ctx={ctx} idPropio={x.id} bloqueado={guardando || cerrada}
                                onElegir={elegirAnterior} onAcumulado={guardarAcumulado} />
              )}

              <section>
                <h3>Contacto</h3>
                <div className="tarjeta">
                  <div className="dato"><div className="dato-copiar sin-boton"><span className="dato-etiqueta">Celular</span><span className="dato-valor numeros">{exp.celular || '—'}</span></div></div>
                  <div className="dato"><div className="dato-copiar sin-boton"><span className="dato-etiqueta">Sede</span><span className="dato-valor">{exp.sede || '—'}</span></div></div>
                  {exp.codigoTipo === '018' && <div className="dato"><div className="dato-copiar sin-boton"><span className="dato-etiqueta">¿Accidente de tránsito?</span><span className="dato-valor">{exp.accidenteTransito ? 'Sí (SOAT)' : 'No'}</span></div></div>}
                </div>
                {(exp.correcciones || []).length > 0 && (
                  <p className="nota-seccion" style={{ marginTop: 10 }}>Se le pidió corrección {plural(exp.correcciones.length, 'vez', 'veces')}; la última: {fechaCorta(exp.correcciones[exp.correcciones.length - 1].fecha)}.</p>
                )}
              </section>
            </div>
          </div>
        </div>
      </aside>

      {/* Hoja para pedir la corrección: el mensaje se puede ajustar antes de enviarlo */}
      {correccion !== null && (
        <div className="dialogo-fondo" onClick={() => setCorreccion(null)}>
          <div className="dialogo dialogo-ancho" role="dialog" aria-modal="true" aria-labelledby="titulo-correccion" onClick={(e) => e.stopPropagation()}>
            <h2 id="titulo-correccion">Pedir corrección a {nombreBonito(exp.nombre).split(/\s+/)[0]}</h2>
            <p>Revisa el mensaje; puedes cambiarlo. Al enviarlo, la incapacidad queda “Con corrección” hasta que reenvíe.</p>
            <textarea value={correccion} onChange={(e) => setCorreccion(e.target.value)} rows={10} aria-label="Mensaje de corrección" />
            {!celularValido && <div className="mensaje aviso">No hay un celular válido para WhatsApp. Copia el mensaje y envíalo por otro medio.</div>}
            <div className="acciones">
              <button className="boton boton-secundario" onClick={() => setCorreccion(null)}>Cancelar</button>
              <button className="boton boton-secundario" disabled={guardando || !correccion.trim()} onClick={() => enviarCorreccion('copiar')}><Icono nombre="copiar" tamano={16} /> Copiar</button>
              <button className="boton boton-principal" disabled={guardando || !celularValido || !correccion.trim()} onClick={() => enviarCorreccion('whatsapp')}><Icono nombre="mensaje" tamano={16} /> Abrir WhatsApp</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

/* ---------- Ficha: ¿de cuál incapacidad viene la prórroga? ----------
   Igual que la lupa de "Consecutivo TNL anterior" del ERP, pero con ayuda:
     1) SUGERIDO: el panel pre-escribe el consecutivo (la que terminó justo antes).
     2) ELEGIR OTRA: lista de las incapacidades del colaborador en el reporte del ERP
        (sirve cuando suben incapacidades viejas y la sugerida no es).
     3) ESCRIBIR: si el consecutivo no está en el histórico, se escriben a mano los
        días que llevaba acumulados la cadena; quedan guardados para la próxima. */
function EnlaceProrroga({ exp, ctx, idPropio, bloqueado, onElegir, onAcumulado }) {
  const [modo, setModo] = useState(null);           // null | 'lista' | 'escribir'
  const [consec, setConsec] = useState('');
  const [dias, setDias] = useState('');
  const c = cadenaDeIncapacidad(exp, ctx, idPropio);
  const elegido = (exp.erp || {}).anterior;
  const filas = ctx.indice.deCedula(exp.cedula).filter((f) => f.fechaInicial < exp.fechaInicial).slice(0, 12);
  const delPanel = ctx.todas.filter((x) => x.id !== idPropio && x.expediente && x.expediente.cedula === exp.cedula
    && x.expediente.fechaInicial < exp.fechaInicial && x.expediente.erp && x.expediente.erp.consecTNL
    && !ctx.indice.buscar(exp.cedula, x.expediente.erp.consecTNL));
  const NOMBRE_MODO = { sugerido: 'sugerido por el panel', elegido: 'elegido de la lista', escrito: 'consecutivo escrito', manual: 'días escritos a mano' };

  /** Texto corto de una fila del reporte: "018 · 22 oct → 31 oct 2026 · 10 días" */
  const resumenFila = (f) => `${f.concepto} — ${rangoFechas(f.fechaInicial, f.fechaFinal)} — ${plural(f.dias, 'día', 'días')}`;

  function enlazarEscrito() {
    const n = consec.trim();
    if (!n) return;
    const fila = ctx.indice.buscar(exp.cedula, n);
    onElegir({ consec: n, contrato: fila ? fila.contrato : null, modo: 'escrito' },
             fila ? `Enlazó con el consecutivo ${n} (escrito)` : `Escribió el consecutivo anterior ${n} (no está en el histórico)`)
      .then((ok) => ok && (setModo(null), setConsec('')));
  }
  function guardarDias(consecFalta) {
    const n = parseInt(dias, 10);
    if (!(n >= 1)) return;
    onAcumulado(consecFalta, n).then((ok) => ok && setDias(''));
  }

  return (
    <section>
      <h3>¿De cuál incapacidad viene?</h3>
      <p className="nota-seccion">Es el “Consecutivo TNL anterior” del ERP. Con él se suman los días de toda la cadena para las alertas de 30 y 150.</p>
      <div className="tarjeta enlace">
        {/* Qué hay ahora */}
        {elegido && elegido.consec ? (
          <div className="enlace-estado hecho">
            <strong>Enlazada con el consecutivo {elegido.consec}</strong>
            <span>{c.fila ? resumenFila(c.fila) : c.item ? `En el panel: ${rangoFechas(c.item.expediente.fechaInicial, c.item.expediente.fechaFinal)}` : 'No está en el histórico del ERP'} — {NOMBRE_MODO[elegido.modo] || elegido.modo}</span>
          </div>
        ) : c.sugerida ? (
          <div className="enlace-estado sugerido">
            <strong>{c.consec ? `Sugerido: consecutivo ${c.consec}` : 'La anterior está en el panel, sin consecutivo'}</strong>
            <span>{c.fila ? resumenFila(c.fila) : `${rangoFechas(c.item.expediente.fechaInicial, c.item.expediente.fechaFinal)} — ${nombreEstado(c.item.expediente.estado)}`}</span>
            {!c.consec && <span>Regístrala primero en el ERP y marca su consecutivo, o escribe el consecutivo a mano.</span>}
            {c.consec && !bloqueado && (
              <button className="boton boton-principal boton-chico" style={{ marginTop: 8, alignSelf: 'flex-start' }}
                      onClick={() => onElegir({ consec: c.consec, contrato: c.fila ? c.fila.contrato : null, modo: 'sugerido' }, `Enlazó con el consecutivo ${c.consec} (sugerido por el panel)`)}>
                Confirmar {c.consec}
              </button>
            )}
          </div>
        ) : (
          <div className="enlace-estado">
            <strong>No encontré la anterior</strong>
            <span>{ctx.indice.hay ? `No hay una incapacidad de este colaborador que termine en los ${CONFIG.diasMaximosProrroga} días antes. Elígela de la lista o escribe el consecutivo.` : 'No hay reporte del ERP cargado (mira “Reportes ERP”). Escribe el consecutivo y los días que llevaba.'}</span>
          </div>
        )}

        {/* Si la cadena llega a un consecutivo que no está en el histórico: días a mano */}
        {!c.completo && c.faltaConsec && (
          <div className="enlace-manual">
            <label htmlFor="dias-acumulados">Hasta el consecutivo <strong>{c.faltaConsec}</strong> (no está en el histórico), ¿cuántos días llevaba acumulados la cadena?</label>
            <div className="registrar">
              <input id="dias-acumulados" value={dias} onChange={(e) => setDias(e.target.value.replace(/\D/g, ''))} inputMode="numeric" maxLength={4} placeholder="Días" disabled={bloqueado} />
              <button className="boton boton-principal" disabled={bloqueado || !(parseInt(dias, 10) >= 1)} onClick={() => guardarDias(c.faltaConsec)}>Guardar días</button>
            </div>
            <small>Míralo en el ERP (“Total días” del consecutivo {c.faltaConsec}). Queda guardado para las próximas prórrogas.</small>
          </div>
        )}
        {c.manual && c.manual.por && (
          <div className="enlace-nota">Hasta el consecutivo {c.consec} iban {plural(c.manual.dias, 'día', 'días')} (escrito por {c.manual.por}, {fechaCorta(c.manual.fecha)}).</div>
        )}

        {/* Total */}
        {c.completo && !c.sinAnterior && (
          <div className="enlace-total">
            <span>{c.base} días antes + {exp.dias} de esta</span>
            <strong>{plural(c.total, 'día', 'días')} de cadena</strong>
          </div>
        )}

        {/* Cambiar */}
        {!bloqueado && (
          <div className="enlace-botones">
            {(filas.length > 0 || delPanel.length > 0) && <button className="boton boton-secundario boton-chico" aria-pressed={modo === 'lista'} onClick={() => setModo(modo === 'lista' ? null : 'lista')}>{c.sugerida || elegido ? 'Elegir otra' : 'Elegir de la lista'}</button>}
            <button className="boton boton-secundario boton-chico" aria-pressed={modo === 'escribir'} onClick={() => setModo(modo === 'escribir' ? null : 'escribir')}>Escribir consecutivo</button>
            {elegido && <button className="boton boton-texto boton-chico" onClick={() => onElegir(null, 'Quitó el consecutivo anterior')}>Quitar</button>}
          </div>
        )}
        {modo === 'lista' && (
          <ul className="enlace-lista">
            {delPanel.map((x) => (
              <li key={x.id}><button disabled={bloqueado} onClick={() => onElegir({ consec: x.expediente.erp.consecTNL, contrato: null, modo: 'elegido' }, `Enlazó con el consecutivo ${x.expediente.erp.consecTNL} (elegido de la lista)`).then((ok) => ok && setModo(null))}>
                <strong>{x.expediente.erp.consecTNL}</strong>
                <span>{x.expediente.codigoTipo} — {rangoFechas(x.expediente.fechaInicial, x.expediente.fechaFinal)} — {plural(x.expediente.dias, 'día', 'días')}</span>
                <small>Registrada desde el panel (aún no sale en el reporte)</small>
              </button></li>
            ))}
            {filas.map((f) => {
              const cad = ctx.indice.cadenaDe(f);
              return (
                <li key={f.clave}><button disabled={bloqueado} aria-current={String(c.consec) === f.consec ? 'true' : undefined}
                        onClick={() => onElegir({ consec: f.consec, contrato: f.contrato, modo: 'elegido' }, `Enlazó con el consecutivo ${f.consec} (elegido de la lista)`).then((ok) => ok && setModo(null))}>
                  <strong>{f.consec}</strong>
                  <span>{resumenFila(f)}{f.prorroga ? ' — prórroga' : ''}</span>
                  <small>{cad.completo ? `Cadena: ${plural(cad.total, 'día', 'días')}` : `Cadena: ${cad.total} días + lo anterior al ${cad.faltaConsec}`}{f.contrato !== '1' ? ` — contrato ${f.contrato}` : ''}</small>
                </button></li>
              );
            })}
          </ul>
        )}
        {modo === 'escribir' && (
          <div className="enlace-manual">
            <label htmlFor="consec-escrito">Consecutivo TNL anterior (como sale en el ERP)</label>
            <div className="registrar">
              <input id="consec-escrito" autoFocus value={consec} onChange={(e) => setConsec(e.target.value.replace(/\D/g, ''))} onKeyDown={(e) => e.key === 'Enter' && enlazarEscrito()} inputMode="numeric" maxLength={8} placeholder="Ej. 25" />
              <button className="boton boton-principal" disabled={bloqueado || !consec.trim()} onClick={enlazarEscrito}>Enlazar</button>
            </div>
            <small>Si no está en el histórico, enseguida te pide los días que llevaba acumulados.</small>
          </div>
        )}
      </div>
    </section>
  );
}

/* ---------- Alertas 30 / 150 ----------
   La gestora revisa cada alerta (que los días estén bien, que no haya un error de
   digitación) y la envía. Enviar = crear el archivo para Power Automate. */
const TEXTO_ESTADO_ALERTA = { sin_enviar: 'Sin enviar', cola: 'Esperando a Power Automate', enviada: 'Correo enviado', error: 'No se pudo enviar', descartada: 'No se envió' };

function Alertas({ ctx, usuario, onAbrir, onEnviar, onDescartar, onCancelar, onReintentar, irAReportes }) {
  const [filtro, setFiltro] = useState('por_enviar');
  const [revisando, setRevisando] = useState(null);         // alerta abierta en la hoja de revisión
  const lista = useMemo(() => calcularAlertas(ctx), [ctx]);
  const porEnviar = lista.filter((a) => a.estado === 'sin_enviar' || a.estado === 'error');
  const visibles = filtro === 'por_enviar' ? porEnviar : filtro === 'enviadas' ? lista.filter((a) => !porEnviar.includes(a)) : lista;
  const A = CONFIG.alertas;

  return (
    <>
      <header className="encabezado">
        <div>
          <h1>Alertas 30/150</h1>
          <p>Cadenas de prórrogas seguidas que pasan {A.umbral30} días, se acercan a {A.umbral150} (desde {A.avisoPrevio150}) o los pasan. Revisa los días y envía: Power Automate manda el correo.</p>
        </div>
      </header>
      {!ctx.indice.hay && (
        <div className="alerta aviso" style={{ marginBottom: 14 }}>
          No hay reporte del ERP cargado: solo se ven las cadenas que están en el panel.{' '}
          <button className="boton boton-texto" style={{ padding: 0, minHeight: 0 }} onClick={irAReportes}>Cargar reporte</button>
        </div>
      )}
      <div className="filtros">
        <div className="segmento segmento-filtro" role="group" aria-label="Filtrar alertas">
          {[['por_enviar', `Por enviar (${porEnviar.length})`], ['enviadas', `Enviadas (${lista.length - porEnviar.length})`], ['todas', 'Todas']].map(([id, texto]) => (
            <button key={id} aria-pressed={filtro === id} onClick={() => setFiltro(id)}>{texto}</button>
          ))}
        </div>
      </div>
      <div className="tarjeta">
        {!visibles.length ? (
          <div className="vacio">
            <div className="icono-caja"><Icono nombre="listo" tamano={28} /></div>
            <h3>{filtro === 'por_enviar' ? 'No hay alertas por enviar' : 'No hay alertas aquí'}</h3>
            <p>Solo aparecen cadenas activas: que siguen o terminaron hace {A.diasActiva} días o menos.</p>
          </div>
        ) : visibles.map((a) => (
          <div key={a.id} className="alerta-fila">
            <div className="fila-texto">
              <span className="fila-titulo">{nombreBonito(a.nombre)}</span>
              <span className="fila-sub numeros">C.C. {a.cedula}</span>
              {a.fuente === 'panel' && <button className="enlace-archivo" style={{ alignSelf: 'flex-start' }} onClick={() => onAbrir(a.x)}>Ver la incapacidad en el panel</button>}
            </div>
            <div className="alerta-cadena">
              <strong className="numeros">{a.c.total}<small> días</small></strong>
              <span>{a.c.eslabones === 1 ? 'Una sola incapacidad' : `${a.c.eslabones} incapacidades seguidas`}{a.c.inicio ? `, desde el ${fechaLarga(a.c.inicio)}` : ''}</span>
              <span>{a.fin >= hoyTexto() ? `Va hasta el ${fechaLarga(a.fin)}` : `Terminó el ${fechaLarga(a.fin)}`}{a.fuente === 'panel' ? ' (aún no está en el ERP)' : ''}</span>
              {!a.c.completo && <span className="aviso-doc">Le faltan los días antes del consecutivo {a.c.faltaConsec}: puede ser más.</span>}
            </div>
            <div><span className={`etiqueta-estado n-${a.nivel}`}>{TEXTO_NIVEL[a.nivel]}</span></div>
            <div className="alerta-accion">
              <EstadoAlerta a={a} onRevisar={() => setRevisando(a)} onCancelar={onCancelar} onReintentar={onReintentar} />
            </div>
          </div>
        ))}
      </div>
      {revisando && (
        <HojaEnviarAlerta a={revisando} ctx={ctx} usuario={usuario} onCerrar={() => setRevisando(null)}
                          onEnviar={(nota) => onEnviar(revisando, nota).then((ok) => ok && setRevisando(null))}
                          onDescartar={(motivo) => onDescartar(revisando, motivo).then((ok) => ok && setRevisando(null))} />
      )}
    </>
  );
}

/** En qué va una alerta y qué se puede hacer. */
function EstadoAlerta({ a, onRevisar, onCancelar, onReintentar }) {
  const d = (a.envio && a.envio.datos) || {};
  if (a.estado === 'sin_enviar') return <button className="boton boton-principal" onClick={onRevisar}>Revisar y enviar</button>;
  if (a.estado === 'cola') {
    const minutos = Math.round((Date.now() - a.envio.fecha) / 60000);
    return (
      <div className="gestionada">
        <strong className="en-cola">Esperando a Power Automate</strong>
        <span>{d.creadoPor || ''}{d.creado ? `, ${fechaCorta(d.creado)}` : ''}</span>
        {minutos > 60 && <span className="aviso-doc">Lleva más de una hora: revisa que el flujo esté encendido y que OneDrive esté sincronizado.</span>}
        <button className="boton boton-texto boton-chico" onClick={() => onCancelar(a)}>Cancelar envío</button>
      </div>
    );
  }
  if (a.estado === 'enviada') {
    return (
      <div className="gestionada">
        <strong>Correo enviado</strong>
        <span>{fechaCorta(d.enviado || a.envio.fecha)}</span>
        {d.destinatarios && <span>A: {d.destinatarios}</span>}
      </div>
    );
  }
  if (a.estado === 'error') {
    return (
      <div className="gestionada">
        <strong className="con-error">No se pudo enviar</strong>
        {d.error && <span>{String(d.error).slice(0, 160)}</span>}
        <button className="boton boton-suave boton-chico" onClick={() => onReintentar(a)}>Reintentar</button>
      </div>
    );
  }
  return (
    <div className="gestionada">
      <strong className="descartada">No se envió</strong>
      <span>{a.descartada.por}, {fechaCorta(a.descartada.fecha)}</span>
      {a.descartada.nota && <span>“{a.descartada.nota}”</span>}
    </div>
  );
}

/** Hoja para revisar la cadena antes de enviar: la gestora confirma que los días están bien. */
function HojaEnviarAlerta({ a, ctx, usuario, onCerrar, onEnviar, onDescartar }) {
  const [revisado, setRevisado] = useState(false);
  const [nota, setNota] = useState('');
  const [descartando, setDescartando] = useState(false);
  const [ocupado, setOcupado] = useState(false);
  const incapacidades = useMemo(() => incapacidadesDeLaCadena(a, ctx), [a, ctx]);
  const hacer = (fn) => { setOcupado(true); fn().finally(() => setOcupado(false)); };

  return (
    <div className="dialogo-fondo" onClick={onCerrar}>
      <div className="dialogo dialogo-ancho" role="dialog" aria-modal="true" aria-labelledby="titulo-alerta" onClick={(e) => e.stopPropagation()}>
        <h2 id="titulo-alerta">{TEXTO_NIVEL[a.nivel]}: {nombreBonito(a.nombre)}</h2>
        <p>Revisa que estas incapacidades sean seguidas y que los días estén bien. Al enviar, Power Automate manda el correo de {a.nivel === 'a30' ? '30 días' : '150 días'}.</p>
        <ul className="cadena-revision">
          {incapacidades.map((i, n) => (
            <li key={n}>
              <strong className="numeros">{i.consec || '—'}</strong>
              <span>{i.fuente === 'manual' ? 'Días anteriores escritos a mano' : `${i.concepto} — ${rangoFechas(i.fechaInicial, i.fechaFinal)}`}{i.fuente === 'panel' ? ' (en el panel)' : ''}</span>
              <span className="numeros dias">{i.dias === null || i.dias === undefined ? '¿?' : plural(i.dias, 'día', 'días')}</span>
            </li>
          ))}
          <li className="total"><strong /><span>Total de la cadena</span><span className="numeros dias">{plural(a.c.total, 'día', 'días')}</span></li>
        </ul>
        {!a.c.completo && <div className="mensaje aviso">La cadena viene de antes del consecutivo {a.c.faltaConsec}, que no está en el histórico. Escribe sus días en “Reportes ERP” o en la ficha para que el total sea real.</div>}
        {!descartando ? (
          <>
            <label className="casilla-linea">
              <input type="checkbox" checked={revisado} onChange={(e) => setRevisado(e.target.checked)} />
              <span>Revisé los días y están bien</span>
            </label>
            <input className="campo-nota" value={nota} maxLength={200} onChange={(e) => setNota(e.target.value)} placeholder="Nota para el correo (opcional)" aria-label="Nota para el correo" />
            <div className="acciones">
              <button className="boton boton-texto" onClick={() => setDescartando(true)}>No enviar</button>
              <span style={{ flex: 1 }} />
              <button className="boton boton-secundario" onClick={onCerrar}>Cancelar</button>
              <button className="boton boton-principal" disabled={!revisado || ocupado} onClick={() => hacer(() => onEnviar(nota.trim()))}><Icono nombre="mensaje" tamano={16} /> Enviar alerta</button>
            </div>
          </>
        ) : (
          <>
            <input className="campo-nota" autoFocus value={nota} maxLength={200} onChange={(e) => setNota(e.target.value)} placeholder="¿Por qué no se envía? Ej. los días están mal en el ERP" aria-label="Motivo para no enviar" />
            <div className="acciones">
              <span style={{ flex: 1 }} />
              <button className="boton boton-secundario" onClick={() => setDescartando(false)}>Volver</button>
              <button className="boton boton-principal" disabled={!nota.trim() || ocupado} onClick={() => hacer(() => onDescartar(nota.trim()))}>Guardar: no se envía</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/* ---------- Reportes del ERP (carpeta Fuentes) y doble verificación ---------- */
function Reportes({ reporte, maestro, ctx, cargando, onRecargar, onAgregar, onAbrir, onAcumulado }) {
  // Los otros archivos de Fuentes, sin contar el maestro de personal (que también vive ahí)
  const otrosReportes = reporte ? (reporte.otros || 0) - (maestro && maestro.archivo !== reporte.archivo ? 1 : 0) : 0;
  const selector = useRef(null);
  const [escribiendo, setEscribiendo] = useState(null);   // { clave, dias }
  const ver = useMemo(() => (reporte && ctx.indice.hay ? verificarContraReporte(ctx, reporte) : null), [ctx, reporte]);

  // Prórrogas del reporte cuya anterior no está (histórico borrado) y nadie ha escrito sus días
  const sinAnterior = useMemo(() => {
    const l = [];
    ctx.indice.porClave.forEach((f) => {
      if (!f.prorroga || !f.anterior) return;
      if (ctx.indice.porClave.has(`${f.cedula}|${f.contrato}|${f.anterior}`) || ctx.indice.acumulados[`${f.cedula}|${f.anterior}`]) return;
      if (l.some((x) => x.cedula === f.cedula && x.anterior === f.anterior)) return;
      l.push(f);
    });
    return l.sort((a, b) => b.fechaFinal.localeCompare(a.fechaFinal));
  }, [ctx]);
  const acumulados = Object.entries(ctx.indice.acumulados || {}).sort((a, b) => (b[1].fecha || '').localeCompare(a[1].fecha || ''));
  const cedulas = reporte ? new Set(reporte.filas.map((f) => f.cedula)).size : 0;
  const prorrogas = reporte ? reporte.filas.filter((f) => f.prorroga).length : 0;

  const FilaVer = ({ v, texto }) => (
    <div className="fila fila-tocable" role="button" tabIndex={0} onClick={() => onAbrir(v.x)} onKeyDown={(e) => e.key === 'Enter' && onAbrir(v.x)}>
      <div className="icono-caja malo"><Icono nombre="alerta" /></div>
      <div className="fila-texto">
        <span className="fila-titulo">{nombreBonito(v.x.expediente.nombre)} <span className="fila-sub numeros">— consecutivo {v.x.expediente.erp.consecTNL}</span></span>
        <span className="fila-sub">{rangoFechas(v.x.expediente.fechaInicial, v.x.expediente.fechaFinal)}, {plural(v.x.expediente.dias, 'día', 'días')}</span>
        {texto && <span className="fila-pista">{texto}</span>}
        {v.cambios && v.cambios.map((c) => <div key={c.que} className="mensaje error">{c.que}: en el panel {String(c.panel || '—')}, en el ERP {String(c.erp || '—')}</div>)}
      </div>
    </div>
  );

  return (
    <>
      <input ref={selector} type="file" accept=".xlsx,.xls,.xlsm,.csv" hidden onChange={(e) => { onAgregar([...e.target.files]); e.target.value = ''; }} />
      <header className="encabezado">
        <div>
          <h1>Reportes del ERP</h1>
          <p>El reporte de tiempos no laborados (TNL) que se exporta del ERP. Se lee aquí mismo y no se acumula: siempre se usa el más reciente de la carpeta “{C.fuentes}”.</p>
        </div>
        <div className="acciones">
          <button className="boton boton-secundario" onClick={onRecargar} disabled={cargando}><Icono nombre="recargar" tamano={18} /> Actualizar</button>
          <button className="boton boton-principal" onClick={() => selector.current.click()}><Icono nombre="subir" tamano={18} /> Agregar reporte</button>
        </div>
      </header>

      {!reporte ? (
        <div className="tarjeta">
          <div className="vacio">
            <div className="icono-caja"><Icono nombre="base" tamano={28} /></div>
            <h3>No hay reporte cargado</h3>
            <p>El panel funciona igual sin él: en cada prórroga se escriben a mano el consecutivo anterior y los días que llevaba. Con el reporte, el panel los sugiere solo y calcula las alertas con todo el histórico.</p>
          </div>
          <ol className="pasos-arranque" style={{ margin: '0 16px 16px' }}>
            <li><span aria-hidden="true" /><span>En el ERP, exporta a Excel el reporte de <strong>tiempos no laborados</strong> (el mismo de la hoja B_INCAPACIDADES), con al menos el último año.</span></li>
            <li><span aria-hidden="true" /><span>Guárdalo en la carpeta <strong>{C.fuentes}</strong> (o toca “Agregar reporte”).</span></li>
            <li><span aria-hidden="true" /><span>Toca <strong>Actualizar</strong>. Cuando exportes uno nuevo, déjalo ahí mismo: se usa el más reciente.</span></li>
          </ol>
        </div>
      ) : (
        <>
          <section className="grupo">
            <h3 className="grupo-titulo">Reporte en uso</h3>
            <div className="tarjeta">
              <div className="fila">
                <div className={`icono-caja ${reporte.errores.length ? 'malo' : ''}`}><Icono nombre={reporte.errores.length ? 'alerta' : 'base'} /></div>
                <div className="fila-texto">
                  <span className="fila-titulo" style={{ overflowWrap: 'anywhere' }}>{reporte.archivo}</span>
                  <span className="fila-sub">Guardado el {fechaCorta(reporte.modificado)}{otrosReportes > 0 ? ` — hay ${plural(otrosReportes, 'reporte más viejo', 'reportes más viejos')} en la carpeta que no se usan` : ''}</span>
                  {!reporte.errores.length && <span className="fila-pista numeros">{plural(reporte.filas.length, 'incapacidad', 'incapacidades')} de {plural(cedulas, 'colaborador', 'colaboradores')} ({plural(prorrogas, 'prórroga', 'prórrogas')}), del {fechaLarga(reporte.desde)} al {fechaLarga(reporte.hasta)}. {plural(reporte.totalFilas - reporte.filas.length, 'fila', 'filas')} de otros conceptos (vacaciones, permisos…) no cuentan.</span>}
                  {(reporte.errores.length > 0 || reporte.avisos.length > 0) && (
                    <div className="mensajes">
                      {reporte.errores.map((m, i) => <div key={'e' + i} className="mensaje error">{m}</div>)}
                      {reporte.avisos.map((m, i) => <div key={'a' + i} className="mensaje aviso">{m}</div>)}
                    </div>
                  )}
                </div>
              </div>
            </div>
          </section>

          {ver && (
            <section className="grupo">
              <h3 className="grupo-titulo">Doble verificación: lo registrado desde el panel contra el reporte</h3>
              <div className="cifras-ver">
                <div><strong className="numeros">{ver.confirmadas.length}</strong><span>coinciden</span></div>
                <div className={ver.diferencias.length ? 'mal' : ''}><strong className="numeros">{ver.diferencias.length}</strong><span>con diferencias</span></div>
                <div className={ver.noAparecen.length ? 'mal' : ''}><strong className="numeros">{ver.noAparecen.length}</strong><span>no aparecen</span></div>
                <div><strong className="numeros">{ver.pendientesDeReporte.length}</strong><span>registradas después del reporte</span></div>
              </div>
              {(ver.diferencias.length > 0 || ver.noAparecen.length > 0) && (
                <div className="tarjeta">
                  {ver.diferencias.map((v) => <FilaVer key={v.x.id} v={v} />)}
                  {ver.noAparecen.map((v) => <FilaVer key={v.x.id} v={v} texto="Se marcó registrada con este consecutivo, pero no aparece en el reporte. Revisa el número en el ERP." />)}
                </div>
              )}
            </section>
          )}

          {sinAnterior.length > 0 && (
            <section className="grupo">
              <h3 className="grupo-titulo">Prórrogas cuya anterior no está en el reporte ({sinAnterior.length})</h3>
              <p className="grupo-pie" style={{ marginTop: 0, marginBottom: 8 }}>Pasa cuando el histórico se borró. Escribe cuántos días llevaba la cadena hasta ese consecutivo (“Total días” en el ERP) y las alertas lo suman.</p>
              <div className="tarjeta">
                {sinAnterior.slice(0, 40).map((f) => {
                  const clave = `${f.cedula}|${f.anterior}`;
                  return (
                    <div key={clave} className="fila">
                      <div className="icono-caja info"><Icono nombre="corregir" /></div>
                      <div className="fila-texto">
                        <span className="fila-titulo">{nombreBonito(f.nombre) || `C.C. ${f.cedula}`}</span>
                        <span className="fila-sub"><span className="numeros">C.C. {f.cedula}</span> — el consecutivo {f.consec} ({rangoFechas(f.fechaInicial, f.fechaFinal)}) viene del <strong>{f.anterior}</strong>, que no está</span>
                        {escribiendo && escribiendo.clave === clave && (
                          <div className="registrar">
                            <input autoFocus value={escribiendo.dias} onChange={(e) => setEscribiendo({ clave, dias: e.target.value.replace(/\D/g, '') })} inputMode="numeric" maxLength={4} placeholder={`Días hasta el ${f.anterior}`} aria-label={`Días acumulados hasta el consecutivo ${f.anterior}`} />
                            <button className="boton boton-secundario" onClick={() => setEscribiendo(null)}>Cancelar</button>
                            <button className="boton boton-principal" disabled={!(parseInt(escribiendo.dias, 10) >= 1)}
                                    onClick={() => onAcumulado(f, parseInt(escribiendo.dias, 10)).then(() => setEscribiendo(null))}>Guardar</button>
                          </div>
                        )}
                      </div>
                      {!(escribiendo && escribiendo.clave === clave) && <div className="fila-lado"><button className="boton boton-suave" onClick={() => setEscribiendo({ clave, dias: '' })}>Escribir días</button></div>}
                    </div>
                  );
                })}
              </div>
              {sinAnterior.length > 40 && <p className="grupo-pie">Se muestran las 40 más recientes.</p>}
            </section>
          )}
        </>
      )}

      {acumulados.length > 0 && (
        <section className="grupo">
          <h3 className="grupo-titulo">Días acumulados escritos a mano ({acumulados.length})</h3>
          <div className="tarjeta">
            {acumulados.slice(0, 50).map(([clave, a]) => {
              const [cedula, consec] = clave.split('|');
              return (
                <div key={clave} className="fila">
                  <div className="icono-caja"><Icono nombre="listo" /></div>
                  <div className="fila-texto">
                    <span className="fila-titulo">{a.nombre ? nombreBonito(a.nombre) : `C.C. ${cedula}`}</span>
                    <span className="fila-sub"><span className="numeros">C.C. {cedula}</span> — hasta el consecutivo {consec}: <strong>{plural(a.dias, 'día', 'días')}</strong></span>
                    <span className="fila-pista">{a.por}, {fechaCorta(a.fecha)}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </section>
      )}
    </>
  );
}

/* ==========================================================================
   10. APP PRINCIPAL
   ========================================================================== */
function App() {
  const [fase, setFase] = useState('cargando');        // cargando | arranque | listo
  const [raiz, setRaiz] = useState(null);               // carpeta "Incapacidades"
  const [usuario, setUsuario] = useState('');
  const [modoEjemplo, setModoEjemplo] = useState(null);  // null = carpeta real
  const [recordada, setRecordada] = useState(null);
  const [errorArranque, setErrorArranque] = useState('');
  const [vista, setVista] = useState('bandeja');
  const [bandeja, setBandeja] = useState([]);
  const [incapacidades, setIncapacidades] = useState([]);
  const [cargando, setCargando] = useState(false);
  const [procesando, setProcesando] = useState(false);
  const [lote, setLote] = useState(null);
  const [abierta, setAbierta] = useState(null);
  const [aviso, setAviso] = useState(null);
  const [editarNombre, setEditarNombre] = useState(false);
  const [reporte, setReporte] = useState(null);         // reporte de TNL del ERP (carpeta Fuentes)
  const [control, setControl] = useState(controlVacio()); // control.json: días escritos a mano y alertas que no se envían
  const [envios, setEnvios] = useState({});              // archivos de alerta en Alertas/Pendientes, Enviadas y Errores
  const reporteGuardado = useRef(null);                  // para no volver a leer el mismo reporte
  const [maestro, setMaestro] = useState(null);          // maestro de personal (carpeta Fuentes): EPS y ARL
  const maestroGuardado = useRef(null);
  const temporizador = useRef(null);

  // Índice del reporte y "contexto" que usan la ficha, las alertas y la verificación
  const indice = useMemo(() => indexarReporte(reporte && !reporte.errores.length ? reporte : null, control), [reporte, control]);
  const ctx = useMemo(() => ({ todas: incapacidades, indice, control, envios }), [incapacidades, indice, control, envios]);

  const avisar = useCallback((texto, tipo = 'ok') => {
    setAviso({ texto, tipo });
    clearTimeout(temporizador.current);
    temporizador.current = setTimeout(() => setAviso(null), tipo === 'error' ? 7000 : 3500);
  }, []);

  useEffect(() => {
    (async () => {
      const [carpeta, u] = await Promise.all([recuperar('carpeta'), recuperar('usuario')]);
      if (u) setUsuario(u);
      if (carpeta && u) setRecordada(carpeta);
      setFase('arranque');
    })();
  }, []);

  /** Lee de nuevo la bandeja y las incapacidades. */
  const recargar = useCallback(async (carpeta = raiz) => {
    if (!carpeta) return;
    setCargando(true);
    try {
      const items = await buscarEnRecibidos(carpeta);
      setBandeja(items);
      const todas = await leerIncapacidades(carpeta);
      setIncapacidades(todas);
      // Reporte del ERP y control (si el reporte falla, el panel sigue funcionando sin él)
      setControl(await leerControl(carpeta));
      setEnvios(await leerEnviosAlertas(carpeta));
      try {
        const rep = await leerReporte(carpeta, reporteGuardado.current);
        reporteGuardado.current = rep;
        setReporte(rep);
      } catch (e) {
        console.error(e);
        setReporte({ archivo: '(no se pudo leer)', modificado: Date.now(), filas: [], errores: [`No se pudo leer el reporte: ${e.message}`], avisos: [], totalFilas: 0 });
      }
      try {
        const m = await leerMaestro(carpeta, maestroGuardado.current);
        maestroGuardado.current = m;
        setMaestro(m);
      } catch (e) { console.error(e); setMaestro(null); }
      const revisados = [];
      for (const item of items) revisados.push({ ...item, analisis: await analizarArchivo(item, todas) });
      setBandeja(revisados);
    } catch (e) {
      console.error(e);
      avisar(`No se pudo leer la carpeta: ${e.message}`, 'error');
    } finally { setCargando(false); }
  }, [raiz, avisar]);

  const recargarIncapacidades = useCallback(async () => {
    if (raiz) setIncapacidades(await leerIncapacidades(raiz));
  }, [raiz]);

  async function entrar(carpeta, nombreUsuario, ejemplo = null) {
    const creadas = await prepararEstructura(carpeta);
    setRaiz(carpeta); setUsuario(nombreUsuario); setModoEjemplo(ejemplo);
    setFase('listo'); setErrorArranque('');
    if (!ejemplo) {
      await recordar('carpeta', carpeta);
      await recordar('usuario', nombreUsuario);
      if (creadas.length) avisar(`Se crearon las carpetas: ${creadas.join(', ')}`);
    }
    await recargar(carpeta);
  }

  async function alElegirCarpeta(carpeta, nombreUsuario, error) {
    if (error || !carpeta) {
      setErrorArranque(error && error.name === 'SecurityError'
        ? 'El navegador no deja abrir carpetas desde esta vista previa. Abre el panel en su propia pestaña (GitHub Pages).'
        : `No se pudo abrir la carpeta: ${error ? error.message : ''}`);
      return;
    }
    try { setVista('bandeja'); await entrar(carpeta, nombreUsuario); }
    catch (e) { setErrorArranque(`No se pudo preparar la carpeta: ${e.message}`); }
  }

  async function reabrir(opcion) {
    if (opcion === 'otra') { setRecordada(null); return; }
    try {
      const permiso = await recordada.requestPermission({ mode: 'readwrite' });
      if (permiso !== 'granted') { setErrorArranque('Sin permiso no se puede leer la carpeta. Vuelve a intentarlo y acepta.'); return; }
      setVista('bandeja'); await entrar(recordada, usuario);
    } catch (e) {
      setErrorArranque('No se encontró la carpeta. Puede que la hayan movido o renombrado: elígela de nuevo.');
      setRecordada(null);
    }
  }

  async function abrirEjemplo(nombreUsuario, modo = 'normal') {
    const primeraVez = !modoEjemplo;
    setFase('cargando'); setAbierta(null);
    reporteGuardado.current = null; setReporte(null); setControl(controlVacio()); setEnvios({});
    const carpeta = await crearCarpetaDeEjemplo(modo);
    if (primeraVez) setVista('bandeja');
    await entrar(carpeta, nombreUsuario, modo);
  }

  async function procesar(item, silencioso = false) {
    setProcesando(true);
    try {
      const r = await procesarZip(raiz, item, usuario, await leerIncapacidades(raiz));
      if (!silencioso) avisar(r.esReenvio ? `Reenvío de ${nombreBonito(r.nombre)}: quedó en “Por revisar”` : `${nombreBonito(r.nombre)}: quedó en “Por revisar”`);
      return true;
    } catch (e) {
      console.error(e);
      avisar(e instanceof ErrorChoque ? e.message : `No se pudo procesar ${item.nombre}: ${e.message}`, 'error');
      return false;
    } finally {
      setProcesando(false);
      if (!silencioso) await recargar();
    }
  }

  async function procesarTodos() {
    const listos = bandeja.filter((x) => x.analisis && x.analisis.tipo !== 'invalido');
    let bien = 0;
    for (let i = 0; i < listos.length; i++) {
      setLote({ hechos: i, total: listos.length });
      if (await procesar(listos[i], true)) bien++;
    }
    setLote(null);
    await recargar();
    avisar(bien === listos.length ? `${plural(bien, 'incapacidad pasó', 'incapacidades pasaron')} a “Por revisar”` : `Se procesaron ${bien} de ${listos.length}; revisa las que quedaron`, bien === listos.length ? 'ok' : 'error');
  }

  async function agregarArchivos(archivos) {
    const zips = archivos.filter((f) => /\.zip$/i.test(f.name));
    if (!zips.length) { avisar('Solo se pueden agregar archivos .zip', 'error'); return; }
    try {
      const recibidos = await subcarpeta(raiz, C.recibidos);
      for (const f of zips) await escribir(recibidos, await nombreLibre(recibidos, f.name), f);
      avisar(zips.length < archivos.length ? `Se agregaron ${zips.length}; los que no eran .zip se ignoraron` : `${plural(zips.length, 'ZIP agregado', 'ZIP agregados')} a Recibidos`, zips.length < archivos.length ? 'error' : 'ok');
    } catch (e) { avisar(`No se pudo agregar: ${e.message}`, 'error'); }
    await recargar();
  }

  /** Cambia control.json (siempre sobre la versión más reciente del disco). */
  async function actualizarControl(modificar) {
    const nuevo = await cambiarControl(raiz, modificar);
    setControl(nuevo);
    return nuevo;
  }

  /* ----- Alertas: enviar (crear el archivo para Power Automate), no enviar, cancelar, reintentar ----- */
  async function recargarEnvios() { setEnvios(await leerEnviosAlertas(raiz)); }

  async function enviarAlerta(a, nota) {
    try {
      await crearArchivoAlerta(raiz, datosDeAlerta(a, ctx, usuario, nota));
      avisar(`Alerta de ${nombreBonito(a.nombre)} enviada a Power Automate`);
      await recargarEnvios();
      return true;
    } catch (e) { avisar(`No se pudo enviar: ${e.message}`, 'error'); await recargarEnvios(); return false; }
  }
  async function descartarAlerta(a, nota) {
    try {
      await actualizarControl((c) => {
        c.alertas[a.clave] = { ...(c.alertas[a.clave] || {}), [a.nivel]: { fecha: new Date().toISOString(), por: usuario, nota, total: a.c.total, cedula: a.cedula } };
      });
      avisar('Guardado: esta alerta no se envía');
      return true;
    } catch (e) { avisar(`No se pudo guardar: ${e.message}`, 'error'); return false; }
  }
  async function cancelarAlerta(a) {
    try { await cancelarArchivoAlerta(raiz, a.id); avisar('Se canceló el envío'); }
    catch (e) { avisar('No se pudo cancelar: puede que Power Automate ya la haya tomado. Toca Actualizar.', 'error'); }
    await recargarEnvios();
  }
  async function reintentarAlerta(a) {
    try { await reintentarArchivoAlerta(raiz, a.id, usuario); avisar('La alerta volvió a la cola de Power Automate'); }
    catch (e) { avisar(`No se pudo reintentar: ${e.message}`, 'error'); }
    await recargarEnvios();
  }

  /** Días escritos a mano desde "Reportes ERP" para una prórroga cuya anterior no está. */
  async function acumuladoDesdeReporte(f, dias) {
    try {
      await actualizarControl((c) => { c.acumulados[`${f.cedula}|${f.anterior}`] = { dias, por: usuario, fecha: new Date().toISOString(), nombre: f.nombre }; });
      avisar(`Guardado: hasta el consecutivo ${f.anterior} iban ${plural(dias, 'día', 'días')}`);
    } catch (e) { avisar(`No se pudo guardar: ${e.message}`, 'error'); }
  }

  async function agregarReporte(archivos) {
    const validos = archivos.filter((f) => /\.(xlsx|xlsm|xls|csv)$/i.test(f.name));
    if (!validos.length) { avisar('El reporte debe ser un archivo de Excel (.xlsx) o .csv', 'error'); return; }
    try {
      const fuentes = await subcarpeta(raiz, C.fuentes);
      for (const f of validos) await escribir(fuentes, await nombreLibre(fuentes, f.name), f);
      avisar('Reporte agregado a la carpeta Fuentes');
    } catch (e) { avisar(`No se pudo agregar: ${e.message}`, 'error'); }
    await recargar();
  }

  async function guardarNombre(nombre) {
    setUsuario(nombre); setEditarNombre(false);
    if (!modoEjemplo) await recordar('usuario', nombre);
  }

  function salir() {
    setRaiz(null); setBandeja([]); setIncapacidades([]); setAbierta(null);
    reporteGuardado.current = null; setReporte(null); setControl(controlVacio()); setEnvios({});
    if (!modoEjemplo) setRecordada(null);
    setModoEjemplo(null); setFase('arranque');
  }

  /** Al abrir una incapacidad desde el listado se usa su versión más reciente. */
  function abrir(x) { setAbierta(incapacidades.find((i) => i.id === x.id) || x); }

  if (fase === 'cargando') {
    return <div className="vacio" style={{ minHeight: '100vh', justifyContent: 'center' }}><span className="girando"><Icono nombre="cargando" tamano={28} /></span><p>Preparando…</p></div>;
  }
  if (fase === 'arranque') {
    return <PantallaArranque onCarpeta={alElegirCarpeta} onEjemplo={(u) => abrirEjemplo(u)} carpetaRecordada={recordada && recordada.name} onReabrir={reabrir} error={errorArranque} />;
  }

  const alertasPendientes = calcularAlertas(ctx).filter((a) => a.estado === 'sin_enviar' || a.estado === 'error').length;
  const cifras = {
    bandeja: bandeja.filter((x) => !x.analisis || x.analisis.tipo !== 'invalido').length,
    revisar: incapacidades.filter((x) => !x.expediente || ['recibida', 'revision'].includes(x.expediente.estado)).length,
    erp: incapacidades.filter((x) => x.expediente && x.expediente.estado === 'aprobada').length,
    alertas: alertasPendientes,
    reportes: reporte && reporte.errores.length ? 1 : 0,
    // Radicación: las que hay que radicar o pedir documentos (y el aviso del maestro viejo o faltante)
    radicacion: incapacidades.filter((x) => x.expediente && (etapaRadicacion(x.expediente) === 'por_radicar'
      || (etapaRadicacion(x.expediente) === 'rechazada' && !(x.expediente.radicacion || {}).solicitud))).length,
  };
  return (
    <div className="marco">
      <BarraLateral vista={vista} setVista={setVista} cifras={cifras} usuario={usuario} carpeta={raiz && raiz.name} esEjemplo={!!modoEjemplo}
                    onCambiarUsuario={() => setEditarNombre(true)} onSalir={salir} />
      <main className="trabajo">
        {vista === 'bandeja' && <Bandeja items={bandeja} cargando={cargando} onRecargar={() => recargar()} onProcesar={(i) => procesar(i)} onProcesarTodos={procesarTodos} procesando={procesando} lote={lote} onAgregar={agregarArchivos} />}
        {vista === 'incapacidades' && <Incapacidades key="revisar" modo="revisar" lista={incapacidades} cargando={cargando} onAbrir={abrir} onRecargar={() => recargar()} />}
        {vista === 'todas' && <Incapacidades key="todas" modo="todas" lista={incapacidades} cargando={cargando} onAbrir={abrir} onRecargar={() => recargar()} />}
        {vista === 'erp' && <ParaERP lista={incapacidades} ctx={ctx} onAbrir={abrir} avisar={avisar} />}
        {vista === 'radicacion' && <Radicacion lista={incapacidades} maestro={maestro} usuario={usuario} avisar={avisar} onAbrir={abrir} onCambio={recargarIncapacidades} />}
        {vista === 'alertas' && <Alertas ctx={ctx} usuario={usuario} onAbrir={abrir} onEnviar={enviarAlerta} onDescartar={descartarAlerta} onCancelar={cancelarAlerta} onReintentar={reintentarAlerta} irAReportes={() => setVista('reportes')} />}
        {vista === 'reportes' && <Reportes reporte={reporte} maestro={maestro} ctx={ctx} cargando={cargando} onRecargar={() => recargar()} onAgregar={agregarReporte} onAbrir={abrir} onAcumulado={acumuladoDesdeReporte} />}
      </main>
      {abierta && <Ficha key={abierta.id} x={abierta} ctx={ctx} usuario={usuario} avisar={avisar} onCambio={recargarIncapacidades} onControl={actualizarControl} onCerrar={() => setAbierta(null)} />}
      {editarNombre && <DialogoNombre actual={usuario} onGuardar={guardarNombre} onCancelar={() => setEditarNombre(false)} />}
      {aviso && (
        <div className={`aviso-flotante ${aviso.tipo === 'error' ? 'error' : ''} ${modoEjemplo ? 'sobre-selector' : ''}`} role="status">
          {aviso.tipo !== 'error' && <Icono nombre="listo" tamano={18} />}{aviso.texto}
        </div>
      )}
      {modoEjemplo && (
        <div className="selector-prueba" role="group" aria-label="Datos de ejemplo">
          {[['normal', 'Normal'], ['peor', 'Peor caso'], ['vacio', 'Vacío'], ['uno', 'Uno']].map(([id, texto]) => (
            <button key={id} aria-pressed={modoEjemplo === id} onClick={() => abrirEjemplo(usuario, id)}>{texto}</button>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('raiz')).render(<App />);
</script>
</body>
</html>
